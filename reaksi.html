<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Object Detection</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>

body{
    background:#111;
}

video{
    transform:scaleX(-1);
}

canvas{
    transform:scaleX(-1);
}

</style>

</head>

<body class="flex justify-center items-center min-h-screen p-6">

<div class="w-full max-w-5xl bg-zinc-900 rounded-3xl p-6 shadow-2xl">

<h1 class="text-4xl font-bold text-white text-center mb-2">
🤖 AI Object Detection
</h1>

<p class="text-center text-zinc-400 mb-6">
Deteksi benda realtime
</p>

<div class="relative">

<video
id="video"
autoplay
playsinline
class="w-full rounded-2xl">
</video>

<canvas
id="canvas"
class="absolute top-0 left-0 w-full h-full">
</canvas>

</div>

</div>

<script>

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");

const ctx = canvas.getContext("2d");

let detecting = true;

// ======================================
// CAMERA
// ======================================

async function setupCamera(){

    const stream =
        await navigator.mediaDevices.getUserMedia({
            video:true
        });

    video.srcObject = stream;
}

setupCamera();

// ======================================
// DETECT
// ======================================

async function detect(){

    if(!detecting) return;

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    const tempCanvas =
        document.createElement("canvas");

    tempCanvas.width = video.videoWidth;
    tempCanvas.height = video.videoHeight;

    const tempCtx =
        tempCanvas.getContext("2d");

    tempCtx.drawImage(
        video,
        0,
        0
    );

    const image =
        tempCanvas.toDataURL(
            "image/jpeg",
            0.7
        );

   const res = await fetch(
    "https://abelldeskiawan-gamon.hf.space/detect",
    {
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            image
        })
    }
);

    const data = await res.json();

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    if(data.objects){

        data.objects.forEach(obj=>{

            const x = obj.x1;
            const y = obj.y1;
            const w = obj.x2 - obj.x1;
            const h = obj.y2 - obj.y1;

            // BOX

            ctx.strokeStyle = "#00ff88";
            ctx.lineWidth = 4;

            ctx.strokeRect(
                x,
                y,
                w,
                h
            );

            // LABEL

            ctx.fillStyle = "#00ff88";

            ctx.font = "20px Arial";

            ctx.fillText(
                `${obj.name} ${obj.confidence}`,
                x,
                y - 10
            );
        });
    }

    setTimeout(detect,200);
}

video.addEventListener(
    "loadeddata",
    ()=>{
        detect();
    }
);

</script>

</body>
</html>
