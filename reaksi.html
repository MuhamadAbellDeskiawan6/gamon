<body class="font-body-md text-on-surface selection:bg-primary-container selection:text-on-primary-container">
<main class="relative z-10 flex flex-col items-center justify-center min-h-screen px-margin-mobile md:px-container-padding py-section-gap">

<span class="material-symbols-outlined transition-transform group-hover:-translate-x-1">arrow_back</span>
<span class="font-label-md text-label-md">Kembali ke Beranda</span>
</a>

<!-- Detection Container -->
<section class="glass-card w-full max-w-3xl p-gutter md:p-container-padding rounded-xl">
<div class="mb-gutter text-center">
<h1 class="font-display-lg text-headline-md md:text-display-lg text-primary mb-2">🤖 Deteksi Reaksi</h1>
<p class="font-body-md text-on-surface-variant">Kamera akan mendeteksi emosi dan objek di sekitarmu secara realtime.</p>
</div>

<!-- Camera Status -->
<div class="mb-gutter flex items-center gap-2 text-secondary">
<span class="material-symbols-outlined animate-pulse" style="font-variation-settings: 'FILL' 1;">videocam</span>

</div>

<!-- Video Canvas Container -->
<div class="relative bg-surface-container-low rounded-lg overflow-hidden mb-gutter">
<video
id="video"
autoplay
playsinline
class="w-full h-auto rounded-lg">
</video>

<canvas
id="canvas"
class="absolute top-0 left-0 w-full h-full">
</canvas>
</div>

<!-- Results History -->
<div class="mt-gutter">
<h2 class="font-headline-sm text-headline-sm text-primary mb-unit">Riwayat Deteksi</h2>
<div id="resultsList" class="space-y-2 max-h-64 overflow-y-auto bg-surface-container-low rounded-lg p-4">
<p class="text-on-surface-variant text-center py-4">Belum ada deteksi yet...</p>
</div>
</div>

<!-- Pagination Controls -->
<div class="mt-gutter flex justify-between items-center gap-2">
<button onclick="clearHistory()" class="px-6 py-2 rounded-full bg-error-container text-on-error-container text-label-md hover:brightness-95 transition-all">Bersihkan</button>
<span class="text-on-surface-variant text-label-md">Total: <span id="totalCount">0</span></span>
</div>
</section>
</main>

<script>

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const resultsList = document.getElementById("resultsList");
const totalCount = document.getElementById("totalCount");

let detecting = true;
let detectionHistory = JSON.parse(localStorage.getItem("detectionHistory")) || [];

// Load detection history from localStorage
function loadHistory() {
    displayHistory();
    updateCount();
}

// Save result to localStorage
function saveResult(text) {
    const result = {
        id: Date.now(),
        text: text,
        timestamp: new Date().toLocaleTimeString('id-ID')
    };
    detectionHistory.unshift(result);
    localStorage.setItem("detectionHistory", JSON.stringify(detectionHistory));
    displayHistory();
    updateCount();
}

// Display history in UI
function displayHistory() {
    if (detectionHistory.length === 0) {
        resultsList.innerHTML = '<p class="text-on-surface-variant text-center py-4">Belum ada deteksi...</p>';
        return;
    }
    
    resultsList.innerHTML = detectionHistory.map(item => `
        <div class="flex items-start justify-between bg-white rounded-lg p-3 border border-outline-variant">
            <div class="flex-1">
                <p class="text-on-surface font-body-md">${item.text}</p>
                <p class="text-on-surface-variant text-xs mt-1">${item.timestamp}</p>
            </div>
            <button onclick="removeResult(${item.id})" class="ml-2 text-error hover:brightness-90 transition">
                <span class="material-symbols-outlined text-sm">close</span>
            </button>
        </div>
    `).join('');
}

// Remove single result
function removeResult(id) {
    detectionHistory = detectionHistory.filter(item => item.id !== id);
    localStorage.setItem("detectionHistory", JSON.stringify(detectionHistory));
    displayHistory();
    updateCount();
}

// Clear all history
function clearHistory() {
    if (confirm('Hapus semua riwayat deteksi?')) {
        detectionHistory = [];
        localStorage.setItem("detectionHistory", JSON.stringify(detectionHistory));
        displayHistory();
        updateCount();
    }
}

// Update total count
function updateCount() {
    totalCount.textContent = detectionHistory.length;
}

// ======================================
// CAMERA
// ======================================

async function setupCamera(){
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: true
        });
        video.srcObject = stream;
    } catch (err) {
        alert('Akses kamera ditolak atau tidak tersedia.');
        console.error('Camera error:', err);
    }
}

setupCamera();

// ======================================
// DETECT
// ======================================

async function detect(){
    if(!detecting) return;

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    const tempCanvas = document.createElement("canvas");
    tempCanvas.width = video.videoWidth;
    tempCanvas.height = video.videoHeight;

    const tempCtx = tempCanvas.getContext("2d");
    tempCtx.drawImage(video, 0, 0);

    const image = tempCanvas.toDataURL("image/jpeg", 0.7);

    try {
        const res = await fetch(
            "https://abelldeskiawan-gamon.hf.space/detect",
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                    image
                })
            }
        );

        const data = await res.json();

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if(data.objects && data.objects.length > 0){
            let detectionText = [];
            
            data.objects.forEach(obj => {
                const x = obj.x1;
                const y = obj.y1;
                const w = obj.x2 - obj.x1;
                const h = obj.y2 - obj.y1;

                // BOX
                ctx.strokeStyle = "#d7c1c8";
                ctx.lineWidth = 3;
                ctx.strokeRect(x, y, w, h);

                // LABEL
                ctx.fillStyle = "#6b5a60";
                ctx.font = "bold 16px Inter";
                ctx.fillText(
                    `${obj.name} (${(obj.confidence * 100).toFixed(0)}%)`,
                    x,
                    y - 10
                );
                
                detectionText.push(`${obj.name} (${(obj.confidence * 100).toFixed(0)}%)`);
            });
            
            // Save detection result
            if (detectionText.length > 0) {
                saveResult(detectionText.join(", "));
            }
        }
    } catch (err) {
        console.error('Detection error:', err);
    }

    setTimeout(detect, 200);
}

video.addEventListener(
    "loadeddata",
    () => {
        detect();
    }
);

// Load history on page load
window.addEventListener("DOMContentLoaded", loadHistory);

</script>
