<script>
        // Soft Sparkle Particle Generator
        const starsContainer = document.getElementById('stars');
        const starCount = 60;

        for (let i = 0; i < starCount; i++) {
            const star = document.createElement('div');
            star.className = 'star-particle';
            const size = 2 + Math.random() * 4;
            star.style.width = `${size}px`;
            star.style.height = `${size}px`;
            star.style.left = `${Math.random() * 100}%`;
            star.style.top = `${Math.random() * 100}%`;
            star.style.animation = `pulse-soft ${3 + Math.random() * 6}s infinite ease-in-out`;
            star.style.animationDelay = `${Math.random() * 5}s`;
            starsContainer.appendChild(star);
        }

        // Menu Fitur Toggle
        const menuBtn = document.getElementById('menuBtn');
        const menuItems = document.getElementById('menuItems');
        const menuIcon = menuBtn.querySelector('.material-symbols-outlined');
        let menuOpen = false;

        menuBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            menuOpen = !menuOpen;
            if (menuOpen) {
                menuItems.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-4');
                menuItems.classList.add('opacity-100', 'pointer-events-auto', 'translate-y-0');
                menuIcon.textContent = 'close';
            } else {
                menuItems.classList.add('opacity-0', 'pointer-events-none', 'translate-y-4');
                menuItems.classList.remove('opacity-100', 'pointer-events-auto', 'translate-y-0');
                menuIcon.textContent = 'apps';
            }
        });

        // Close menu when clicking outside
        document.addEventListener('click', () => {
            if (menuOpen) {
                menuOpen = false;
                menuItems.classList.add('opacity-0', 'pointer-events-none', 'translate-y-4');
                menuItems.classList.remove('opacity-100', 'pointer-events-auto', 'translate-y-0');
                menuIcon.textContent = 'apps';
            }
        });

        // Music Toggle
        window.music = document.getElementById("bgMusic");
        window.btn = document.getElementById("musicToggle");

        window.isPlaying = false;

        window.btn.addEventListener("click", () => {
          if (window.isPlaying) {
            window.music.pause();
            window.btn.textContent = 'play_circle';
          } else {
            window.music.play();
            window.btn.textContent = 'pause_circle';
          }
          window.isPlaying = !window.isPlaying;
        });

        // Draggable Floating Cards Logic
        window.container = document.getElementById('container');
        let activeItem = null;
        let currentX;
        let currentY;
        let initialX;
        let initialY;
        let xOffset = 0;
        let yOffset = 0;
        window.currentCardZ = 1000;
        window.zoomLevel = 1;

        document.addEventListener("pointerdown", dragStart, false);
        document.addEventListener("pointerup", dragEnd, false);
        document.addEventListener("pointermove", drag, false);

        function bringToFront(el) {
            if (!el) return;
            window.currentCardZ += 1;
            el.style.zIndex = window.currentCardZ;
            el.classList.add('active-card');
            setTimeout(() => el.classList.remove('active-card'), 220);
        }

        function dragStart(e) {
            const path = (typeof e.composedPath === 'function') ? e.composedPath() : [e.target];
            if (path.some(node => node instanceof Element && node.matches && node.matches('button, audio, a, input, textarea'))) {
                return;
            }

            if (e.target.closest('.draggable')) {
                activeItem = e.target.closest('.draggable');
                bringToFront(activeItem);

                const style = window.getComputedStyle(activeItem);
                const matrix = new WebKitCSSMatrix(style.transform);
                xOffset = matrix.m41;
                yOffset = matrix.m42;

                const rect = (window.canvasContent || window.container).getBoundingClientRect();
                const pointerX = ((e.clientX - rect.left) / (window.zoomLevel || 1));
                const pointerY = ((e.clientY - rect.top) / (window.zoomLevel || 1));

                initialX = pointerX - xOffset;
                initialY = pointerY - yOffset;
            }
        }

        function dragEnd() {
            initialX = currentX;
            initialY = currentY;
            activeItem = null;
        }

        function drag(e) {
            if (activeItem) {
                e.preventDefault();
                const rect = (window.canvasContent || window.container).getBoundingClientRect();
                const pointerX = ((e.clientX - rect.left) / (window.zoomLevel || 1));
                const pointerY = ((e.clientY - rect.top) / (window.zoomLevel || 1));
                currentX = pointerX - initialX;
                currentY = pointerY - initialY;
                setTranslate(currentX, currentY, activeItem);
            }
        }

        function setTranslate(xPos, yPos, el) {
            const rotation = el.style.transform.match(/rotate\([^)]+\)/) || '';
            el.style.transform = `translate3d(${xPos}px, ${yPos}px, 0) ${rotation}`;
        }
    </script>

<script>
        const zoomOut = document.getElementById('zoomOut');
        const zoomIn = document.getElementById('zoomIn');
        const zoomReset = document.getElementById('zoomReset');
        const zoomLabel = document.getElementById('zoomLabel');
        const canvasStage = document.getElementById('canvasStage');
        const canvasContent = document.getElementById('canvasContent');
        window.canvasContent = canvasContent;
        let zoomLevel = 1;
        window.zoomLevel = zoomLevel;

        function updateZoom() {
            if (canvasContent) canvasContent.style.transform = `scale(${zoomLevel})`;
            window.zoomLevel = zoomLevel;
            zoomLabel.textContent = `${Math.round(zoomLevel * 100)}%`;
        }

        zoomOut.addEventListener('click', () => {
            zoomLevel = Math.max(0.6, zoomLevel - 0.1);
            updateZoom();
        });

        zoomIn.addEventListener('click', () => {
            zoomLevel = Math.min(1.4, zoomLevel + 0.1);
            updateZoom();
        });

        zoomReset.addEventListener('click', () => {
            zoomLevel = 1;
            updateZoom();
        });

        function getTouchDistance(touches) {
            const [a, b] = touches;
            return Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
        }

        let pinchStartDistance = 0;
        let pinchStartZoom = 1;

        canvasContent.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                pinchStartDistance = getTouchDistance(e.touches);
                pinchStartZoom = zoomLevel;
            }
        }, { passive: false });

        canvasContent.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2) {
                e.preventDefault();
                const distance = getTouchDistance(e.touches);
                if (pinchStartDistance > 0) {
                    zoomLevel = Math.min(1.4, Math.max(0.6, pinchStartZoom * distance / pinchStartDistance));
                    updateZoom();
                }
            }
        }, { passive: false });

        canvasContent.addEventListener('touchend', (e) => {
            if (e.touches.length < 2) {
                pinchStartDistance = 0;
            }
        });

        updateZoom();
    </script>

    card.className = 'draggable glass-card p-gutter rounded-xl w-[min(18rem,100%)] max-w-[280px]';

    const screenWidth = (window.canvasContent && window.canvasContent.clientWidth) || window.container.clientWidth || window.innerWidth;
    const screenHeight = (window.canvasContent && window.canvasContent.clientHeight) || window.container.clientHeight || window.innerHeight * 0.7;

    const maxCardWidth = 280;
    const maxCardHeight = 260;

    // Exclusion zone: avoid placing new cards over the header/title/buttons area on initial load
    const headerEl = document.querySelector('header');
    const headerRect = headerEl ? headerEl.getBoundingClientRect() : { bottom: 120 };
    const exclusionBottom = Math.max(0, headerRect.bottom + 12); // 12px gap after header

    // Compute random X within available width
    const randomX = Math.random() * Math.max(0, screenWidth - maxCardWidth);

    // Compute random Y but start after exclusionBottom so cards don't overlap header initially
    let availableHeight = Math.max(0, screenHeight - exclusionBottom - maxCardHeight);
    let randomY;
    if (availableHeight > 8) {
        randomY = exclusionBottom + Math.random() * availableHeight;
    } else {
        // fallback if not enough space: place anywhere within container (will still be draggable)
        randomY = Math.random() * Math.max(0, screenHeight - maxCardHeight);
    }

    card.style.position = 'absolute';
    card.style.left = `${randomX}px`;
    card.style.top = `${randomY}px`;
    card.style.transform = `rotate(${Math.random() * 6 - 3}deg)`;
    window.currentCardZ += 1;
    card.style.zIndex = window.currentCardZ;

    const nama = data.nama ? escapeHtml(data.nama) : "Anonim";
    const tujuan = data.tujuan ? escapeHtml(data.tujuan) : "Seseorang";
    const pesan = data.pesan ? escapeHtml(data.pesan) : "";
    const likes = data.likes || 0;
    const waktu = data.waktu ? 
        (data.waktu.toDate ? new Date(data.waktu.toDate()).toLocaleDateString('id-ID') : 
         typeof data.waktu === 'string' ? new Date(data.waktu).toLocaleDateString('id-ID') : 
         new Date(data.waktu).toLocaleDateString('id-ID')) : 
        "Hari ini";

    const audioHtml = data.audioUrl ? `
        <audio class="audio-custom w-full h-8 mb-4 rounded-full" controls playsinline preload="metadata" src="${data.audioUrl}">
        </audio>
    ` : '';

    card.innerHTML = `
        <div class="flex items-center justify-between mb-4 border-b border-black/5 pb-2 gap-3">
            <span class="font-label-md text-primary">${nama} <span class="text-on-surface-variant/60">ke</span> ${tujuan}</span>
            <div class="flex items-center gap-2">
                ${data.audioUrl ? `<span class="material-symbols-outlined text-sm text-on-surface-variant">volume_up</span>` : ''}
                <button type="button" class="toggle-detail-btn" aria-expanded="true" title="Toggle detail">
                    <span class="material-symbols-outlined">arrow_drop_down</span>
                </button>
            </div>
        </div>
        <div class="message-box font-body-md italic text-on-surface mb-4 leading-relaxed max-h-40 overflow-y-auto whitespace-pre-wrap">
            "${pesan}"
        </div>
        ${audioHtml}
        <div class="flex items-center justify-between">
            <button class="love-btn flex items-center gap-1 group" type="button">
                <span class="material-symbols-outlined text-error group-hover:scale-110 transition-transform" style="font-variation-settings: 'FILL' 1;">favorite</span>
                <span class="font-label-md text-on-surface-variant">${likes}</span>
            </button>
            <span class="font-label-md text-outline/60 text-xs">${waktu}</span>
        </div>
    `;

    // Append first to get dimensions
    (window.canvasContent || window.container).appendChild(card);

    const loveBtn = card.querySelector('.love-btn');
    const vnAudio = card.querySelector('audio');
    const postId = id;

    if (vnAudio) {
        vnAudio.addEventListener("play", () => {
            if (window.isPlaying) {
                window.music.pause();
                window.btn.textContent = 'play_circle';
                window.isPlaying = false;
            }
        });
    }

    const toggleBtn = card.querySelector('.toggle-detail-btn');
    const detailSection = card.querySelector('.message-box');
    const audioElement = card.querySelector('audio');

    if (likedPosts.includes(postId)) {
        loveBtn.classList.add('liked');
        loveBtn.disabled = true;
    }

    toggleBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const isCollapsed = card.classList.toggle('collapsed');
        toggleBtn.setAttribute('aria-expanded', String(!isCollapsed));
        toggleBtn.innerHTML = `<span class="material-symbols-outlined">${isCollapsed ? 'arrow_drop_up' : 'arrow_drop_down'}</span>`;
    });

    loveBtn.addEventListener('click', async (e) => {
        e.stopPropagation();
        if (likedPosts.includes(postId)) {
            alert("Kamu sudah kasih love 💔");
            return;
        }

        try {
            const postRef = doc(db, "gamon", postId);
            await updateDoc(postRef, {
                likes: increment(1)
            });

            likedPosts.push(postId);
            localStorage.setItem("likedPosts", JSON.stringify(likedPosts));

            loveBtn.classList.add('liked');
            loveBtn.disabled = true;

            // Animasi
            loveBtn.style.transform = "scale(1.2)";
            setTimeout(() => {
                loveBtn.style.transform = "scale(1)";
            }, 150);

            const count = loveBtn.querySelector('span:last-child');
            count.textContent = parseInt(count.textContent) + 1;

        } catch (err) {
            console.error(err);
            alert("Gagal like 😢");
        }
    });

    return card;
}

// Firestore Listener
onSnapshot(q, (snapshot) => {
    const target = (window.canvasContent || window.container);
    if (target) target.innerHTML = ""; // Clear existing cards only
    snapshot.forEach((doc) => {
        const data = doc.data();
        if (!data.pesan) return;
        createCard(data, doc.id);
    });
}, (error) => {
    console.error('Error in onSnapshot:', error);
});

// Simple HTML escape
function escapeHtml(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}
