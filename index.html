<style>
    body {
        background: linear-gradient(135deg, #f3e8ff 0%, #fff5f8 50%, #e0f2fe 100%);
        overflow-x: hidden;
        min-height: 100vh;
    }

    /* ── STAR & SPACE BACKGROUND DECORATION ── */
    .star-particle {
        position: absolute; background: #b794f4; border-radius: 50%; opacity: 0.4;
        pointer-events: none; box-shadow: 0 0 5px rgba(183,148,244,0.5);
    }
    .space-decor {
        position: absolute; pointer-events: none; opacity: 0.25; filter: blur(4px);
        animation: spaceFloat 18s infinite ease-in-out alternate;
    }
    @keyframes spaceFloat {
        0% { transform: translateY(0px) rotate(0deg) scale(1); }
        100% { transform: translateY(-30px) rotate(15deg) scale(1.15); }
    }
    @keyframes pulse-soft {
        0%,100%{transform:scale(1);opacity:.4}
        50%{transform:scale(1.6);opacity:.7}
    }

    /* ── BUBBLE CANVAS ── */
    #bubbleCanvas {
        position: relative;
        width: 100%;
        height: 70vh;
        min-height: 460px;
        overflow: hidden;
    }

    /* ── BUBBLE ── */
    .bubble {
        position: absolute;
        cursor: grab;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 2px; text-align: center; padding: 12px;
        background: rgba(255,255,255,0.65);
        border: 1.5px solid rgba(255,255,255,0.8);
        box-shadow: 0 6px 22px -8px rgba(107,90,96,0.18);
        backdrop-filter: blur(10px);
        user-select: none;
        box-sizing: border-box;
        overflow: hidden;
        touch-action: none; /* Cegah scroll browser saat di-drag di mobile */
    }
    .bubble:hover {
        box-shadow: 0 12px 32px -8px rgba(107,90,96,0.26);
        z-index: 50;
    }
    .bubble:active { cursor: grabbing; }

    /* Bentuk Awan / Bubble */
    .bubble.shape-circle { border-radius: 50%; }
    .bubble.shape-cloud { border-radius: 60% 40% 55% 45% / 45% 55% 45% 55%; }
    .bubble.shape-cloud-2 { border-radius: 45% 55% 40% 60% / 55% 45% 60% 40%; }
    .bubble.shape-blob { border-radius: 38% 62% 46% 54% / 54% 38% 62% 46%; }

    /* Varian Tipe */
    .bubble.type-curhat  { background: rgba(252,228,236,0.68); border-color: rgba(244,168,196,0.5); }
    .bubble.type-photobox{ background: rgba(237,229,252,0.68); border-color: rgba(196,174,248,0.5); }

    /* Animasi Melayang Lambat (CSS Floating) */
    .float-container {
        position: absolute;
        width: 84px;
        height: 84px;
        transition: transform 0.1s ease-out; /* Menghaluskan pergerakan awal */
    }
    @keyframes float-a { 0%,100%{transform:translate(0, 0)} 33%{transform:translate(4px, -10px)} 66%{transform:translate(-3px, -5px)} }
    @keyframes float-b { 0%,100%{transform:translate(0, 0)} 40%{transform:translate(-5px, -8px)} 70%{transform:translate(3px, -12px)} }
    @keyframes float-c { 0%,100%{transform:translate(0, 0)} 50%{transform:translate(3px, -7px)} }
    
    .float-a .bubble { animation: float-a var(--fd,6s) infinite ease-in-out var(--fdel,0s); }
    .float-b .bubble { animation: float-b var(--fd,6s) infinite ease-in-out var(--fdel,0s); }
    .float-c .bubble { animation: float-c var(--fd,6s) infinite ease-in-out var(--fdel,0s); }
    
    /* Matikan animasi melayang bawaan CSS ketika sedang di-drag agar posisi akurat */
    .dragging .bubble { animation: none !important; transform: scale(1.08) !important; z-index: 100; }

    .bubble-emoji { font-size: 1.15em; line-height:1; }
    .bubble-from  { font-size: 10px; font-weight: 700; color: #6b5a60; max-width: 90%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bubble-to    { font-size: 9px;  color: #a78ca2; max-width: 90%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bubble-likes { font-size: 9px; color: #e07ea0; display: flex; align-items: center; gap: 2px; margin-top: 1px; }

    /* ── MODAL OVERLAY ── */
    #modalOverlay {
        position: fixed; inset: 0; z-index: 500;
        background: rgba(40,20,34,0.38);
        backdrop-filter: blur(5px);
        display: flex; align-items: center; justify-content: center;
        opacity: 0; pointer-events: none;
        transition: opacity .22s ease;
    }
    #modalOverlay.show { opacity: 1; pointer-events: auto; }

    #modalBox {
        background: rgba(255,255,255,0.97);
        border-radius: 24px;
        border: 1.5px solid rgba(255,255,255,0.9);
        box-shadow: 0 24px 60px -16px rgba(107,90,96,0.28);
        width: 340px;
        max-width: calc(100vw - 32px);
        max-height: 80vh;
        overflow-y: auto;
        padding: 24px;
        position: relative;
        transform: scale(.88) translateY(12px);
        transition: transform .24s cubic-bezier(.34,1.56,.64,1);
    }
    #modalOverlay.show #modalBox { transform: scale(1) translateY(0); }

    #modalClose {
        position: absolute; top: 14px; right: 14px;
        width: 30px; height: 30px; border-radius: 50%;
        background: rgba(107,90,96,0.1); border: none; cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        font-size: 15px; color: #6b5a60; transition: background .15s;
    }
    #modalClose:hover { background: rgba(107,90,96,0.2); }

    .modal-badge {
        display: inline-flex; align-items: center; gap: 4px;
        font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 99px; margin-bottom: 12px;
    }
    .badge-curhat   { background: #fce4ec; color: #ad1457; }
    .badge-photobox { background: #ede0ff; color: #6d28d9; }

    #modalHeader { font-size: 15px; font-weight: 700; color: #6b5a60; margin-bottom: 12px; line-height: 1.4; }
    #modalHeader .to-label { color: #c09aaf; font-weight: 400; font-size: 13px; }

    #modalPhoto { width: 100%; border-radius: 12px; margin-bottom: 12px; display: none; }

    #modalMsg {
        font-size: 14px; color: #4d4447; line-height: 1.7; font-style: italic;
        background: rgba(107,90,96,0.05); border-radius: 12px; padding: 12px 14px;
        margin-bottom: 14px; white-space: pre-wrap;
        max-height: 160px;
        overflow-y: auto;
    }

    #modalAudio { width: 100%; border-radius: 99px; margin-bottom: 14px; display: none; }
    #modalAudio.has-audio { display: block; }
    #modalAudio::-webkit-media-controls-panel { background-color: #f2ecee; }

    .modal-footer { display: flex; align-items: center; justify-content: space-between; }
    #modalDate { font-size: 11px; color: #b0a0a8; }
    #modalLoveBtn {
        display: flex; align-items: center; gap: 5px;
        background: none; border: none; cursor: pointer;
        font-size: 12px; color: #e07ea0; font-weight: 600;
        padding: 5px 10px; border-radius: 99px;
        transition: background .15s;
    }
    #modalLoveBtn:hover { background: rgba(224,126,160,0.12); }
    #modalLoveBtn:disabled { opacity: .5; cursor: not-allowed; }
    #modalLoveBtn .material-symbols-outlined { font-size: 16px; }

    .glass-card {
        background: rgba(255,255,255,0.55);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255,255,255,0.45);
        box-shadow: 0 8px 24px -8px rgba(107,90,96,0.12);
    }

    @keyframes fadeInScale {
        from { opacity:0; transform:scale(.7); }
        to   { opacity:1; transform:scale(1); }
    }
    .bubble-enter { animation: fadeInScale .35s cubic-bezier(.34,1.56,.64,1) both; }

    #hintBar {
        text-align: center; padding: 0.5rem 1rem 2rem;
        font-size: 13px; color: rgba(107,90,96,0.5);
        display: flex; align-items: center; justify-content: center; gap: 6px;
    }

    #loadingMsg { text-align:center; padding:4rem 1rem; color: rgba(107,90,96,0.4); font-size:14px; }

    @media(max-width:768px){
        #bubbleCanvas { height: 60vh; min-height: 380px; }
        #musicPlayerBar { bottom:4rem; width:calc(100% - 20px); left:50%; transform:translateX(-50%); }
        #menuFitur { bottom:10.5rem; right:.75rem; }
    }
</style>
</head>

<script>
    // ── Stars & Outer Space Clouds Decor ──
    const spaceBg = document.getElementById('spaceBackground');
    const starsEl = document.getElementById('stars');
    
    // Generate Stars
    for (let i = 0; i < 60; i++) {
        const s = document.createElement('div');
        s.className = 'star-particle';
        const sz = 2 + Math.random() * 4;
        s.style.cssText = `width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;animation:pulse-soft ${3+Math.random()*6}s infinite ease-in-out;animation-delay:${Math.random()*5}s`;
        starsEl.appendChild(s);
    }

    // Generate Melayang Nuansa Awan / Nebula luar angkasa besar di background
    const spaceEmojis = ['☁️', '🪐', '✨', '☁️', '🌙'];
    for(let i=0; i < 6; i++) {
        const decor = document.createElement('div');
        decor.className = 'space-decor';
        decor.textContent = spaceEmojis[i % spaceEmojis.length];
        decor.style.fontSize = (40 + Math.random() * 60) + 'px';
        decor.style.left = (Math.random() * 90) + '%';
        decor.style.top = (Math.random() * 80) + '%';
        decor.style.animationDelay = (Math.random() * -10) + 's';
        decor.style.animationDuration = (15 + Math.random() * 15) + 's';
        spaceBg.appendChild(decor);
    }

    // ── FAB ──
    const menuBtn = document.getElementById('menuBtn');
    const menuItems = document.getElementById('menuItems');
    const menuIcon = menuBtn.querySelector('.material-symbols-outlined');
    let menuOpen = false;
    menuBtn.addEventListener('click', e => {
        e.stopPropagation(); menuOpen = !menuOpen;
        menuItems.classList.toggle('opacity-0', !menuOpen);
        menuItems.classList.toggle('pointer-events-none', !menuOpen);
        menuItems.classList.toggle('translate-y-4', !menuOpen);
        menuItems.classList.toggle('opacity-100', menuOpen);
        menuItems.classList.toggle('pointer-events-auto', menuOpen);
        menuItems.classList.toggle('translate-y-0', menuOpen);
        menuIcon.textContent = menuOpen ? 'close' : 'apps';
    });
    document.addEventListener('click', () => {
        if (!menuOpen) return; menuOpen = false;
        menuItems.classList.add('opacity-0','pointer-events-none','translate-y-4');
        menuItems.classList.remove('opacity-100','pointer-events-auto','translate-y-0');
        menuIcon.textContent = 'apps';
    });

    // ── Music (Ultra Minimalist & Default Minimize Engine) ──
    const music = document.getElementById('bgMusic');
    const musicBtn = document.getElementById('musicToggle');
    const playerBar = document.getElementById('musicPlayerBar');
    const resizeBtn = document.getElementById('musicResizeBtn');
    const textInfo = document.getElementById('musicTextInfo');

    let isPlaying = false;
    let isMinimized = true; // Set awal ke true agar default-nya mengecil

    // Fungsi update UI tombol play/pause (Segitiga & Garis Dua)
    function updateMusicUI(playing) {
        isPlaying = playing;
        const iconEl = musicBtn.querySelector('.material-symbols-outlined');
        
        if (playing) {
            iconEl.textContent = 'pause';
            musicBtn.classList.add('bg-primary', 'text-white');
            musicBtn.classList.remove('bg-primary/10', 'text-primary');
        } else {
            iconEl.textContent = 'play_arrow';
            musicBtn.classList.remove('bg-primary', 'text-white');
            musicBtn.classList.add('bg-primary/10', 'text-primary');
        }
    }

    // Autoplay Handler
    function tryAutoplay() {
        music.play().then(() => {
            updateMusicUI(true);
        }).catch(error => {
            console.log("Autoplay ditahan browser. Menunggu interaksi user.");
            const playOnInteraction = () => {
                music.play().then(() => {
                    updateMusicUI(true);
                    document.removeEventListener('click', playOnInteraction);
                });
            };
            document.addEventListener('click', playOnInteraction);
        });
    }

    window.addEventListener('DOMContentLoaded', tryAutoplay);

    // Toggle Play / Pause
    musicBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (isPlaying) {
            music.pause();
            updateMusicUI(false);
        } else {
            music.play();
            updateMusicUI(true);
        }
    });

    // Toggle Expand / Collapse (Lebarkan / Kecilkan)
    resizeBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        isMinimized = !isMinimized;
        const resizeIcon = resizeBtn.querySelector('.material-symbols-outlined');

        if (isMinimized) {
            // Mode Minimize (Hanya tombol kontrol dan resize)
            textInfo.classList.add('opacity-0');
            setTimeout(() => {
                textInfo.classList.add('hidden');
            }, 150);

            playerBar.style.width = "110px";
            resizeIcon.textContent = 'chevron_right'; // Panah menunjuk ke kanan (buka)
        } else {
            // Mode Maximize / Lebar (Memperlihatkan Judul & Penyanyi)
            textInfo.classList.remove('hidden');
            
            // Mengikuti lebar responsive agar tetap rapi di mobile maupun desktop
            if (window.innerWidth < 640) {
                playerBar.style.width = "calc(100% - 32px)";
            } else {
                playerBar.style.width = "280px";
            }
            
            setTimeout(() => {
                textInfo.classList.remove('opacity-0');
            }, 100);
            
            resizeIcon.textContent = 'chevron_left'; // Panah menunjuk ke kiri (tutup)
        }
    });

    // Menjaga akurasi lebar saat resize layar browser dalam kondisi terbuka
    window.addEventListener('resize', () => {
        if (!isMinimized) {
            if (window.innerWidth < 640) {
                playerBar.style.width = "calc(100% - 32px)";
            } else {
                playerBar.style.width = "280px";
            }
        }
    });

    // ── Modal ──
    const overlay = document.getElementById('modalOverlay');
    const modalBox = document.getElementById('modalBox');
    let currentPost = null;
    let likedPosts = JSON.parse(localStorage.getItem('likedPosts') || '[]');

    function openModal(data, id) {
        currentPost = { data, id };
        const isPhotobox = data.type === 'photobox';

        document.getElementById('modalBadgeEl').innerHTML = isPhotobox
            ? '<span class="modal-badge badge-photobox">📸 Photobox</span>'
            : '<span class="modal-badge badge-curhat">💌 Curhat</span>';

        const nama   = esc(data.nama   || 'Anonim');
        const tujuan = esc(data.tujuan || 'Seseorang');
        document.getElementById('modalHeader').innerHTML = `${nama} <span class="to-label">ke</span> ${tujuan}`;
        document.getElementById('modalMsg').textContent = `"${data.pesan || ''}"`;

        const photo = document.getElementById('modalPhoto');
        if (data.photoUrl) { photo.src = data.photoUrl; photo.style.display = 'block'; }
        else { photo.style.display = 'none'; photo.src = ''; }

        const audioEl = document.getElementById('modalAudio');
        if (data.audioUrl) { audioEl.src = data.audioUrl; audioEl.classList.add('has-audio'); }
        else { audioEl.src = ''; audioEl.classList.remove('has-audio'); }

        const waktu = data.waktu ? new Date(Number(data.waktu)).toLocaleDateString('id-ID') : '-';
        document.getElementById('modalDate').textContent = waktu;

        const loveBtn = document.getElementById('modalLoveBtn');
        const likeCount = document.getElementById('modalLikeCount');
        likeCount.textContent = data.likes || 0;
        loveBtn.disabled = likedPosts.includes(id);

        overlay.classList.add('show');
    }

    function closeModal() {
        overlay.classList.remove('show');
        document.getElementById('modalAudio').pause();
    }

    document.getElementById('modalClose').addEventListener('click', closeModal);
    overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });

    document.getElementById('modalLoveBtn').addEventListener('click', async () => {
        if (!currentPost || likedPosts.includes(currentPost.id)) return;
        if (window._incrementLike) await window._incrementLike(currentPost.id);
        likedPosts.push(currentPost.id);
        localStorage.setItem('likedPosts', JSON.stringify(likedPosts));
        const loveBtn = document.getElementById('modalLoveBtn');
        loveBtn.disabled = true;
        const likeCountEl = document.getElementById('modalLikeCount');
        likeCountEl.textContent = parseInt(likeCountEl.textContent) + 1;
        
        const bEl = document.querySelector(`.bubble[data-id="${currentPost.id}"] .bubble-likes`);
        if (bEl) bEl.textContent = '♥ ' + likeCountEl.textContent;
    });

    // ── Drag & Drop Engine (Mouse + Touch) ──
    let activeContainer = null;
    let startX, startY, initialLeft, initialTop;
    let isMoving = false;

    function setupDragAndDrop(containerEl) {
        // Event handler awal sentuhan/klik
        const onStart = (e) => {
            // Abaikan jika klik berasal dari komponen tombol internal (jika ada)
            if(e.target.closest('.bubble-likes')) return;

            activeContainer = containerEl;
            isMoving = false;

            const clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
            const clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;

            startX = clientX;
            startY = clientY;

            initialLeft = parseFloat(activeContainer.style.left);
            initialTop = parseFloat(activeContainer.style.top);

            activeContainer.classList.add('dragging');
            
            document.addEventListener('mousemove', onMove, { passive: false });
            document.addEventListener('mouseup', onEnd);
            document.addEventListener('touchmove', onMove, { passive: false });
            document.addEventListener('touchend', onEnd);
        };

        const onMove = (e) => {
            if (!activeContainer) return;
            
            const clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
            const clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;

            const dx = clientX - startX;
            const dy = clientY - startY;

            // Jika pergeseran lebih dari 4 pixel, tandai sebagai aksi drag/geser (bukan klik biasa)
            if (Math.abs(dx) > 4 || Math.abs(dy) > 4) {
                isMoving = true;
            }

            activeContainer.style.left = `${initialLeft + dx}px`;
            activeContainer.style.top = `${initialTop + dy}px`;
            
            e.preventDefault(); // Mencegah scrolling halaman bawaan mobile saat men-drag
        };

        const onEnd = () => {
            if (activeContainer) {
                activeContainer.classList.remove('dragging');
                activeContainer = null;
            }
            document.removeEventListener('mousemove', onMove);
            document.removeEventListener('mouseup', onEnd);
            document.removeEventListener('touchmove', onMove);
            document.removeEventListener('touchend', onEnd);
        };

        containerEl.addEventListener('mousedown', onStart);
        containerEl.addEventListener('touchstart', onStart, { passive: true });
    }

    // ── Bubble Generator ──
    function placeBubbles(posts) {
        const canvas = document.getElementById('bubbleCanvas');
        canvas.innerHTML = '';

        const W = canvas.offsetWidth  || window.innerWidth;
        const H = canvas.offsetHeight || 460;

        const count  = posts.length;
        const cols   = Math.max(3, Math.round(Math.sqrt(count * 1.6)));
        const rows   = Math.ceil(count / cols);

        const cellW  = W / cols;
        const cellH  = H / rows;

        const shapes    = ['shape-circle','shape-cloud','shape-cloud-2','shape-blob'];
        const floats    = ['float-a','float-b','float-c'];
        const durations = [6, 7, 8, 9];
        const delays    = [0, 0.5, 1, 1.5, 2];

        posts.forEach((item, i) => {
            const col = i % cols;
            const row = Math.floor(i / cols);

            const margin = 0.15; 
            const cx = (col + margin + Math.random() * (1 - margin * 2)) * cellW;
            const cy = (row + margin + Math.random() * (1 - margin * 2)) * cellH;

            const sz = 84; 

            const shape   = shapes[Math.floor(Math.random() * shapes.length)];
            const float   = floats[Math.floor(Math.random() * floats.length)];
            const dur     = durations[Math.floor(Math.random() * durations.length)];
            const delay   = delays[Math.floor(Math.random() * delays.length)];

            // Wrapper melayang (float container)
            const wrapper = document.createElement('div');
            wrapper.className = `float-container ${float}`;
            wrapper.style.cssText = `
                left:${cx - sz/2}px;
                top:${cy - sz/2}px;
                --fd:${dur}s;
                --fdel:${delay}s;
            `;

            // Elemen bubble utama di dalam wrapper
            const bubble = document.createElement('div');
            bubble.className = `bubble ${shape} type-${item.type || 'curhat'} bubble-enter`;
            bubble.dataset.id = item.id;
            bubble.style.cssText = `
                width:${sz}px;
                height:${sz}px;
                animation-delay: ${delay}s;
            `;

            const short = (s, n) => s && s.length > n ? s.slice(0, n-1) + '…' : (s || '');
            bubble.innerHTML = `
                <span class="bubble-emoji">${item.type==='photobox'?'📸':'💌'}</span>
                <span class="bubble-from">${short(item.nama||'Anonim', 8)}</span>
                <span class="bubble-to">→ ${short(item.tujuan||'Seseorang', 8)}</span>
                <span class="bubble-likes">♥ ${item.likes||0}</span>
            `;

            // Eksekusi buka modal hanya jika user melakukan klik murni (bukan setelah menggeser/drag)
            bubble.addEventListener('click', () => {
                if (!isMoving) {
                    openModal(item, item.id);
                }
            });

            setupDragAndDrop(wrapper);
            wrapper.appendChild(bubble);
            canvas.appendChild(wrapper);
        });
    }

    function esc(s) {
        return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
    }

    let resizeTimer;
    window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
            if (window._cachedPosts && window._cachedPosts.length) {
                placeBubbles(window._cachedPosts);
            }
        }, 300);
    });
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs, query, orderBy, limit, doc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyC247K8yyL67aWV95KNQy8CkMZsjgGCudQ",
    authDomain: "gamon-tawing.firebaseapp.com",
    projectId: "gamon-tawing",
    storageBucket: "gamon-tawing.appspot.com",
    messagingSenderId: "370162915989",
    appId: "1:370162915989:web:76779062da83aa0c5c999c"
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

window._incrementLike = async (id) => {
    try { await updateDoc(doc(db,'gamon',id), { likes: increment(1) }); } catch(e) { console.error(e); }
};

async function loadAllPosts() {
    try {
        const snap = await getDocs(query(collection(db,'gamon'), orderBy('waktu','desc'), limit(100)));
        const posts = [];
        snap.forEach(d => { const data = d.data(); if (data.pesan) posts.push({ id: d.id, ...data }); });
        posts.sort((a,b) => Number(b.waktu||0) - Number(a.waktu||0));

        window._cachedPosts = posts;
        const loadingEl = document.getElementById('loadingMsg');
        if(loadingEl) loadingEl.remove();
        placeBubbles(posts);
    } catch(e) {
        console.error('Gagal load data:', e);
        const loadingEl = document.getElementById('loadingMsg');
        if(loadingEl) loadingEl.textContent = 'Gagal memuat pesan 😢';
    }
}

loadAllPosts();
</script>
