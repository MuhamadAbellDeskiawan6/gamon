<script>
        // Soft Sparkle Particle Generator
        const starsContainer = document.getElementById('stars');
        const starCount = 60;

        for (let i = 0; i < starCount; i++) {
            const star = document.createElement('div');
            star.className = 'star-particle';
            const size = 2 + Math.random() * 4;
            star.style.width = `${size}px`;
            star.style.height = `${size}px`;
            star.style.left = `${Math.random() * 100}%`;
            star.style.top = `${Math.random() * 100}%`;
            star.style.animation = `pulse-soft ${3 + Math.random() * 6}s infinite ease-in-out`;
            star.style.animationDelay = `${Math.random() * 5}s`;
            starsContainer.appendChild(star);
        }

        // Music Toggle
        window.music = document.getElementById("bgMusic");
        window.btn = document.getElementById("musicToggle");

        window.isPlaying = false;

        window.btn.addEventListener("click", () => {
          if (window.isPlaying) {
            window.music.pause();
            window.btn.textContent = 'play_circle';
          } else {
            window.music.play();
            window.btn.textContent = 'pause_circle';
          }
          window.isPlaying = !window.isPlaying;
        });

        // Draggable Floating Cards Logic
        window.container = document.getElementById('container');
        let activeItem = null;
        let currentX;
        let currentY;
        let initialX;
        let initialY;
        let xOffset = 0;
        let yOffset = 0;
        window.currentCardZ = 20;

        window.container.addEventListener("pointerdown", dragStart, false);
        window.container.addEventListener("pointerup", dragEnd, false);
        window.container.addEventListener("pointermove", drag, false);

        function bringToFront(el) {
            if (!el) return;
            window.currentCardZ += 1;
            el.style.zIndex = window.currentCardZ;
            el.classList.add('active-card');
            setTimeout(() => el.classList.remove('active-card'), 220);
        }

        function dragStart(e) {
            if (e.target.closest('button, audio, a, input, textarea')) {
                return;
            }
            if (e.target.closest('.draggable')) {
                activeItem = e.target.closest('.draggable');
                bringToFront(activeItem);

                const style = window.getComputedStyle(activeItem);
                const matrix = new WebKitCSSMatrix(style.transform);
                xOffset = matrix.m41;
                yOffset = matrix.m42;

                initialX = e.clientX - xOffset;
                initialY = e.clientY - yOffset;
            }
        }

        function dragEnd() {
            initialX = currentX;
            initialY = currentY;
            activeItem = null;
        }

        function drag(e) {
            if (activeItem) {
                e.preventDefault();
                currentX = e.clientX - initialX;
                currentY = e.clientY - initialY;
                setTranslate(currentX, currentY, activeItem);
            }
        }

        function setTranslate(xPos, yPos, el) {
            const rotation = el.style.transform.match(/rotate\([^)]+\)/) || '';
            el.style.transform = `translate3d(${xPos}px, ${yPos}px, 0) ${rotation}`;
        }
    </script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { 
  getFirestore, 
  collection, 
  onSnapshot, 
  query, 
  orderBy, 
  limit,
  doc,
  updateDoc,
  increment
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC247K8yyL67aWV95KNQy8CkMZsjgGCudQ",
  authDomain: "gamon-tawing.firebaseapp.com",
  projectId: "gamon-tawing",
  storageBucket: "gamon-tawing.appspot.com",
  messagingSenderId: "370162915989",
  appId: "1:370162915989:web:76779062da83aa0c5c999c"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// Query Firestore for the latest 30 messages
const q = query(
  collection(db, "gamon"),
  orderBy("waktu", "desc"),
  limit(30)
);

// Ambil likedPosts dari localStorage
let likedPosts = JSON.parse(localStorage.getItem("likedPosts")) || [];

function createCard(data, id) {
    const card = document.createElement('div');
    card.className = 'draggable glass-card p-gutter rounded-xl w-72';
    
    // Gunakan lebar jendela (viewport) agar menyebar ke ujung kanan-kiri
    const screenWidth = window.innerWidth;
    const screenHeight = window.innerHeight * 0.7; // Sesuaikan dengan tinggi kontainer (70vh)

    // Hitung posisi acak
    // 300 adalah estimasi lebar kartu + sedikit margin agar tidak terpotong di kanan
    const randomX = Math.random() * (screenWidth - 320);
    // 250 adalah estimasi tinggi kartu agar tidak terlalu ke bawah
    const randomY = Math.random() * (screenHeight - 250);

    // Set posisi
    card.style.position = 'absolute';
    card.style.left = `${randomX}px`;
    card.style.top = `${randomY}px`;
    
    // ... sisa kode kamu (rotation, innerHTML, dll)
    card.style.transform = `rotate(${Math.random() * 6 - 3}deg)`;
    card.style.zIndex = window.currentCardZ;
    window.currentCardZ += 1;

    const nama = data.nama ? escapeHtml(data.nama) : "Anonim";
    const tujuan = data.tujuan ? escapeHtml(data.tujuan) : "Seseorang";
    const pesan = data.pesan ? escapeHtml(data.pesan) : "";
    const likes = data.likes || 0;
    const waktu = data.waktu ? 
        (data.waktu.toDate ? new Date(data.waktu.toDate()).toLocaleDateString('id-ID') : 
         typeof data.waktu === 'string' ? new Date(data.waktu).toLocaleDateString('id-ID') : 
         new Date(data.waktu).toLocaleDateString('id-ID')) : 
        "Hari ini";

    const audioHtml = data.audioUrl ? `
        <audio class="audio-custom w-full h-8 mb-4 rounded-full" controls playsinline preload="metadata" src="${data.audioUrl}">
        </audio>
    ` : '';

    card.innerHTML = `
        <div class="flex items-center justify-between mb-4 border-b border-black/5 pb-2 gap-3">
            <span class="font-label-md text-primary">${nama} <span class="text-on-surface-variant/60">ke</span> ${tujuan}</span>
            <div class="flex items-center gap-2">
                ${data.audioUrl ? `<span class="material-symbols-outlined text-sm text-on-surface-variant">volume_up</span>` : ''}
                <button type="button" class="toggle-detail-btn" aria-expanded="true" title="Toggle detail">
                    <span class="material-symbols-outlined">arrow_drop_down</span>
                </button>
            </div>
        </div>
        <div class="message-box font-body-md italic text-on-surface mb-4 leading-relaxed max-h-40 overflow-y-auto whitespace-pre-wrap">
            "${pesan}"
        </div>
        ${audioHtml}
        <div class="flex items-center justify-between">
            <button class="love-btn flex items-center gap-1 group" type="button">
                <span class="material-symbols-outlined text-error group-hover:scale-110 transition-transform" style="font-variation-settings: 'FILL' 1;">favorite</span>
                <span class="font-label-md text-on-surface-variant">${likes}</span>
            </button>
            <span class="font-label-md text-outline/60 text-xs">${waktu}</span>
        </div>
    `;

    // Append first to get dimensions
    window.container.appendChild(card);

    const loveBtn = card.querySelector('.love-btn');
    const vnAudio = card.querySelector('audio');
    const postId = id;

    if (vnAudio) {
        vnAudio.addEventListener("play", () => {
            if (window.isPlaying) {
                window.music.pause();
                window.btn.textContent = 'play_circle';
                window.isPlaying = false;
            }
        });
    }

    const toggleBtn = card.querySelector('.toggle-detail-btn');
    const detailSection = card.querySelector('.message-box');
    const audioElement = card.querySelector('audio');

    if (likedPosts.includes(postId)) {
        loveBtn.classList.add('liked');
        loveBtn.disabled = true;
    }

    toggleBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const isCollapsed = card.classList.toggle('collapsed');
        toggleBtn.setAttribute('aria-expanded', String(!isCollapsed));
        toggleBtn.innerHTML = `<span class="material-symbols-outlined">${isCollapsed ? 'arrow_drop_up' : 'arrow_drop_down'}</span>`;
    });

    loveBtn.addEventListener('click', async (e) => {
        e.stopPropagation();
        if (likedPosts.includes(postId)) {
            alert("Kamu sudah kasih love 💔");
            return;
        }

        try {
            const postRef = doc(db, "gamon", postId);
            await updateDoc(postRef, {
                likes: increment(1)
            });

            likedPosts.push(postId);
            localStorage.setItem("likedPosts", JSON.stringify(likedPosts));

            loveBtn.classList.add('liked');
            loveBtn.disabled = true;

            // Animasi
            loveBtn.style.transform = "scale(1.2)";
            setTimeout(() => {
                loveBtn.style.transform = "scale(1)";
            }, 150);

            const count = loveBtn.querySelector('span:last-child');
            count.textContent = parseInt(count.textContent) + 1;

        } catch (err) {
            console.error(err);
            alert("Gagal like 😢");
        }
    });

    return card;
}

// Firestore Listener
onSnapshot(q, (snapshot) => {
    window.container.innerHTML = ""; // Clear existing
    snapshot.forEach((doc) => {
        const data = doc.data();
        if (!data.pesan) return;
        createCard(data, doc.id);
    });
}, (error) => {
    console.error('Error in onSnapshot:', error);
});

// Simple HTML escape
function escapeHtml(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}
</script>
