<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photobooth Gamon Tawing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght=1,500;1,600&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js" crossorigin="anonymous"></script>

    <style>
        body {
            background: linear-gradient(135deg, #fef8fa 0%, #fce4ec 100%);
        }
        .bg-thumb {
            cursor: pointer;
            transition: all 0.2s;
        }
        .bg-thumb.active {
            border-color: #db2777;
            transform: scale(1.05);
        }
    </style>
</head>
<body class="font-['Inter'] flex flex-col items-center justify-center min-h-screen p-4 md:p-8">
    
    <div class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-md text-center relative border border-pink-100">
        <div class="mb-6">
            <h1 class="text-2xl font-bold text-gray-800 tracking-tight">Gamon Booth 📸</h1>
            <p class="text-xs text-gray-500 mt-1">Scan, bayar, dan abadikan kenangan langsung dari HP-mu</p>
        </div>
        
        <div class="relative w-full aspect-[3/4] bg-gray-900 rounded-xl mb-4 overflow-hidden flex items-center justify-center shadow-inner">
            <video id="video" class="hidden" autoplay playsinline></video>
            <canvas id="outputCanvas" class="w-full h-full object-cover"></canvas>
            <img id="photoPreview" class="hidden w-full h-full object-cover absolute top-0 left-0" alt="Preview"/>
            
            <div id="flashOverlay" class="absolute inset-0 bg-white opacity-0 transition-opacity duration-100 pointer-events-none"></div>
            <div id="countdownDisplay" class="hidden absolute text-8xl font-black text-white drop-shadow-[0_4px_12px_rgba(0,0,0,0.5)]">5</div>
        </div>

        <div id="backgroundSelector" class="hidden mb-4 text-left">
            <label class="block text-xs font-medium text-gray-600 mb-1.5">Pilih Kategori Suasana (Virtual Background):</label>
            <div class="flex gap-2 overflow-x-auto pb-1">
                <div class="bg-thumb active border-2 border-transparent rounded-lg p-1 bg-gray-100 text-xs font-medium flex-shrink-0" data-bg="original">Original</div>
                <div class="bg-thumb border-2 border-transparent rounded-lg p-1 bg-pink-200 text-xs font-medium flex-shrink-0" data-bg="#fce4ec">Pastel Pink</div>
                <div class="bg-thumb border-2 border-transparent rounded-lg p-1 bg-slate-800 text-white text-xs font-medium flex-shrink-0" data-bg="#1e293b">Dark Mood</div>
                <div class="bg-thumb border-2 border-transparent rounded-lg p-1 bg-amber-100 text-xs font-medium flex-shrink-0" data-bg="#fef3c7">Warm Cafe</div>
            </div>
        </div>
        
        <canvas id="canvas" class="hidden"></canvas>
        
        <button id="btnMulai" class="w-full py-3.5 bg-pink-600 text-white rounded-xl font-semibold shadow-lg shadow-pink-200 hover:bg-pink-700 transition active:scale-[0.99]">Mulai Pembayaran (5k)</button>

        <div id="areaAksiFoto" class="hidden space-y-3">
            <button id="btnFoto" class="w-full py-3.5 bg-gray-900 text-white rounded-xl font-semibold shadow-md hover:bg-black transition active:scale-[0.99]">Ambil Foto (Timer 5 Detik)</button>
            <div id="areaRetake" class="hidden flex gap-3">
                <button id="btnRetake" class="w-1/2 py-3 bg-gray-100 text-gray-700 rounded-xl font-medium border border-gray-200 hover:bg-gray-200 transition">Foto Ulang</button>
                <button id="btnLanjut" class="w-1/2 py-3 bg-pink-600 text-white rounded-xl font-semibold hover:bg-pink-700 transition shadow-md shadow-pink-100">Lanjut Isi Data</button>
            </div>
        </div>

        <form id="formData" class="hidden text-left space-y-4 mt-2 border-t border-gray-100 pt-5">
            <h3 class="font-semibold text-gray-800 text-base">Lengkapi Data Polaroid & Cerita</h3>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1" for="senderName">Nama Pengirim</label>
                    <input class="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-pink-500 bg-gray-50/50" id="senderName" required type="text" placeholder="Nama kamu"/>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1" for="receiverName">Untuk Siapa</label>
                    <input class="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-pink-500 bg-gray-50/50" id="receiverName" required type="text" placeholder="Nama si dia / inisial"/>
                </div>
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-600 mb-1" for="email">Email untuk Pengiriman Softfile</label>
                <input class="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-pink-500 bg-gray-50/50" id="email" required type="email" placeholder="nama@email.com"/>
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-600 mb-1" for="messageContent">Pesan yang Ingin Ditampilkan di Index Gamon</label>
                <textarea class="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-pink-500 bg-gray-50/50 resize-none" id="messageContent" required placeholder="Tulis cerita atau pesan galau..." rows="3" maxlength="150"></textarea>
            </div>
            <button type="submit" id="btnKirim" class="w-full py-3.5 bg-pink-600 text-white rounded-xl font-semibold shadow-lg shadow-pink-200 hover:bg-pink-700 transition mt-2">Cetak, Kirim Email & Publish 🚀</button>
        </form>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyC247K8yyL67aWV95KNQy8CkMZsjgGCudQ",
        authDomain: "gamon-tawing.firebaseapp.com",
        projectId: "gamon-tawing",
        storageBucket: "gamon-tawing.firebasestorage.app",
        messagingSenderId: "370162915989",
        appId: "1:370162915989:web:76779062da83aa0c5c999c"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // DOM Elements
    const btnMulai = document.getElementById('btnMulai');
    const areaAksiFoto = document.getElementById('areaAksiFoto');
    const btnFoto = document.getElementById('btnFoto');
    const areaRetake = document.getElementById('areaRetake');
    const btnRetake = document.getElementById('btnRetake');
    const btnLanjut = document.getElementById('btnLanjut');
    const formData = document.getElementById('formData');
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const outputCanvas = document.getElementById('outputCanvas');
    const photoPreview = document.getElementById('photoPreview');
    const countdownDisplay = document.getElementById('countdownDisplay');
    const flashOverlay = document.getElementById('flashOverlay');
    const backgroundSelector = document.getElementById('backgroundSelector');

    let localStream;
    let rawCapturedImage = null;
    let selfieSegmentation;
    let currentBackground = 'original';
    let ctxOutput = outputCanvas.getContext('2d');

    // Inisialisasi MediaPipe Selfie Segmentation
    function initSelfieSegmentation() {
        selfieSegmentation = new SelfieSegmentation({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`
        });

        selfieSegmentation.setOptions({
            modelSelection: 1, // 1 berarti menggunakan model yang dioptimalkan untuk performa/mobile
        });

        selfieSegmentation.onResults(onSegmentationResults);
    }

    function onSegmentationResults(results) {
        ctxOutput.save();
        ctxOutput.clearRect(0, 0, outputCanvas.width, outputCanvas.height);
        
        // Buat efek mirror/terbalik agar terasa natural saat selfie di HP
        ctxOutput.translate(outputCanvas.width, 0);
        ctxOutput.scale(-1, 1);

        // Menggambar Masking Segmentasi
        ctxOutput.drawImage(results.segmentationMask, 0, 0, outputCanvas.width, outputCanvas.height);

        // Konfigurasi tipe komposisi gambar untuk mengganti background
        ctxOutput.globalCompositeOperation = 'source-in';
        ctxOutput.drawImage(results.image, 0, 0, outputCanvas.width, outputCanvas.height);

        ctxOutput.globalCompositeOperation = 'destination-over';
        if (currentBackground === 'original') {
            // Jika original, gambar video asli sebagai background
            ctxOutput.drawImage(results.image, 0, 0, outputCanvas.width, outputCanvas.height);
        } else {
            // Jika memilih background warna kustom
            ctxOutput.fillStyle = currentBackground;
            ctxOutput.fillRect(0, 0, outputCanvas.width, outputCanvas.height);
        }
        
        ctxOutput.restore();
    }

    async function startCamera() {
        try {
            // 🔥 Menggunakan "facingMode: user" agar otomatis membuka kamera depan HP
            localStream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } } 
            });
            video.srcObject = localStream;
            
            video.onloadedmetadata = () => {
                outputCanvas.width = video.videoWidth;
                outputCanvas.height = video.videoHeight;
                video.play();
                updateFrameProcessing();
            };

            btnMulai.classList.add('hidden');
            areaAksiFoto.classList.remove('hidden');
            backgroundSelector.classList.remove('hidden');
            outputCanvas.classList.remove('hidden');
            photoPreview.classList.add('hidden');
        } catch (err) { 
            alert("Gagal mengakses kamera depan: " + err.message); 
        }
    }

    async function updateFrameProcessing() {
        if (!video.paused && !video.ended) {
            await selfieSegmentation.send({ image: video });
            requestAnimationFrame(updateFrameProcessing);
        }
    }

    // Event Selector Background
    document.querySelectorAll('.bg-thumb').forEach(thumb => {
        thumb.addEventListener('click', (e) => {
            document.querySelectorAll('.bg-thumb').forEach(t => t.classList.remove('active'));
            e.target.classList.add('active');
            currentBackground = e.target.getAttribute('data-bg');
        });
    });

    function listenToPayment(orderId) {
        onSnapshot(doc(db, "orders", orderId), (docSnapshot) => {
            if (docSnapshot.exists() && docSnapshot.data().status === "PAID") {
                initSelfieSegmentation();
                startCamera();
            }
        });
    }

    // Logika Pembayaran (Sama dengan kode asli Anda)
    const urlParams = new URLSearchParams(window.location.search);
    const orderIdFromUrl = urlParams.get('orderId');
    const storedOrderId = localStorage.getItem('tempOrderId');

    if (orderIdFromUrl || storedOrderId) {
        listenToPayment(orderIdFromUrl || storedOrderId);
    }

    btnMulai.onclick = async () => {
        btnMulai.innerText = "Memproses...";
        btnMulai.disabled = true;
        try {
            const orderId = 'GAMON-' + Date.now();
            localStorage.setItem('tempOrderId', orderId);
            await setDoc(doc(db, "orders", orderId), { status: "PENDING" });

            const response = await fetch('/api/create-payment', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ amount: 5000, orderId: orderId })
            });

            const data = await response.json();
            if (data.response?.payment?.url) {
                window.location.replace(data.response.payment.url);
            }
        } catch (err) {
            alert("Kesalahan: " + err.message);
            btnMulai.innerText = "Mulai Pembayaran (5k)";
            btnMulai.disabled = false;
        }
    };

    function captureSnapshot() {
        flashOverlay.classList.remove('opacity-0');
        flashOverlay.classList.add('opacity-100');
        
        setTimeout(() => {
            flashOverlay.classList.remove('opacity-100');
            flashOverlay.classList.add('opacity-0');
        }, 150);

        // Ambil gambar langsung dari outputCanvas yang sudah terproses oleh AI background
        rawCapturedImage = outputCanvas.toDataURL('image/jpeg', 0.95);
        photoPreview.src = rawCapturedImage;
        
        outputCanvas.classList.add('hidden');
        backgroundSelector.classList.add('hidden');
        photoPreview.classList.remove('hidden');
        
        btnFoto.classList.add('hidden');
        btnFoto.disabled = false;
        btnFoto.innerText = "Ambil Foto (Timer 5 Detik)";
        areaRetake.classList.remove('hidden');
    }

    btnFoto.onclick = () => {
        btnFoto.disabled = true;
        let timeLeft = 5;
        countdownDisplay.innerText = timeLeft;
        countdownDisplay.classList.remove('hidden');

        const timer = setInterval(() => {
            timeLeft--;
            if (timeLeft <= 0) {
                clearInterval(timer);
                countdownDisplay.classList.add('hidden');
                captureSnapshot();
            } else {
                countdownDisplay.innerText = timeLeft;
            }
        }, 1000);
    };

    btnRetake.onclick = () => {
        outputCanvas.classList.remove('hidden');
        backgroundSelector.classList.remove('hidden');
        photoPreview.classList.add('hidden');
        btnFoto.classList.remove('hidden');
        areaRetake.classList.add('hidden');
        rawCapturedImage = null;
        updateFrameProcessing();
    };

    btnLanjut.onclick = () => {
        areaAksiFoto.classList.add('hidden');
        backgroundSelector.classList.add('hidden');
        formData.classList.remove('hidden');
        if (localStream) {
            localStream.getTracks().forEach(track => track.stop());
        }
    };

    // Logika pengiriman form data & Canvas rendering polaroid (Tetap sama seperti kode asli Anda)
    formData.onsubmit = async (e) => {
        e.preventDefault();
        const btnKirim = document.getElementById('btnKirim');
        btnKirim.innerText = "Membuat Lembar Polaroid...";
        btnKirim.disabled = true;

        const nama = document.getElementById('senderName').value;
        const tujuan = document.getElementById('receiverName').value;
        const pesan = document.getElementById('messageContent').value;
        const email = document.getElementById('email').value;

        const polaroidCanvas = document.createElement('canvas');
        const ctx = polaroidCanvas.getContext('2d');
        
        polaroidCanvas.width = 1200;
        polaroidCanvas.height = 1600;

        ctx.fillStyle = "#FFFFFF";
        ctx.fillRect(0, 0, polaroidCanvas.width, polaroidCanvas.height);

        ctx.strokeStyle = "#F1F5F9";
        ctx.lineWidth = 4;
        ctx.strokeRect(15, 15, polaroidCanvas.width - 30, polaroidCanvas.height - 30);

        const img = new Image();
        img.src = rawCapturedImage;
        
        img.onload = async () => {
            const photoX = 70;
            const photoY = 70;
            const photoWidth = 1060;
            const photoHeight = 1060;

            const imgRatio = img.width / img.height;
            const targetRatio = photoWidth / photoHeight;
            let sx, sy, sw, sh;

            if (imgRatio > targetRatio) {
                sh = img.height;
                sw = img.height * targetRatio;
                sx = (img.width - sw) / 2;
                sy = 0;
            } else {
                sw = img.width;
                sh = img.width / targetRatio;
                sx = 0;
                sy = (img.height - sh) / 2;
            }

            ctx.drawImage(img, sx, sy, sw, sh, photoX, photoY, photoWidth, photoHeight);

            await document.fonts.ready;

            ctx.fillStyle = "#475569";
            ctx.font = "italic 500 36px 'Playfair Display', serif";
            ctx.textAlign = "left";
            ctx.fillText(`Dear: ${tujuan}`, 80, 1200);
            
            ctx.textAlign = "right";
            ctx.fillText(`— Dari: ${nama}`, 1120, 1200);

            ctx.strokeStyle = "#E2E8F0";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(80, 1240);
            ctx.lineTo(1120, 1240);
            ctx.stroke();

            ctx.fillStyle = "#1E293B";
            ctx.font = "italic 500 44px 'Playfair Display', serif";
            ctx.textAlign = "center";
            
            const words = pesan.split(' ');
            let line = '';
            let lineCount = 0;
            const maxWidth = 1000;
            let currentY = 1320;
            const lineHeight = 65;

            for (let n = 0; n < words.length; n++) {
                let testLine = line + words[n] + ' ';
                let metrics = ctx.measureText(testLine);
                let testWidth = metrics.width;
                
                if (testWidth > maxWidth && n > 0) {
                    ctx.fillText(line, 600, currentY);
                    line = words[n] + ' ';
                    currentY += lineHeight;
                    lineCount++;
                    if(lineCount >= 3) break;
                } else {
                    line = testLine;
                }
            }
            if (lineCount < 3) {
                ctx.fillText(line, 600, currentY);
            }

            const polaroidBase64 = polaroidCanvas.toDataURL('image/jpeg', 0.9);
            btnKirim.innerText = "Mengintegrasikan & Mengirim...";
            
            const payload = {
                nama,
                tujuan,
                pesan,
                email,
                photoBase64: polaroidBase64,
                orderId: localStorage.getItem('tempOrderId') || 'GAMON-MANUAL'
            };

            try {
                const response = await fetch('/api/submit-photobox', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.message || 'Gagal memproses data.');
                }

                alert('Cerita kamu berhasil dipublish dan softfile Polaroid telah dikirim ke email!');
                localStorage.removeItem('tempOrderId');
                window.location.href = 'index.html';

            } catch (err) {
                alert('Gagal: ' + err.message);
                btnKirim.innerText = "Cetak, Kirim Email & Publish 🚀";
                btnKirim.disabled = false;
            }
        };
    };
</script>
</body>
</html>
