<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photobox Gamon Tawing</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex flex-col items-center justify-center min-h-screen p-4">
    <div class="bg-white p-6 rounded-xl shadow-lg w-full max-w-md text-center">
        <h1 class="text-2xl font-bold mb-4">Self Photobox</h1>
        <video id="video" class="w-full h-64 bg-black rounded-lg mb-4" autoplay playsinline></video>
        <canvas id="canvas" class="hidden"></canvas>
        
        <button id="btnMulai" class="w-full py-3 bg-pink-500 text-white rounded-lg font-bold">Mulai Pembayaran (5k)</button>
        <button id="btnFoto" class="hidden w-full py-3 bg-green-500 text-white rounded-lg font-bold mt-2">Ambil Foto</button>

        <div id="divSelesai" class="hidden">
    <p class="text-green-600 font-bold mb-4">Pembayaran Berhasil!</p>
    <button onclick="window.location.reload()" class="w-full py-3 bg-blue-500 text-white rounded-lg">Kembali ke Photobox</button>
</div>
    </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyC247K8yyL67aWV95KNQy8CkMZsjgGCudQ",
        authDomain: "gamon-tawing.firebaseapp.com",
        projectId: "gamon-tawing",
        storageBucket: "gamon-tawing.firebasestorage.app",
        messagingSenderId: "370162915989",
        appId: "1:370162915989:web:76779062da83aa0c5c999c",
        measurementId: "G-DDRQKDZXV7"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const btnMulai = document.getElementById('btnMulai');
    const btnFoto = document.getElementById('btnFoto');
    const divSelesai = document.getElementById('divSelesai');
    const video = document.getElementById('video');

    // Fungsi Kamera
    async function startCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            video.srcObject = stream;
            btnMulai.classList.add('hidden');
            btnFoto.classList.remove('hidden');
            divSelesai.classList.add('hidden');
        } catch (err) { alert("Izin kamera ditolak!"); }
    }

    // Listener Status Pembayaran
    function listenToPayment(orderId) {
        onSnapshot(doc(db, "orders", orderId), (docSnapshot) => {
            if (docSnapshot.exists() && docSnapshot.data().status === "PAID") {
                startCamera();
                divSelesai.classList.remove('hidden');
            }
        });
    }

    // Cek URL saat halaman dimuat (untuk user yang kembali dari DOKU)
    const urlParams = new URLSearchParams(window.location.search);
    const orderIdFromUrl = urlParams.get('orderId');
    const storedOrderId = localStorage.getItem('tempOrderId');

    if (orderIdFromUrl || storedOrderId) {
        const id = orderIdFromUrl || storedOrderId;
        listenToPayment(id);
    }

    // Klik Mulai
    btnMulai.onclick = async () => {
        btnMulai.innerText = "Memproses...";
        btnMulai.disabled = true;

        try {
            const orderId = 'GAMON-' + Date.now();
            localStorage.setItem('tempOrderId', orderId);
            await setDoc(doc(db, "orders", orderId), { status: "PENDING" });

            const response = await fetch('/api/create-payment', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ amount: 5000, orderId: orderId })
            });

            const data = await response.json();
            if (data.response?.payment?.url) {
                window.location.replace(data.response.payment.url);
            }
        } catch (err) {
            alert("Kesalahan: " + err.message);
            btnMulai.innerText = "Mulai Pembayaran (5k)";
            btnMulai.disabled = false;
        }
    };
</script>
</body>
</html>
