    <style>
        body {
            background: linear-gradient(135deg, #fef8fa 0%, #fce4ec 50%, #f2ecee 100%);
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px rgba(107, 90, 96, 0.08);
        }
        .font-body-md { font-family: 'Inter', sans-serif; }
        .font-display-lg { font-family: 'Playfair Display', serif; }
        .font-label-md { font-family: 'Inter', sans-serif; }

    </style>
</head>
<body class="font-body-md text-on-surface selection:bg-primary-container selection:text-on-primary-container p-margin-mobile md:px-container-padding md:py-section-gap bg-background">
    <main class="max-w-6xl mx-auto space-y-gutter">
        
        <div class="flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
            <a class="inline-flex items-center gap-2 text-on-surface-variant hover:text-primary transition-colors" href="index.html">
                <span class="material-symbols-outlined">arrow_back</span>
                <span class="font-label-md">Kembali ke Beranda</span>
            </a>
        </div>

        <div class="text-center py-4">
            <h1 class="font-display-lg text-headline-md md:text-display-lg font-semibold text-primary">Peta Persebaran Gamon Nasional</h1>
            <p class="text-on-surface-variant mt-2 text-body-md md:text-body-lg max-w-2xl mx-auto">Melihat seberapa banyak titik rindu dan kenangan tak tersampaikan di seluruh penjuru Indonesia.</p>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 max-w-md mx-auto">
            <div class="glass-card p-gutter rounded-xl text-center">
                <h3 class="text-xs font-semibold text-on-surface-variant uppercase tracking-wider">Total Titik Galau Terdeteksi</h3>
                <p class="text-3xl font-bold text-error mt-1" id="totalGamonPoints">0</p>
            </div>
            <div class="glass-card p-gutter rounded-xl text-center flex flex-col justify-center items-center">
                <span class="text-xs font-semibold text-on-surface-variant uppercase tracking-wider">Status Pemetaan</span>
                <p class="text-green-600 font-semibold text-sm mt-1 flex items-center gap-1">
                    <span class="w-2 h-2 bg-green-500 rounded-full animate-ping"></span> Realtime Terhubung
                </p>
            </div>
        </div>

        <div class="glass-card p-3 md:p-5 rounded-2xl">
            <div id="mainMap"></div>
        </div>
        
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC247K8yyL67aWV95KNQy8CkMZsjgGCudQ",
            authDomain: "gamon-tawing.firebaseapp.com",
            projectId: "gamon-tawing",
            storageBucket: "gamon-tawing.appspot.com",
            messagingSenderId: "370162915989",
            appId: "1:370162915989:web:76779062da83aa0c5c999c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Inisialisasi Peta Leaflet (Fokus default di wilayah geografis tengah Indonesia)
        const mainMap = L.map('mainMap').setView([-2.5489, 118.0149], 5);
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(mainMap);

        // Ambil data dari koleksi 'gamon' lalu buat marker per koordinat
        async function loadGamonMarkers() {
            try {
                const querySnapshot = await getDocs(collection(db, "gamon"));
                let validPointsCount = 0;

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    
                    // Validasi apakah dokumen memiliki koordinat latitude & longitude
                    if (data.latitude !== undefined && data.longitude !== undefined) {
                        validPointsCount++;

                        // Format tampilan popup saat marker diklik
                        const popupContent = `
                            <div style="font-family: 'Inter', sans-serif; min-width: 160px;">
                                <b style="color: #6b5a60;">Dari:</b> ${data.nama || 'Anonim'}<br>
                                <b style="color: #6b5a60;">Untuk:</b> ${data.tujuan || 'Seseorang'}<br>
                                <hr style="margin: 6px 0; border: 0; border-top: 1px solid #eee;">
                                <p style="margin: 0; font-style: italic; color: #4d4447;">"${data.pesan}"</p>
                            </div>
                        `;

                        // Tambahkan Marker standar ke peta
                        L.marker([data.latitude, data.longitude])
                            .addTo(mainMap)
                            .bindPopup(popupContent);
                    }
                });

                // Update teks jumlah angka total titik galau
                document.getElementById('totalGamonPoints').innerText = validPointsCount;

            } catch (error) {
                console.error("Gagal menarik data koordinat gamon:", error);
            }
        }

        // Eksekusi fungsi ketika dokumen siap
        loadGamonMarkers();
    </script>
</body>
</html>
