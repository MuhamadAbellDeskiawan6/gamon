    <style>
        html, body {
            margin: 0;
            min-height: 100%;
        }

        body {
            background: linear-gradient(180deg, #010A17 0%, #0A4267 30%, #20658E 60%, #6BADC4 100%) fixed;
            min-height: 100vh;
            overflow-x: hidden;
            color: rgba(255,255,255,0.9);
        }

        .star-particle {
            position: absolute;
            background: #e7d8ff;
            border-radius: 50%;
            opacity: 0.55;
            pointer-events: none;
            box-shadow: 0 0 6px rgba(231,216,255,0.6);
        }

        .space-decor {
            position: absolute;
            pointer-events: none;
            opacity: 0.2;
            filter: blur(4px);
            animation: spaceFloat 18s infinite ease-in-out alternate;
        }

        @keyframes spaceFloat {
            0% { transform: translateY(0px) rotate(0deg) scale(1); }
            100% { transform: translateY(-30px) rotate(15deg) scale(1.15); }
        }

        @keyframes pulse-soft {
            0%, 100% { transform: scale(1); opacity: 0.4; }
            50% { transform: scale(1.5); opacity: 0.7; }
        }

        #gtSkyLayer {
            position: fixed;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            overflow: hidden;
        }

        .gt-cloud {
            position: absolute;
            bottom: -6%;
            width: 620px;
            max-width: 62vw;
            opacity: 0.5;
            will-change: transform;
            transform: translate3d(0,0,0);
        }

        .gt-cloud img {
            width: 100%;
            display: block;
        }

        .gt-cloud-left { left: -12%; }
        .gt-cloud-right { right: -14%; transform: scaleX(-1); }

        .content-shell {
            position: relative;
            z-index: 10;
            max-width: 1100px;
            width: min(100% - 24px, 1100px);
            margin: 0 auto;
            padding: 2rem 0 3rem;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.09);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 18px 42px -18px rgba(1,10,23,0.45);
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.7rem 1rem;
            border-radius: 9999px;
            background: linear-gradient(135deg, #f9d8c5 0%, #f7d9e8 35%, #dfe7ff 100%);
            color: #2f1f26;
            font-weight: 600;
            border: 1px solid rgba(255,255,255,0.45);
            box-shadow: 0 8px 24px rgba(1,10,23,0.2);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .back-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 26px rgba(1,10,23,0.28);
        }

        .metric-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 1.25rem;
            color: rgba(255,255,255,0.9);
        }

        #mainMap {
            height: 540px;
            width: 100%;
            border-radius: 1.1rem;
            z-index: 1;
            box-shadow: 0 12px 32px rgba(1,10,23,0.2);
            border: 1px solid rgba(255,255,255,0.12);
        }

        #mainMap {
            background: rgba(12, 35, 48, 0.7);
        }

        .maplibregl-map {
            border-radius: 1.1rem;
        }

        .maplibregl-popup-content {
            color: #1d1b1d;
            border-radius: 0.75rem;
            padding: 0.85rem 0.9rem;
            font-family: Inter, sans-serif;
            background: rgba(255,255,255,0.96);
        }

        .maplibregl-popup-tip {
            border-top-color: rgba(255, 255, 255, 0.96);
        }


        @media (max-width: 768px) {
            .gt-cloud { display: none; }
            .content-shell {
                width: min(100% - 18px, 1100px);
                padding-top: 1.25rem;
            }
            #mainMap { height: 420px; }
        }
    </style>
</head>
<body class="font-body-md text-white selection:bg-primary-container selection:text-white">
    <div id="spaceBackground" class="fixed inset-0 pointer-events-none z-0">
        <div class="fixed inset-0" id="stars"></div>
    </div>

    <div id="gtSkyLayer">
        <div class="gt-cloud gt-cloud-left" id="gtCloudLeft">
            <img src="https://soft-zoom-63098134.figma.site/_assets/v11/0d6dfd3f90b930f21726f2ed56a3320d79b7a797.png" alt="" />
        </div>
        <div class="gt-cloud gt-cloud-right" id="gtCloudRight">
            <img src="https://soft-zoom-63098134.figma.site/_assets/v11/0d6dfd3f90b930f21726f2ed56a3320d79b7a797.png" alt="" />
        </div>
    </div>

    <main class="content-shell">
        <a class="back-btn self-start mb-5" href="index.html">
            <span class="material-symbols-outlined">arrow_back</span>
            <span>Kembali</span>
        </a>

        <section class="glass-card p-4 sm:p-6 md:p-8 rounded-[30px]">
            <div class="text-center py-2 mb-6">
                <h1 class="font-display-lg text-3xl sm:text-4xl md:text-5xl font-semibold text-white mb-3">Peta Persebaran Gamon Nasional</h1>
                <p class="text-white/75 mt-2 text-base md:text-lg max-w-2xl mx-auto">Melihat seberapa banyak titik rindu dan kenangan tak tersampaikan di seluruh penjuru Indonesia.</p>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 max-w-md mx-auto mb-6">
                <div class="metric-card p-5 text-center">
                    <h3 class="text-xs font-semibold uppercase tracking-wider text-white/70">Total Titik Galau Terdeteksi</h3>
                    <p class="text-3xl font-bold text-pink-200 mt-2" id="totalGamonPoints">0</p>
                </div>
                <div class="metric-card p-5 text-center flex flex-col justify-center items-center">
                    <span class="text-xs font-semibold uppercase tracking-wider text-white/70">Status Pemetaan</span>
                    <p class="text-emerald-300 font-semibold text-sm mt-2 flex items-center gap-2">
                        <span class="w-2 h-2 bg-emerald-400 rounded-full animate-ping"></span> Realtime Terhubung
                    </p>
                </div>
            </div>

            <div class="glass-card p-3 md:p-5 rounded-2xl bg-white/5">
                <div id="mainMap"></div>
            </div>
        </section>
    </main>

    <script src="https://unpkg.com/maplibre-gl@3.3.1/dist/maplibre-gl.js"></script>

    <script>
        const starsEl = document.getElementById('stars');
        for (let i = 0; i < 60; i++) {
            const s = document.createElement('div');
            s.className = 'star-particle';
            const sz = 2 + Math.random() * 4;
            s.style.cssText = `width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;animation:pulse-soft ${3+Math.random()*6}s infinite ease-in-out;animation-delay:${Math.random()*5}s`;
            starsEl.appendChild(s);
        }

        const spaceEmojis = ['☁️', '🪐', '✨', '☁️', '🌙'];
        for (let i = 0; i < 6; i++) {
            const decor = document.createElement('div');
            decor.className = 'space-decor';
            decor.textContent = spaceEmojis[i % spaceEmojis.length];
            decor.style.fontSize = (40 + Math.random() * 60) + 'px';
            decor.style.left = (Math.random() * 90) + '%';
            decor.style.top = (Math.random() * 80) + '%';
            decor.style.animationDelay = (Math.random() * -10) + 's';
            decor.style.animationDuration = (15 + Math.random() * 15) + 's';
            document.getElementById('spaceBackground').appendChild(decor);
        }

        (function () {
            const cloudL = document.getElementById('gtCloudLeft');
            const cloudR = document.getElementById('gtCloudRight');
            if (!cloudL || !cloudR) return;

            let targetY = 0, currentY = 0;
            function onScroll() {
                targetY = window.scrollY || window.pageYOffset || 0;
            }
            window.addEventListener('scroll', onScroll, { passive: true });

            function tick() {
                currentY += (targetY - currentY) * 0.06;
                cloudL.style.transform = `translate3d(${-currentY * 0.03}px, ${-currentY * 0.05}px, 0)`;
                cloudR.style.transform = `translate3d(${currentY * 0.03}px, ${-currentY * 0.05}px, 0) scaleX(-1)`;
                requestAnimationFrame(tick);
            }
            requestAnimationFrame(tick);
        })();
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC247K8yyL67aWV95KNQz...",
            authDomain: "gamon-tawing.firebaseapp.com",
            projectId: "gamon-tawing",
            storageBucket: "gamon-tawing.appspot.com",
            messagingSenderId: "370162915989",
            appId: "1:370162915989:web:76779062da83aa0c5c999c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const map = new maplibregl.Map({
            container: 'mainMap',
            style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
            center: [118.0149, -2.5489],
            zoom: 4.5,
            minZoom: 2,
            maxZoom: 18,
            attributionControl: true
        });

        map.addControl(new maplibregl.NavigationControl({
            showCompass: true,
            showZoom: true
        }), 'top-right');

        map.addControl(new maplibregl.FullscreenControl(), 'top-right');
        map.addControl(new maplibregl.GeolocateControl({
            positionOptions: {
                enableHighAccuracy: true
            },
            trackUserLocation: false,
            showUserHeading: true
        }), 'top-left');

        const bounds = new maplibregl.LngLatBounds();

        function buildGeoJSON(items) {
            return {
                type: 'FeatureCollection',
                features: items.map((item) => ({
                    type: 'Feature',
                    properties: {
                        id: item.id,
                        nama: item.nama || 'Anonim',
                        tujuan: item.tujuan || '-',
                        pesan: item.pesan || ''
                    },
                    geometry: {
                        type: 'Point',
                        coordinates: [Number(item.longitude), Number(item.latitude)]
                    }
                }))
            };
        }

        async function loadGamonMarkers() {
            try {
                const snapshot = await getDocs(collection(db, 'gamon'));
                const items = [];

                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const lat = Number(data.latitude);
                    const lng = Number(data.longitude);

                    if (Number.isFinite(lat) && Number.isFinite(lng)) {
                        items.push({
                            id: doc.id,
                            nama: data.nama || 'Anonim',
                            tujuan: data.tujuan || '-',
                            pesan: data.pesan || '',
                            latitude: lat,
                            longitude: lng
                        });
                    }
                });

                document.getElementById('totalGamonPoints').textContent = items.length;

                if (!items.length) return;

                const geojson = buildGeoJSON(items);

                if (map.getSource('gamon-source')) {
                    map.getSource('gamon-source').setData(geojson);
                } else {
                    map.addSource('gamon-source', {
                        type: 'geojson',
                        data: geojson,
                        cluster: true,
                        clusterRadius: 50,
                        clusterMaxZoom: 14
                    });

                    map.addLayer({
                        id: 'gamon-clusters',
                        type: 'circle',
                        source: 'gamon-source',
                        filter: ['has', 'point_count'],
                        paint: {
                            'circle-color': '#3b82f6',
                            'circle-radius': [
                                'step',
                                ['get', 'point_count'],
                                16,
                                10, 24,
                                25, 30,
                                50, 38,
                                100, 46
                            ],
                            'circle-stroke-width': 2,
                            'circle-stroke-color': '#ffffff',
                            'circle-opacity': 0.95
                        }
                    });

                    map.addLayer({
                        id: 'gamon-cluster-count',
                        type: 'symbol',
                        source: 'gamon-source',
                        filter: ['has', 'point_count'],
                        layout: {
                            'text-field': ['get', 'point_count_abbreviated'],
                            'text-font': ['Open Sans Semibold', 'Arial Unicode MS Bold'],
                            'text-size': 12
                        },
                        paint: {
                            'text-color': '#ffffff'
                        }
                    });

                    map.addLayer({
                        id: 'gamon-points',
                        type: 'circle',
                        source: 'gamon-source',
                        filter: ['!', ['has', 'point_count']],
                        paint: {
                            'circle-color': '#f25c86',
                            'circle-radius': 7,
                            'circle-stroke-width': 2,
                            'circle-stroke-color': '#ffffff'
                        }
                    });
                }

                items.forEach((item) => {
                    bounds.extend([item.longitude, item.latitude]);
                });

                map.fitBounds(bounds, {
                    padding: 40,
                    maxZoom: 5,
                    duration: 0
                });
            } catch (err) {
                console.error(err);
            }
        }

        map.on('load', () => {
            loadGamonMarkers();
        });
    </script>
</body>
