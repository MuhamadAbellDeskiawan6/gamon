        .input-focus:focus {

<body class="font-body-md text-on-surface selection:bg-primary-container selection:text-on-primary-container">
<main class="relative z-10 flex flex-col items-center justify-center min-h-screen px-margin-mobile md:px-container-padding py-section-gap">
<!-- Back Link -->
<a class="self-start mb-unit flex items-center gap-2 text-on-surface-variant hover:text-primary transition-colors duration-200 group" href="index.html">
<span class="material-symbols-outlined transition-transform group-hover:-translate-x-1">arrow_back</span>
<span class="font-label-md text-label-md">Kembali ke Beranda</span>
</a>
<!-- Form Card -->
<section class="glass-card w-full max-w-2xl p-gutter md:p-container-padding rounded-xl">
<div class="mb-gutter text-center">
<h1 class="font-display-lg text-headline-md md:text-display-lg text-primary mb-2">Sampaikan Gamonmu 💔</h1>
<p class="font-body-md text-on-surface-variant">Bagikan perasaan yang masih tertinggal di kedalaman hati.</p>
</div>
<!-- Privacy Notice -->
<div class="bg-primary-container/30 border border-primary-container/50 rounded-lg p-unit mb-gutter flex items-center gap-3">
<span class="material-symbols-outlined text-primary-fixed-variant" style="font-variation-settings: 'FILL' 1;">encrypted</span>
<p class="font-label-md text-label-md text-on-primary-container">Privasi Terjamin: Pesan anda aman terenkripsi di sistem kami.</p>
</div>
<form class="space-y-gutter" id="submitForm">
<!-- Inputs -->
<div class="space-y-unit">
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-1" for="senderName">Nama kamu</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-gutter py-2 text-on-surface focus:outline-none input-focus transition-all" id="senderName" placeholder="Siapa yang menyimpan rasa ini?" required="" type="text"/>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-1" for="receiverName">Untuk siapa</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-gutter py-2 text-on-surface focus:outline-none input-focus transition-all" id="receiverName" placeholder="Kepada siapa pesan ini tertuju?" required="" type="text"/>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-1" for="messageContent">Pesan kamu</label>
<textarea class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-gutter py-2 text-on-surface focus:outline-none input-focus transition-all resize-none" id="messageContent" placeholder="Tuliskan semua kata yang tak sempat terucap..." required="" rows="5"></textarea>
</div>
</div>
<!-- Audio Recorder Section -->
<div class="space-y-unit">
<label class="block font-label-md text-label-md text-on-surface-variant mb-1">Rekam VN (Opsional)</label>
<div class="flex flex-col items-center gap-unit bg-surface-container-low rounded-xl p-gutter border border-dashed border-outline-variant" id="recorderContainer">
<button class="flex items-center gap-2 px-gutter py-2 rounded-full bg-secondary-container text-on-secondary-container border border-secondary-fixed-dim hover:brightness-95 transition-all duration-200 active:scale-95" id="recordBtn" type="button">
<span class="material-symbols-outlined" id="recordIcon">mic</span>
<span class="font-label-md" id="recordText">Rekam VN (Opsional)</span>
</button>
<div class="hidden flex flex-col items-center animate-pulse" id="recordingStatus">
<div class="w-3 h-3 bg-error rounded-full mb-1"></div>
<span class="text-error font-label-md">Sedang merekam...</span>
</div>
<div class="hidden w-full space-y-2" id="audioPreview">
<div class="flex items-center gap-2 text-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-label-md">VN siap dikirim!</span>
</div>
<audio class="w-full h-10" controls="" id="player"></audio>
</div>
</div>
</div>
<!-- Submit Button -->
<div class="pt-unit">
<button class="w-full py-gutter rounded-xl bg-primary text-on-primary font-headline-sm hover:brightness-110 shadow-lg shadow-primary/20 transition-all duration-300 active:scale-95 flex justify-center items-center gap-3" id="submitBtn" type="submit">
<span id="btnText">Kirim Gamon</span>
<span class="hidden animate-spin material-symbols-outlined" id="loader">progress_activity</span>
</button>
</div>

<!-- Scripts -->
<script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyC247K8yyL67aWV95KNQy8CkMZsjgGCudQ",
          authDomain: "gamon-tawing.firebaseapp.com",
          projectId: "gamon-tawing",
          storageBucket: "gamon-tawing.appspot.com",
          messagingSenderId: "370162915989",
          appId: "1:370162915989:web:76779062da83aa0c5c999c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Logic for Audio Recording
        let mediaRecorder;
        let audioChunks = [];
        let audioBase64 = null;
        const recordBtn = document.getElementById('recordBtn');
        const recordText = document.getElementById('recordText');
        const recordIcon = document.getElementById('recordIcon');
        const audioPreview = document.getElementById('audioPreview');
        const player = document.getElementById('player');
        const recordingStatus = document.getElementById('recordingStatus');

        const getSupportedAudioMimeType = () => {
            const types = [
                'audio/webm;codecs=opus',
                'audio/webm',
                'audio/mp4',
                'audio/x-m4a',
                'audio/mpeg',
                'audio/wav'
            ];

            if (!window.MediaRecorder || typeof MediaRecorder.isTypeSupported !== 'function') {
                return '';
            }

            for (const type of types) {
                if (MediaRecorder.isTypeSupported(type)) {
                    return type;
                }
            }
            return '';
        };

        const isRecordingSupported = () => {
            return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
        };

        if (!isRecordingSupported()) {
            recordBtn.disabled = true;
            recordBtn.classList.add('opacity-50', 'cursor-not-allowed');
            recordText.innerText = 'Rekam VN tidak tersedia di perangkat ini';
        }

        recordBtn.addEventListener('click', async () => {
            if (!isRecordingSupported()) {
                alert('Rekaman suara tidak didukung di peramban ini. Silakan gunakan perangkat lain atau kirim tanpa VN.');
                return;
            }

            if (!mediaRecorder || mediaRecorder.state === 'inactive') {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    const mimeType = getSupportedAudioMimeType();
                    mediaRecorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = event => {
                        if (event.data && event.data.size > 0) audioChunks.push(event.data);
                    };

                    mediaRecorder.onstop = async () => {
                        const type = audioChunks[0]?.type || mediaRecorder.mimeType || 'audio/webm';
                        const audioBlob = new Blob(audioChunks, { type });
                        const audioUrl = URL.createObjectURL(audioBlob);
                        player.src = audioUrl;
                        audioPreview.classList.remove('hidden');
                        
                        const reader = new FileReader();
                        reader.readAsDataURL(audioBlob);
                        reader.onloadend = () => {
                            audioBase64 = reader.result;
                        };
                    };

                    audioChunks = [];
                    mediaRecorder.start();
                    recordText.innerText = 'Berhenti';
                    recordIcon.innerText = 'stop';
                    recordingStatus.classList.remove('hidden');
                    recordBtn.classList.add('bg-error', 'text-white');
                    recordBtn.classList.remove('bg-secondary-container', 'text-on-secondary-container');
                } catch (err) {
                    console.error('Microphone access denied', err);
                    alert('Akses mikrofon ditolak atau tidak tersedia.');
                }
            } else {
                mediaRecorder.stop();
                recordText.innerText = 'Rekam Ulang';
                recordIcon.innerText = 'refresh';
                recordingStatus.classList.add('hidden');
                recordBtn.classList.remove('bg-error', 'text-white');
                recordBtn.classList.add('bg-secondary-container', 'text-on-secondary-container');
            }
        });

        const form = document.getElementById('submitForm');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const loader = document.getElementById('loader');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            submitBtn.disabled = true;
            btnText.innerText = 'Mengirim...';
            loader.classList.remove('hidden');

            const formData = {
                sender: document.getElementById('senderName').value,
                receiver: document.getElementById('receiverName').value,
                content: document.getElementById('messageContent').value,
                audio: audioBase64,
                timestamp: Date.now()
            };

            try {
                await addDoc(collection(db, 'gamon'), {
                    nama: formData.sender,
                    tujuan: formData.receiver,
                    pesan: formData.content,
                    audioUrl: formData.audio,
                    waktu: Date.now()
                });

                alert('Gamonmu telah terkirim ke bintang-bintang.');
                window.location.href = 'index.html';
            } catch (err) {
                console.error(err);
                alert('Gagal mengirim pesan.');
            } finally {
                submitBtn.disabled = false;
                btnText.innerText = 'Kirim Gamon';
                loader.classList.add('hidden');
            }
        });
    </script>
</body></html>
