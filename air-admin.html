<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasir / Admin Redeem Air Mineral</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Library Scanner Kamera QR -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white rounded-3xl shadow-xl max-w-lg w-full p-6">
        <h1 class="text-2xl font-bold text-slate-800 text-center mb-1">Verifikasi Kasir Air Mineral</h1>
        <p class="text-xs text-slate-500 text-center mb-6">Scan QR pelanggan atau masukkan kode unik secara manual</p>

        <!-- Tab Navigasi Mode Kasir -->
        <div class="flex border-b mb-6">
            <button onclick="switchTab('manual')" id="tabManual" class="flex-1 pb-3 font-semibold text-blue-600 border-b-2 border-blue-600 text-sm">Ketik Kode Manual</button>
            <button onclick="switchTab('scanner')" id="tabScanner" class="flex-1 pb-3 font-medium text-slate-400 border-b-2 border-transparent text-sm">Scan Kamera QR</button>
        </div>

        <!-- Mode 1: Manual Input -->
        <div id="sectionManual" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Kode Redeem / Order ID</label>
                <input type="text" id="redeemInput" placeholder="Contoh: AIR-TEST-9999" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:outline-none uppercase font-mono font-bold tracking-wider">
            </div>
            <button onclick="processRedeem()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-3 rounded-xl transition shadow-lg shadow-emerald-600/20">
                Verifikasi & Redeem Voucher
            </button>
        </div>

        <!-- Mode 2: Kamera Scanner -->
        <div id="sectionScanner" class="hidden space-y-4">
            <div id="reader" class="w-full rounded-2xl overflow-hidden border"></div>
            <p class="text-xs text-center text-slate-400">Arahkan kamera ke QR Code milik pelanggan.</p>
        </div>

        <!-- Area Hasil Response -->
        <div id="resultBox" class="mt-6 hidden rounded-2xl p-4 text-sm"></div>
    </div>

    <script>
        let html5QrCode = null;

        function switchTab(mode) {
            const tabManual = document.getElementById('tabManual');
            const tabScanner = document.getElementById('tabScanner');
            const sectionManual = document.getElementById('sectionManual');
            const sectionScanner = document.getElementById('sectionScanner');

            if (mode === 'manual') {
                tabManual.className = "flex-1 pb-3 font-semibold text-blue-600 border-b-2 border-blue-600 text-sm";
                tabScanner.className = "flex-1 pb-3 font-medium text-slate-400 border-b-2 border-transparent text-sm";
                sectionManual.classList.remove('hidden');
                sectionScanner.classList.add('hidden');
                if (html5QrCode) {
                    html5QrCode.stop().catch(err => console.log(err));
                }
            } else {
                tabScanner.className = "flex-1 pb-3 font-semibold text-blue-600 border-b-2 border-blue-600 text-sm";
                tabManual.className = "flex-1 pb-3 font-medium text-slate-400 border-b-2 border-transparent text-sm";
                sectionScanner.classList.remove('hidden');
                sectionManual.classList.add('hidden');
                
                // Nyalakan Kamera
                if (!html5QrCode) {
                    html5QrCode = new Html5Qrcode("reader");
                }
                html5QrCode.start(
                    { facingMode: "environment" },
                    { fps: 10, qrbox: { width: 250, height: 250 } },
                    (decodedText) => {
                        document.getElementById('redeemInput').value = decodedText;
                        switchTab('manual');
                        processRedeem(decodedText);
                    },
                    (errorMessage) => {
                        // Scanning error ignore
                    }
                ).catch(err => {
                    alert("Gagal mengakses kamera: " + err);
                });
            }
        }

        async function processRedeem(codeOverride = null) {
            const code = codeOverride || document.getElementById('redeemInput').value.trim();
            const resultBox = document.getElementById('resultBox');

            if (!code) {
                alert('Masukkan kode redeem terlebih dahulu!');
                return;
            }

            try {
                const response = await fetch('/api/admin/redeem-air', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ redeemCode: code })
                });

                const result = await response.json();
                resultBox.classList.remove('hidden');

                if (result.success) {
                    resultBox.className = "mt-6 rounded-2xl p-4 text-sm bg-emerald-50 border border-emerald-200 text-emerald-800";
                    resultBox.innerHTML = `
                        <div class="font-bold text-base mb-1">✅ Voucher Valid & Berhasil Ditukar!</div>
                        <div class="text-xs space-y-1 mt-2 text-emerald-700">
                            <div><b>Lokasi / Keterangan:</b> ${result.data.airName}</div>
                            <div><b>Voucher:</b> ${result.data.voucherName}</div>
                            <div><b>Pelanggan:</b> ${result.data.customerName}</div>
                        </div>
                    `;
                } else {
                    resultBox.className = "mt-6 rounded-2xl p-4 text-sm bg-rose-50 border border-rose-200 text-rose-800";
                    resultBox.innerHTML = `
                        <div class="font-bold text-base mb-1">❌ Gagal Verifikasi</div>
                        <div>${result.message}</div>
                    `;
                }
            } catch (err) {
                console.error(err);
                alert('Terjadi kesalahan sistem.');
            }
        }
    </script>
</body>
</html>
