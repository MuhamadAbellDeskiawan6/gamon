    <script>
      const musicEl = document.getElementById('bgMusic');
      const musicToggleButton = document.getElementById('musicToggleButton');
      const musicIcon = document.getElementById('musicIcon');
      const musicWrapper = document.getElementById('musicWrapper');
      let isPlaying = false;

      const updateMusicButton = () => {
        if (!musicIcon || !musicToggleButton) return;
        musicIcon.textContent = isPlaying ? 'pause' : 'music_note';
        musicToggleButton.setAttribute('aria-label', isPlaying ? 'Pause music' : 'Play music');
      };

      const tryAutoplay = async () => {
        if (!musicEl) return;
        try {
          musicEl.volume = 0.45;
          await musicEl.play();
          isPlaying = true;
          updateMusicButton();
        } catch (error) {
          isPlaying = false;
          updateMusicButton();
        }
      };

      if (musicToggleButton) {
        musicToggleButton.addEventListener('click', async () => {
          if (!musicEl) return;
          if (isPlaying) {
            musicEl.pause();
            isPlaying = false;
          } else {
            try {
              await musicEl.play();
              isPlaying = true;
            } catch (error) {
              isPlaying = false;
            }
          }
          updateMusicButton();
        });
      }

      const rsvpFormLavender = document.querySelector('[data-rsvp-form]');
      const rsvpListLavender = document.querySelector('[data-rsvp-list]');
      const rsvpMessageLavender = document.querySelector('[data-rsvp-message]');

      if (rsvpFormLavender) {
        rsvpFormLavender.addEventListener('submit', (event) => {
          event.preventDefault();
          const formData = new FormData(rsvpFormLavender);
          const name = (formData.get('name') || 'Tamu undangan').toString().trim() || 'Tamu undangan';
          const attending = (formData.get('attending') || 'yes').toString();
          const guests = (formData.get('guests') || '2').toString();
          const message = (formData.get('message') || '').toString().trim() || 'Tidak ada pesan tambahan.';

          const card = document.createElement('div');
          card.className = 'rounded-xl border border-secondary/20 bg-primary/5 p-3';
          card.innerHTML = `
            <div class="flex items-center justify-between gap-3">
              <strong class="text-primary">${name}</strong>
              <span class="rounded-full bg-secondary/10 px-2 py-1 text-xs uppercase tracking-wide text-secondary">${attending === 'yes' ? 'Hadir' : 'Tidak hadir'}</span>
            </div>
            <p class="mt-2 text-sm text-on-surface-variant">Jumlah tamu: ${guests}</p>
            <p class="mt-2 text-sm text-on-surface">${message}</p>
          `;

          if (rsvpListLavender) rsvpListLavender.prepend(card);
          if (rsvpMessageLavender) {
            rsvpMessageLavender.textContent = `${name} berhasil mengirimkan balasan ${attending === 'yes' ? 'hadir' : 'tidak hadir'} ke acara kami.`;
            rsvpMessageLavender.classList.add('text-primary');
          }
          rsvpFormLavender.reset();
        });
      }

      const lavenderParams = new URLSearchParams(window.location.search);
      const lavenderSlug = lavenderParams.get('slug');
      const lavenderDb = firebase.firestore(firebase.initializeApp({ apiKey: 'AIzaSyC247K8yyL67aWV95KNQy8CkMZsjgGCudQ', authDomain: 'gamon-tawing.firebaseapp.com', projectId: 'gamon-tawing' }, 'lavenderInvitationApp'));

      const formatLocaleDate = (dateValue) => {
        const value = String(dateValue || '').trim();
        if (!value) return '';
        const parsed = new Date(value.includes('T') ? value : `${value}T00:00:00`);
        if (Number.isNaN(parsed.getTime())) return value;
        return new Intl.DateTimeFormat('id-ID', { day: 'numeric', month: 'long', year: 'numeric' }).format(parsed);
      };

      const getEffectiveCountdownDate = (invitation) => invitation.countdownDate || invitation.receptionDate || invitation.akadDate || '';

      const buildMapsUrl = (value) => {
        const trimmed = String(value || '').trim();
        if (!trimmed) return '';
        if (/^https?:\/\//i.test(trimmed)) return trimmed;
        if (/^-?\d+(?:\.\d+)?\s*,\s*-?\d+(?:\.\d+)?$/.test(trimmed)) return `https://www.google.com/maps?q=${trimmed}`;
        return `https://www.google.com/maps?q=${encodeURIComponent(trimmed)}`;
      };

      const buildMapEmbedUrl = (value) => {
        const url = buildMapsUrl(value);
        if (!url) return '';
        return `${url}${url.includes('?') ? '&' : '?'}output=embed&z=16`;
      };

      const getCountdownParts = (targetDate) => {
        const value = String(targetDate || '').trim();
        if (!value) return { days: 0, hours: 0, minutes: 0, seconds: 0, isExpired: true };
        const target = new Date(value.includes('T') ? value : `${value}T00:00:00`);
        const diff = target.getTime() - Date.now();
        if (Number.isNaN(target.getTime()) || diff <= 0) return { days: 0, hours: 0, minutes: 0, seconds: 0, isExpired: true };
        const totalSeconds = Math.floor(diff / 1000);
        return {
          days: Math.floor(totalSeconds / 86400),
          hours: Math.floor((totalSeconds % 86400) / 3600),
          minutes: Math.floor((totalSeconds % 3600) / 60),
          seconds: totalSeconds % 60,
          isExpired: false
        };
      };

      const renderCountdown = (invitation) => {
        const countdownWrap = document.querySelector('#details .mt-8.flex.justify-center.gap-6');
        const targetDate = getEffectiveCountdownDate(invitation);
        if (countdownWrap) countdownWrap.style.display = targetDate ? 'flex' : 'none';
        if (!targetDate) return;
        const parts = getCountdownParts(targetDate);
        const dayNode = document.getElementById('countdownDays');
        const hourNode = document.getElementById('countdownHours');
        const minuteNode = document.getElementById('countdownMinutes');
        if (parts.isExpired) {
          if (dayNode) dayNode.textContent = '00';
          if (hourNode) hourNode.textContent = '00';
          if (minuteNode) minuteNode.textContent = '00';
          const existing = document.querySelector('#details [data-countdown-status]');
          if (existing) existing.remove();
          const block = document.createElement('p');
          block.setAttribute('data-countdown-status', 'true');
          block.textContent = 'Acara telah berlangsung';
          block.style.marginTop = '12px';
          block.style.color = '#5d4a7f';
          block.style.fontWeight = '600';
          block.style.letterSpacing = '0.08em';
          block.style.textTransform = 'uppercase';
          block.style.fontSize = '0.75rem';
          const target = document.querySelector('#details .relative.z-10.mx-auto');
          if (target) target.appendChild(block);
          return;
        }
        const existing = document.querySelector('#details [data-countdown-status]');
        if (existing) existing.remove();
        if (dayNode) dayNode.textContent = String(parts.days).padStart(2, '0');
        if (hourNode) hourNode.textContent = String(parts.hours).padStart(2, '0');
        if (minuteNode) minuteNode.textContent = String(parts.minutes).padStart(2, '0');
      };

      const formatRsvpMessage = (invitation) => {
        const base = String(invitation.rsvpMessage || '').trim();
        const formattedDate = getEffectiveCountdownDate(invitation) ? formatLocaleDate(getEffectiveCountdownDate(invitation)) : '';
        const fallback = 'Mohon konfirmasi sebelum';
        if (!base && !formattedDate) return fallback;
        if (!formattedDate) return base || fallback;
        if (base.includes(formattedDate)) return base || fallback;
        return `${(base || fallback).replace(/[.!]$/, '')} ${formattedDate}.`;
      };

      const renderGallery = (invitation = {}) => {
        const galleryImages = Array.isArray(invitation.galleryImages)
          ? invitation.galleryImages.filter((src) => typeof src === 'string' && src.trim())
          : [];

        const gallerySection = document.getElementById('gallery');
        const galleryGrid = document.getElementById('galleryGrid');

        if (gallerySection) {
          gallerySection.style.display = galleryImages.length > 0 ? 'block' : 'none';
        }

        if (!galleryGrid) return;

        if (!galleryImages.length) {
          galleryGrid.innerHTML = '';
          return;
        }

        galleryGrid.innerHTML = galleryImages.slice(0, 3).map((src) => `
          <div class="group w-full max-w-[280px] overflow-hidden rounded border-4 border-secondary/30 soft-shadow">
            <img class="h-40 w-full object-cover transition-transform duration-700 group-hover:scale-105 md:h-52" src="${src}" alt="Wedding moment" loading="lazy" />
          </div>
        `).join('');
      };

      const applyLavenderInvitation = (invitation = {}) => {
        const groomName = String(invitation.groomName || '').trim();
        const brideName = String(invitation.brideName || '').trim();
        const title = String(invitation.title || '').trim() || [groomName, brideName].filter(Boolean).join(' & ') || 'Undangan Pernikahan';
        const groomParents = String(invitation.parentGroom || '').trim();
        const brideParents = String(invitation.parentBride || '').trim();
        const quote = String(invitation.quote || '').trim();
        const story = String(invitation.story || '').trim();
        const eventDate = formatLocaleDate(invitation.receptionDate || invitation.akadDate || '');
        const eventTime = invitation.receptionTime || invitation.akadTime || '';
        const eventPlace = String(invitation.receptionPlace || invitation.akadPlace || '').trim();
        const eventAddress = String(invitation.address || '').trim();
        const mapUrl = buildMapsUrl(invitation.mapLink || invitation.address || eventAddress);
        const mapEmbedUrl = buildMapEmbedUrl(invitation.mapLink || invitation.address || eventAddress);

        document.title = title;

        const coupleLabel = document.getElementById('coupleNames');
        if (coupleLabel) coupleLabel.textContent = title;

        const quoteText = document.getElementById('quoteText');
        if (quoteText) {
          quoteText.textContent = quote || '';
          quoteText.style.display = quote ? 'block' : 'none';
        }

        const quoteAuthor = document.getElementById('quoteAuthor');
        if (quoteAuthor) {
          const quoteAuthorText = String(invitation.quoteAuthor || '').trim();
          quoteAuthor.textContent = quoteAuthorText || '';
          quoteAuthor.style.display = quoteAuthorText ? 'block' : 'none';
        }

        const groomNode = document.getElementById('groomName');
        const brideNode = document.getElementById('brideName');
        if (groomNode) groomNode.textContent = groomName;
        if (brideNode) brideNode.textContent = brideName;

        const groomParentNode = document.getElementById('parentGroom');
        const brideParentNode = document.getElementById('parentBride');
        if (groomParentNode) groomParentNode.textContent = groomParents;
        if (brideParentNode) brideParentNode.textContent = brideParents;

        const introText = document.getElementById('storyText');
        if (introText) {
          introText.textContent = story || '';
          introText.style.display = story ? 'block' : 'none';
        }

        const footerCoupleNames = document.getElementById('footerCoupleNames');
        const footerCredit = document.getElementById('footerCredit');
        if (footerCoupleNames) footerCoupleNames.textContent = `${groomName} & ${brideName}`;
        if (footerCredit) footerCredit.textContent = `Dibuat dengan cinta untuk ${groomName} & ${brideName}. © ${new Date().getFullYear()}`;

        const rsvpStatus = document.querySelector('[data-rsvp-message]');
        if (rsvpStatus) rsvpStatus.textContent = formatRsvpMessage(invitation);

        const dateNode = document.getElementById('eventDate');
        const timeNode = document.getElementById('eventTime');
        const placeNode = document.getElementById('eventPlace');
        const addressNode = document.getElementById('eventAddress');
        const mapFrame = document.getElementById('mapFrame');
        const mapContainer = document.getElementById('mapContainer');
        const locationLink = document.getElementById('locationLink');

        if (dateNode) {
          dateNode.textContent = eventDate || '';
          dateNode.style.display = eventDate ? 'block' : 'none';
        }
        if (timeNode) {
          timeNode.innerHTML = eventTime ? `Upacara dimulai pukul ${eventTime} <br /> Resepsi dilanjutkan setelahnya` : '';
          timeNode.style.display = eventTime ? 'block' : 'none';
        }
        if (placeNode) {
          placeNode.textContent = eventPlace || '';
          placeNode.style.display = eventPlace ? 'block' : 'none';
        }
        if (addressNode) {
          addressNode.innerHTML = eventAddress || '';
          addressNode.style.display = eventAddress ? 'block' : 'none';
        }
        if (mapFrame) mapFrame.src = mapEmbedUrl || '';
        if (mapContainer) mapContainer.style.display = mapEmbedUrl ? 'block' : 'none';
        if (locationLink) {
          locationLink.href = mapUrl || '#';
          locationLink.style.display = mapUrl ? 'inline-flex' : 'none';
        }

        const coverImage = document.querySelector('#cover .absolute.inset-0 > div:first-child');
        if (coverImage) coverImage.style.backgroundImage = invitation.openingPhoto ? `url('${invitation.openingPhoto}')` : '';

        const groomPhoto = document.getElementById('groomPhoto');
        if (groomPhoto) groomPhoto.src = invitation.groomPhoto || groomPhoto.getAttribute('src') || '';
        const bridePhoto = document.getElementById('bridePhoto');
        if (bridePhoto) bridePhoto.src = invitation.bridePhoto || bridePhoto.getAttribute('src') || '';

        const musicUrl = String(invitation.musicUrl || '').trim();
        if (musicWrapper) musicWrapper.style.display = musicUrl ? 'block' : 'none';
        if (musicUrl && musicEl) {
          musicEl.src = musicUrl;
          tryAutoplay();
        }

        renderGallery(invitation);
        renderCountdown(invitation);
      };

      async function loadLavenderInvitation() {
        if (!lavenderSlug) return;
        try {
          const snapshot = await lavenderDb.collection('gamon_wedding_invitations').where('shareSlug', '==', lavenderSlug).limit(1).get();
          if (!snapshot.empty) applyLavenderInvitation(snapshot.docs[0].data());
        } catch (error) {
          console.error('Gagal memuat data undangan lavender:', error);
        }
      }

      if (lavenderSlug) loadLavenderInvitation();
    </script>
  </body>
</html>
