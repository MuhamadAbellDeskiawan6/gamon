<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Slot Gamon Edukasi - Gamon Tawing</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "outline": "#7f7478",
                        "inverse-on-surface": "#f5eff1",
                        "secondary-fixed": "#ecdeee",
                        "primary-fixed": "#f4dce4",
                        "on-primary": "#ffffff",
                        "secondary": "#655b68",
                        "on-surface-variant": "#4d4447",
                        "on-error-container": "#93000a",
                        "surface-dim": "#ded9db",
                        "on-secondary": "#ffffff",
                        "on-surface": "#1d1b1d",
                        "surface-container-highest": "#e7e1e3",
                        "surface-container-high": "#ece7e9",
                        "on-primary-fixed-variant": "#524249",
                        "outline-variant": "#d0c3c7",
                        "background": "#fef8fa",
                        "on-secondary-fixed-variant": "#4d4450",
                        "tertiary-container": "#d9edf6",
                        "error-container": "#ffdad6",
                        "tertiary": "#4f6169",
                        "surface-container-lowest": "#ffffff",
                        "surface-container": "#f2ecee",
                        "secondary-container": "#ecdeee",
                        "tertiary-fixed-dim": "#b6cad2",
                        "on-primary-container": "#76646b",
                        "surface-bright": "#fef8fa",
                        "primary-fixed-dim": "#d7c1c8",
                        "primary": "#6b5a60",
                        "inverse-surface": "#323031",
                        "on-primary-fixed": "#25181e",
                        "on-secondary-container": "#6b616e",
                        "on-tertiary-container": "#596c73",
                        "on-tertiary-fixed": "#0b1e24",
                        "inverse-primary": "#d7c1c8",
                        "on-tertiary": "#ffffff",
                        "tertiary-fixed": "#d2e6ef",
                        "secondary-fixed-dim": "#cfc2d2",
                        "surface": "#fef8fa",
                        "on-error": "#ffffff",
                        "primary-container": "#fce4ec",
                        "surface-variant": "#e7e1e3",
                        "error": "#ba1a1a",
                        "on-tertiary-fixed-variant": "#374951",
                        "on-background": "#1d1b1d",
                        "surface-tint": "#6b5a60",
                        "on-secondary-fixed": "#201924",
                        "surface-container-low": "#f8f2f4"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "unit": "8px",
                        "section-gap": "80px",
                        "gutter": "24px",
                        "container-padding": "40px",
                        "margin-mobile": "20px"
                    },
                    "fontFamily": {
                        "body-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "display-lg": ["Playfair Display"],
                        "label-md": ["Inter"],
                        "headline-sm": ["Playfair Display"],
                        "headline-md": ["Playfair Display"]
                    },
                    "fontSize": {
                        "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}],
                        "body-md": ["16px", {"lineHeight": "1.6", "fontWeight": "400"}],
                        "display-lg": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "600"}],
                        "label-md": ["14px", {"lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "600"}],
                        "headline-sm": ["24px", {"lineHeight": "1.4", "fontWeight": "500"}],
                        "headline-md": ["32px", {"lineHeight": "1.3", "fontWeight": "500"}]
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: linear-gradient(135deg, #fef8fa 0%, #fce4ec 50%, #f2ecee 100%);
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px 0 rgba(107, 90, 96, 0.08);
        }
        .input-focus:focus {
            box-shadow: 0 0 0 4px rgba(252, 228, 236, 0.5);
            border-color: #d7c1c8;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .slot-display-container {
            background: var(--tw-bg-opacity, rgba(242, 236, 238, 1));
            box-shadow: none;
            border: 1px solid rgba(208, 195, 199, 0.5);
        }
        .slot-window {
            background: transparent;
            box-shadow: none;
            font-size: 2rem;
            padding: 2.5rem 0;
            color: var(--tw-text-opacity, #1d1b1d);
        }
    </style>
</head>
<body class="font-body-md text-on-surface selection:bg-primary-container selection:text-on-primary-container">

    <main class="relative z-10 flex flex-col items-center justify-center min-h-screen px-margin-mobile md:px-container-padding py-section-gap">
        
        <a class="self-start mb-unit flex items-center gap-2 text-on-surface-variant hover:text-primary transition-colors duration-200 group" href="index.html">
            <span class="material-symbols-outlined transition-transform group-hover:-translate-x-1">arrow_back</span>
            <span class="font-label-md text-label-md">Kembali ke Beranda</span>
        </a>

        <section class="glass-card w-full max-w-2xl p-gutter md:p-container-padding rounded-xl relative overflow-hidden">
            
            <div class="mb-gutter text-center">
                <h1 class="font-display-lg text-headline-md md:text-display-lg text-primary mb-2">Simulasi Gacha Gamon 🎰</h1>
                <p class="font-body-md text-on-surface-variant">Coba keberuntunganmu untuk tujuan edukasi — antarmuka disederhanakan.</p>
            </div>

            <div class="slot-display-container rounded-xl p-gutter border border-inverse-surface space-y-gutter mb-gutter">
                
                <div class="grid grid-cols-3 gap-3">
                    <div id="box1" class="slot-window rounded-lg text-4xl md:text-5xl py-8 font-bold flex items-center justify-center select-none">💔</div>
                    <div id="box2" class="slot-window rounded-lg text-4xl md:text-5xl py-8 font-bold flex items-center justify-center select-none">💔</div>
                    <div id="box3" class="slot-window rounded-lg text-4xl md:text-5xl py-8 font-bold flex items-center justify-center select-none">💔</div>
                </div>

                <div class="flex justify-between items-center bg-black/30 px-gutter py-2 rounded-lg text-white">
                    <div class="flex items-center gap-2 text-primary-fixed-dim">
                        <span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1">water_drop</span>
                        <span class="font-label-md text-xs md:text-sm">Saldo Air Mata: <span id="saldoDisplay" class="font-bold text-white">2.500</span> ml</span>
                    </div>
                    <div class="text-xs text-outline-variant font-label-md">
                        Biaya/Spin: <span class="text-white font-bold">500 ml</span>
                    </div>
                </div>
            </div>

            <div>
                <button id="spinBtn" onclick="mulaiSpin()" class="w-full py-gutter rounded-xl bg-primary text-on-primary font-headline-sm hover:brightness-110 shadow-lg shadow-primary/20 transition-all duration-300 active:scale-95 flex justify-center items-center gap-3" type="button">
                    <span id="btnText">Mulai Spin</span>
                    <span class="hidden animate-spin material-symbols-outlined" id="loader">progress_activity</span>
                </button>
            </div>

        </section>
    </main>

    <div id="popupModal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-margin-mobile">
        <div class="glass-card w-full max-w-md p-gutter md:p-6 rounded-xl border border-white text-center scale-95 transition-transform duration-300 space-y-4">
            <div class="w-16 h-16 bg-primary-container rounded-full flex items-center justify-center mx-auto text-primary">
                <span class="material-symbols-outlined text-3xl" id="popupIcon">workspace_premium</span>
            </div>
            <h2 class="font-display-lg text-headline-md text-primary" id="popupTitle">Hasil Gacha</h2>
            <p class="font-body-md text-on-surface-variant text-sm leading-relaxed" id="popupMessage">
                Isi pesan hasil gacha akan muncul di sini.
            </p>
            <div class="bg-surface-container-low p-unit rounded-lg border border-outline-variant text-xs text-left space-y-1">
                <span class="font-bold text-primary block">💡 Fakta Sistem:</span>
                <p id="popupEduText" class="text-on-surface-variant"></p>
            </div>
            <button onclick="closePopup()" class="w-full py-2 bg-primary text-on-primary font-semibold rounded-lg hover:brightness-110 transition-all text-sm">
                Lanjut Spin
            </button>
        </div>
    </div>

    <script>
        let saldo = 2500;
        let systemMode = 'realistis';
        let isSpinning = false;
        let gachaPattern = '';
        let spinCount = 0;
        let patternAPrimed = false;

        function generatePattern() {
            const patterns = ['A', 'B', 'C'];
            return patterns[Math.floor(Math.random() * patterns.length)];
        }

        gachaPattern = generatePattern();

        const itemsPool = [
            { 
                id: '💔', 
                label: 'Mantan Sudah Punya Pacar Baru', 
                desc: 'Apes, dia ternyata sudah jalan sama pacar barunya. Kamu mending mundur perlahan.', 
                type: 'zonk' 
            },
            { 
                id: '👻', 
                label: 'Kena Ghosting', 
                desc: 'Nyesek, chat kamu cuma dibaca tapi tidak dibalas sama sekali alias di-ghosting.', 
                type: 'zonk' 
            },
            { 
                id: '📱', 
                label: 'Cuma Berani Stalking', 
                desc: 'Hampir ada kemajuan, tapi kalian berdua sama-sama gengsi dan cuma saling stalking lewat second account.', 
                type: 'hampir' 
            },
            { 
                id: '👑', 
                label: 'Jackpot Balikan Sempurna', 
                desc: 'Luar biasa! Mantanmu mendadak chat duluan dan ngajakin kamu balikan hari ini.', 
                type: 'jackpot' 
            }
        ];

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(freq, type, duration) {
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        function switchMode(mode) {
            if(isSpinning) return;
            systemMode = mode;
            const btnReal = document.getElementById('modeRealistis');
            const btnSet = document.getElementById('modeSettingan');
            const desc = document.getElementById('modeDesc');

            if(mode === 'realistis') {
                btnReal.className = "py-2 px-3 text-xs font-semibold rounded-lg border-2 border-primary bg-primary-container/40 text-on-primary-container transition-all";
                btnSet.className = "py-2 px-3 text-xs font-semibold rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface-variant transition-all";
                desc.innerText = "*Mode Aktif: Peluang menang diatur tipis (hanya 1.5%) persis seperti algoritma asli di situs judi.";
            } else {
                btnSet.className = "py-2 px-3 text-xs font-semibold rounded-lg border-2 border-primary bg-primary-container/40 text-on-primary-container transition-all";
                btnReal.className = "py-2 px-3 text-xs font-semibold rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface-variant transition-all";
                desc.innerText = "*Mode Aktif: Sistem disetting menang telak untuk memanipulasi emosi pemain agar merasa beruntung di awal.";
            }
            playSound(300, 'triangle', 0.15);
        }

        function mulaiSpin() {
            if(isSpinning) return;

            if(saldo < 500) {
                showPopup(
                    'error', 
                    'Saldo Habis!', 
                    'Air matamu sudah habis dieksploitasi harapan kosong. Sistem memaksa kamu buat move on total.\nSilakan refresh halaman untuk mengisi saldo gratis.',
                    'Bandar judi memanfaatkan momen tanggung rugi ini supaya korban penasaran dan akhirnya mencari pinjol demi modal instan.'
                );
                return;
            }

            saldo -= 500;
            document.getElementById('saldoDisplay').innerText = saldo.toLocaleString('id-ID');
            
            isSpinning = true;
            document.getElementById('spinBtn').disabled = true;
            document.getElementById('loader').classList.remove('hidden');
            document.getElementById('btnText').innerText = 'Mengacak...';

            let ticks = 0;
            const interval = setInterval(() => {
                document.getElementById('box1').innerText = itemsPool[Math.floor(Math.random() * itemsPool.length)].id;
                document.getElementById('box2').innerText = itemsPool[Math.floor(Math.random() * itemsPool.length)].id;
                document.getElementById('box3').innerText = itemsPool[Math.floor(Math.random() * itemsPool.length)].id;
                playSound(600 + (ticks * 30), 'sine', 0.05);
                ticks++;

                if(ticks > 15) {
                    clearInterval(interval);
                    konfirmasiHasilAkhir();
                }
            }, 80);
        }

        function konfirmasiHasilAkhir() {
            let res1, res2, res3;
            const isFinalSpin = saldo === 0;
            const normalRoll = () => {
                const hitRate = Math.random() * 100;
                if (hitRate <= 1.5) {
                    return [itemsPool[3], itemsPool[3], itemsPool[3]];
                } else if (hitRate <= 20) {
                    return [itemsPool[2], itemsPool[2], itemsPool[0]];
                }
                return [
                    itemsPool[Math.floor(Math.random() * 2)],
                    itemsPool[Math.floor(Math.random() * 3)],
                    itemsPool[Math.floor(Math.random() * 2)]
                ];
            };

            if (gachaPattern === 'A') {
                if (spinCount === 0) {
                    const seed = Math.random();
                    if (seed < 0.45) {
                        [res1, res2, res3] = [itemsPool[3], itemsPool[3], itemsPool[3]];
                        patternAPrimed = true;
                    } else if (seed < 0.75) {
                        [res1, res2, res3] = [itemsPool[2], itemsPool[2], itemsPool[0]];
                    } else {
                        [res1, res2, res3] = normalRoll();
                    }
                } else if (patternAPrimed) {
                    const seed = Math.random();
                    if (seed < 0.25) {
                        [res1, res2, res3] = [itemsPool[2], itemsPool[2], itemsPool[0]];
                    } else {
                        [res1, res2, res3] = [
                            itemsPool[Math.floor(Math.random() * 2)],
                            itemsPool[Math.floor(Math.random() * 2)],
                            itemsPool[Math.floor(Math.random() * 2)]
                        ];
                    }
                } else {
                    [res1, res2, res3] = normalRoll();
                }
            } else if (gachaPattern === 'B') {
                if (isFinalSpin) {
                    [res1, res2, res3] = [itemsPool[3], itemsPool[3], itemsPool[3]];
                } else if (spinCount === 0) {
                    const seed = Math.random();
                    if (seed < 0.45) {
                        [res1, res2, res3] = [itemsPool[0], itemsPool[1], itemsPool[0]];
                    } else {
                        [res1, res2, res3] = [itemsPool[2], itemsPool[2], itemsPool[0]];
                    }
                } else {
                    const seed = Math.random();
                    if (seed < 0.25) {
                        [res1, res2, res3] = [itemsPool[2], itemsPool[2], itemsPool[0]];
                    } else {
                        [res1, res2, res3] = [itemsPool[Math.floor(Math.random() * 2)], itemsPool[Math.floor(Math.random() * 2)], itemsPool[Math.floor(Math.random() * 2)]];
                    }
                }
            } else {
                [res1, res2, res3] = normalRoll();
            }

            spinCount++;
            document.getElementById('box1').innerText = res1.id;
            document.getElementById('box2').innerText = res2.id;
            document.getElementById('box3').innerText = res3.id;

            if(res1.id === res2.id && res2.id === res3.id) {
                if(res1.id === '👑') {
                    saldo += 3000;
                    document.getElementById('saldoDisplay').innerText = saldo.toLocaleString('id-ID');
                    playSound(880, 'square', 0.4);
                    showPopup(
                        'celebrate',
                        'JACKPOT! 🎉',
                        res1.desc,
                        'Kemenangan di awal ini sebenarnya cuma umpan sistem. Di judi asli, bandar sengaja mengatur algoritma akun baru agar sering menang di awal supaya pemain penasaran, sebelum akhirnya dikuras habis saat taruhan mulai besar.'
                    );
                } else {
                    playSound(440, 'triangle', 0.3);
                    showPopup('info', 'Kombinasi Kembar!', res1.desc, 'Hasil kembar ini sengaja dimunculkan sistem untuk memancing rasa penasaran kamu.');
                }
            } else if (res1.id === res2.id || res2.id === res3.id) {
                playSound(250, 'sawtooth', 0.2);
                showPopup(
                    'info',
                    'Dikit Lagi Berhasil!',
                    'Dua simbol sudah kembar, kurang satu langkah lagi buat dapet jackpot.',
                    'Ini namanya Near-Miss Effect. Di sistem judi, trik psikologi ini dipakai supaya pemain merasa "hampir menang" dan ketagihan buat klik spin terus-menerus padahal aslinya kalah.'
                );
            } else {
                playSound(150, 'sawtooth', 0.3);
                showPopup(
                    'fail',
                    'Zonk!',
                    res1.desc,
                    'Ini realita matematikanya. Makin sering tombol spin ditekan, peluang rugi di mode realistis bakal makin mendekati 99% karena sistem sudah disetting untuk memenangkan bandar.'
                );
            }

            document.getElementById('spinBtn').disabled = false;
            document.getElementById('loader').classList.add('hidden');
            document.getElementById('btnText').innerText = 'Mulai Spin';
            isSpinning = false;
        }

        function showPopup(type, title, message, eduText) {
            const modal = document.getElementById('popupModal');
            const icon = document.getElementById('popupIcon');
            
            document.getElementById('popupTitle').innerText = title;
            document.getElementById('popupMessage').innerText = message;
            document.getElementById('popupEduText').innerText = eduText;

            if(type === 'celebrate') {
                icon.innerText = 'workspace_premium';
                icon.parentElement.className = "w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto";
            } else if (type === 'error' || type === 'fail') {
                icon.innerText = 'heart_broken';
                icon.parentElement.className = "w-16 h-16 bg-red-100 text-error rounded-full flex items-center justify-center mx-auto";
            } else {
                icon.innerText = 'info';
                icon.parentElement.className = "w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto";
            }

            // Sesuaikan tombol aksi pada popup
            const actionBtn = modal.querySelector('button');
            if (type === 'error' && title && title.toLowerCase().includes('saldo')) {
                actionBtn.innerText = 'Sudah isi saldo? Refresh';
                actionBtn.onclick = () => { location.reload(); };
            } else {
                actionBtn.innerText = 'Lanjut Spin';
                actionBtn.onclick = closePopup;
            }

            modal.classList.remove('hidden');
        }

        function closePopup() {
            document.getElementById('popupModal').classList.add('hidden');
            playSound(400, 'sine', 0.05);
        }
    </script>
</body>
</html>
