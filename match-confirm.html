<script>
    const spaceBg = document.getElementById('spaceBackground');
    const starsEl = document.getElementById('stars');
    for (let i = 0; i < 60; i++) {
        const s = document.createElement('div');
        s.className = 'star-particle';
        const sz = 2 + Math.random() * 4;
        s.style.cssText = `width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;animation:pulse-soft ${3+Math.random()*6}s infinite ease-in-out;animation-delay:${Math.random()*5}s`;
        starsEl.appendChild(s);
    }

    const spaceEmojis = ['☁️', '🪐', '✨', '☁️', '🌙'];
    for (let i = 0; i < 6; i++) {
        const decor = document.createElement('div');
        decor.className = 'space-decor';
        decor.textContent = spaceEmojis[i % spaceEmojis.length];
        decor.style.fontSize = (40 + Math.random() * 60) + 'px';
        decor.style.left = (Math.random() * 90) + '%';
        decor.style.top = (Math.random() * 80) + '%';
        decor.style.animationDelay = (Math.random() * -10) + 's';
        decor.style.animationDuration = (15 + Math.random() * 15) + 's';
        spaceBg.appendChild(decor);
    }

    (function () {
        const cloudL = document.getElementById('gtCloudLeft');
        const cloudR = document.getElementById('gtCloudRight');
        if (!cloudL || !cloudR) return;

        let targetY = 0, currentY = 0;
        function onScroll() {
            targetY = window.scrollY || window.pageYOffset || 0;
        }
        window.addEventListener('scroll', onScroll, { passive: true });

        function tick() {
            currentY += (targetY - currentY) * 0.06;
            cloudL.style.transform = `translate3d(${-currentY * 0.03}px, ${-currentY * 0.05}px, 0)`;
            cloudR.style.transform = `translate3d(${currentY * 0.03}px, ${-currentY * 0.05}px, 0) scaleX(-1)`;
            requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
    })();
</script>

    function escapeHtml(value) {
        return String(value || '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')

            img.crossOrigin = 'anonymous';
            img.referrerPolicy = 'no-referrer';
            img.onload = () => resolve(img);
            img.onerror = () => resolve(null);
            img.src = src;
        });
    }

    function roundedRect(ctx, x, y, width, height, radius) {
        ctx.beginPath();
        ctx.moveTo(x + radius, y);
        ctx.lineTo(x + width - radius, y);
        ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
        ctx.lineTo(x + width, y + height - radius);
        ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
        ctx.lineTo(x + radius, y + height);
        ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
        ctx.lineTo(x, y + radius);
        ctx.quadraticCurveTo(x, y, x + radius, y);
        ctx.closePath();
    }

    async function exportCardAsImage({ name, recipient, message, createdAt, statusLabel }) {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        const width = 1200;
        const height = 1600;
        canvas.width = width;
        canvas.height = height;

        const bgGradient = ctx.createLinearGradient(0, 0, width, height);
        bgGradient.addColorStop(0, '#010A17');
        bgGradient.addColorStop(0.35, '#0A4267');
        bgGradient.addColorStop(0.7, '#20658E');
        bgGradient.addColorStop(1, '#6BADC4');
        ctx.fillStyle = bgGradient;
        ctx.fillRect(0, 0, width, height);

        ctx.fillStyle = 'rgba(255,255,255,0.08)';
        for (let i = 0; i < 26; i++) {
            const x = (i * 97) % width;
            const y = (i * 149) % height;
            const r = 2 + ((i * 7) % 6);
            ctx.beginPath();
            ctx.arc(x + 20, y + 20, r, 0, Math.PI * 2);
            ctx.fill();
        }

        const cardX = 120;
        const cardY = 120;
        const cardW = width - 240;
        const cardH = height - 240;

        roundedRect(ctx, cardX, cardY, cardW, cardH, 52);
        ctx.fillStyle = 'rgba(255,255,255,0.10)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.22)';
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.fillStyle = 'rgba(255,255,255,0.08)';
        ctx.beginPath();
        ctx.arc(cardX + cardW - 110, cardY + 80, 180, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = 'rgba(255,255,255,0.08)';
        ctx.beginPath();
        ctx.arc(cardX + 90, cardY + cardH - 90, 170, 0, Math.PI * 2);
        ctx.fill();

        const brandX = cardX + 54;
        const brandY = cardY + 54;
        ctx.fillStyle = '#FCE8F3';
        ctx.beginPath();
        ctx.arc(brandX + 16, brandY + 16, 12, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#FFFFFF';
        ctx.font = '700 34px Segoe UI';
        ctx.textAlign = 'left';
        ctx.fillText('GAMON TAWING', brandX + 42, brandY + 24);

        const statusText = String(statusLabel || 'Menunggu match');
        const statusWidth = 250;
        const statusX = cardX + cardW - 300;
        const statusY = cardY + 60;
        roundedRect(ctx, statusX, statusY - 18, statusWidth, 52, 26);
        ctx.fillStyle = '#DFF7E8';
        ctx.fill();
        ctx.fillStyle = '#1D1B1D';
        ctx.font = '700 26px Segoe UI';
        ctx.textAlign = 'center';
        ctx.fillText(statusText, statusX + statusWidth / 2, statusY + 11);

        ctx.fillStyle = '#FFFFFF';
        ctx.font = '700 84px Georgia';
        ctx.textAlign = 'left';
        ctx.fillText('Kartu Gamon', cardX + 54, cardY + 160);

        ctx.fillStyle = 'rgba(255,255,255,0.78)';
        ctx.font = '600 22px Segoe UI';
        ctx.fillText('Curhat & match card', cardX + 58, cardY + 200);

        const labelStyle = { font: '700 22px Segoe UI', color: '#D8E7F5' };
        const valueStyle = { font: '600 40px Segoe UI', color: '#FFFFFF' };

        const metaY = cardY + 300;
        const leftMetaX = cardX + 54;
        const rightMetaX = cardX + cardW / 2 + 18;
        const metaW = cardW / 2 - 72;
        const metaH = 150;

        roundedRect(ctx, leftMetaX, metaY, metaW, 150, 28);
        ctx.fillStyle = 'rgba(255,255,255,0.06)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.12)';
        ctx.stroke();

        roundedRect(ctx, rightMetaX, metaY, metaW, 150, 28);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#D8E7F5';
        ctx.font = labelStyle.font;
        ctx.textAlign = 'left';
        ctx.fillText('Nama kamu', leftMetaX + 28, metaY + 46);
        ctx.fillText('Untuk', rightMetaX + 28, metaY + 46);

        ctx.fillStyle = '#FFFFFF';
        ctx.font = valueStyle.font;
        ctx.fillText((name || 'Anonim').slice(0, 18), leftMetaX + 28, metaY + 100);
        ctx.fillText((recipient || 'Seseorang').slice(0, 18), rightMetaX + 28, metaY + 100);

        const messageBoxY = cardY + 510;
        const messageBoxW = cardW - 108;
        roundedRect(ctx, cardX + 54, messageBoxY, messageBoxW, 270, 30);
        ctx.fillStyle = 'rgba(255,255,255,0.06)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.12)';
        ctx.stroke();

        ctx.fillStyle = '#D8E7F5';
        ctx.font = '700 22px Segoe UI';
        ctx.fillText('Pesan', cardX + 82, messageBoxY + 42);

        ctx.fillStyle = '#FFFFFF';
        ctx.font = '600 30px Segoe UI';
        const trimmedMessage = (message || 'Tidak ada pesan tambahan.').replace(/\s+/g, ' ').trim();
        const messageLines = [];
        let currentLine = '';
        const words = trimmedMessage.split(' ');
        for (const word of words) {
            const testLine = currentLine ? `${currentLine} ${word}` : word;
            if (ctx.measureText(testLine).width > messageBoxW - 120) {
                messageLines.push(currentLine);
                currentLine = word;
            } else {
                currentLine = testLine;
            }
        }
        if (currentLine) messageLines.push(currentLine);
        const visibleLines = messageLines.slice(0, 6);
        visibleLines.forEach((line, index) => {
            ctx.fillText(line, cardX + 82, messageBoxY + 90 + index * 34);
        });

        const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=420x420&data=${encodeURIComponent(getCurrentConfirmUrl())}`;
        const qrImage = await loadImage(qrUrl);
        const qrSize = 240;
        const qrX = cardX + cardW - 58 - qrSize;
        const qrY = cardY + cardH - 240;
        roundedRect(ctx, qrX, qrY, qrSize, qrSize, 26);
        ctx.fillStyle = '#FFFFFF';
        ctx.fill();

        if (qrImage) {
            try {
                ctx.drawImage(qrImage, qrX + 14, qrY + 14, qrSize - 28, qrSize - 28);
            } catch (error) {
                console.warn('QR canvas draw failed, continuing without QR image.', error);
            }
        }

        ctx.fillStyle = '#FFFFFF';
        ctx.font = '600 26px Segoe UI';
        ctx.textAlign = 'left';
        const footerY = qrY + qrSize + 40;
        ctx.fillText('Scan QR ini untuk', cardX + 54, footerY);
        ctx.fillText('membuka halaman konfirmasi', cardX + 54, footerY + 36);
        ctx.fillText('kapan saja.', cardX + 54, footerY + 72);

        ctx.fillStyle = 'rgba(255,255,255,0.85)';
        ctx.font = '600 22px Segoe UI';
        ctx.fillText(`Dibuat: ${createdAt || 'Tanggal tidak tersedia'}`, cardX + 54, cardY + cardH - 54);

        const blob = await new Promise((resolve, reject) => {
            canvas.toBlob((result) => {
                if (result) {
                    resolve(result);
                    return;
                }
                reject(new Error('Gagal menghasilkan file PNG dari kartu.'));
            }, 'image/png');
        });

        const objectUrl = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = objectUrl;
        link.download = 'kartu-gamon.png';
        link.rel = 'noopener';
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(objectUrl), 1200);
    }

    const requestRef = doc(db, 'matchRequests', requestId);

    function normalizePhoneForWa(rawText) {
        const digits = String(rawText || '').replace(/\D/g, '');
        if (!digits || digits.length < 8) return null;

        let number = digits;
        if (number.startsWith('0')) {
            number = '62' + number.slice(1);
        } else if (!number.startsWith('62')) {
            number = '62' + number;
        }

        return number;
    }

    function buildWhatsAppLink(rawText) {
        const phone = normalizePhoneForWa(rawText);
        if (!phone) return null;

        const text = encodeURIComponent('Hai, aku lihat kontak ini dari halaman Gamon Tawing.');
        return `https://wa.me/${phone}?text=${text}`;
    }

    function setWaitingState(customMessage) {
        statusBadge.textContent = 'Menunggu konfirmasi';
        statusMessage.textContent = customMessage || 'Belum ada match yang terbentuk. Link ini akan berubah otomatis saat ada user lain yang submit dan cocok.';
        confirmBtn.disabled = true;
        confirmBtn.textContent = 'Menunggu match...';
        confirmBtn.classList.add('opacity-60', 'cursor-not-allowed');
        contactPanel.classList.add('hidden');
        if (contactWhatsAppBtn) {
            contactWhatsAppBtn.classList.add('hidden');
            contactWhatsAppBtn.href = '#';
        }
    }

    async function loadOtherContact(currentMatchId) {
        if (!currentMatchId) {
            contactPanel.classList.add('hidden');
            if (contactWhatsAppBtn) {
                contactWhatsAppBtn.classList.add('hidden');
                contactWhatsAppBtn.href = '#';
            }
            return;
        }

        const contactsQuery = query(collection(db, 'matchContacts'), where('matchId', '==', currentMatchId));
        const snapshot = await getDocs(contactsQuery);
        const otherContact = snapshot.docs.find(item => item.data().requestId !== requestId);
        const otherValue = otherContact?.data()?.contactText || 'Kontak belum terbuka sampai keduanya konfirmasi.';

        contactValue.textContent = otherValue;
        contactPanel.classList.remove('hidden');

        if (contactWhatsAppBtn) {
            const waLink = buildWhatsAppLink(otherValue);
            if (waLink) {
                contactWhatsAppBtn.href = waLink;
                contactWhatsAppBtn.classList.remove('hidden');
            } else {
                contactWhatsAppBtn.href = '#';
                contactWhatsAppBtn.classList.add('hidden');
            }
        }
    }

    function bindMatchListener(currentMatchId) {
        if (!currentMatchId) {
            setWaitingState();
            return;
        }

        if (activeMatchUnsubscribe) {
            activeMatchUnsubscribe();
        }

        const matchRef = doc(db, 'matches', currentMatchId);
        activeMatchUnsubscribe = onSnapshot(matchRef, async (snapshot) => {
            if (!snapshot.exists()) {
                statusBadge.textContent = 'Match tidak ditemukan';
                statusMessage.textContent = 'Dokumen match ini tidak ditemukan atau sudah kedaluwarsa.';
                confirmBtn.disabled = true;
                return;
            }

            const data = snapshot.data();
            const confirmedBy = data.confirmedBy || {};
            const requestIds = data.requestIds || [];
            const otherRequestId = requestIds.find((id) => id !== requestId) || null;
            const isCurrentConfirmed = Boolean(confirmedBy[requestId]);
            const isOtherConfirmed = otherRequestId ? Boolean(confirmedBy[otherRequestId]) : false;

            if (data.status === 'confirmed' || (isCurrentConfirmed && isOtherConfirmed)) {
                statusBadge.textContent = 'Sudah sama-sama mau';
                statusMessage.textContent = 'Akhirnya, kalian berdua sama-sama mau. Kontak mantanmu sudah bisa dibuka.';
                confirmBtn.disabled = true;
                confirmBtn.textContent = 'Sudah konfirmasi';
                confirmBtn.classList.add('opacity-60', 'cursor-not-allowed');
                await loadOtherContact(currentMatchId);
                return;
            }

            if (isCurrentConfirmed) {
                statusBadge.textContent = 'Kamu sudah konfirmasi';
                statusMessage.textContent = 'Kamu sudah menandai konfirmasi. Menunggu dia juga ya…';
                confirmBtn.disabled = true;
                confirmBtn.textContent = 'Kamu sudah konfirmasi';
                confirmBtn.classList.add('opacity-60', 'cursor-not-allowed');
                contactPanel.classList.add('hidden');
                return;
            }

            statusBadge.textContent = 'Menunggu konfirmasi';
            statusMessage.textContent = 'Menunggu konfirmasi dari dia juga...';
            confirmBtn.disabled = false;
            confirmBtn.textContent = 'Iya, aku masih beneran mau 🥹';
            confirmBtn.classList.remove('opacity-60', 'cursor-not-allowed');
            contactPanel.classList.add('hidden');
        });
    }

    onSnapshot(requestRef, async (snapshot) => {
        if (!snapshot.exists()) {
            statusBadge.textContent = 'Link tidak valid';
            statusMessage.textContent = 'Request ini tidak ditemukan atau sudah kedaluwarsa.';
            confirmBtn.disabled = true;
            return;
        }

        const requestData = snapshot.data();
        const resolvedMatchId = matchId || requestData.matchId || null;

        if (requestData.curhatId) {
            const curhatSnap = await getDoc(doc(db, 'gamon', requestData.curhatId));
            const curhatData = curhatSnap.exists() ? curhatSnap.data() : {};
            if (downloadCardBtn) {
                downloadCardBtn.onclick = async () => {
                    try {
                        downloadCardBtn.disabled = true;
                        downloadCardBtn.textContent = 'Membuat gambar...';

                        await exportCardAsImage({
                            name: curhatData.nama || 'Anonim',
                            recipient: curhatData.tujuan || 'Seseorang',
                            message: curhatData.pesan || '',
                            createdAt: curhatData.waktu ? new Date(Number(curhatData.waktu)).toLocaleString('id-ID') : 'Tanggal tidak tersedia',
                            statusLabel: resolvedMatchId ? 'Sudah ada match' : 'Menunggu match'
                        });
                    } catch (error) {
                        console.error(error);
                        alert('Gagal membuat file gambar kartu. Silakan coba lagi.');
                    } finally {
                        downloadCardBtn.disabled = false;
                        downloadCardBtn.textContent = 'Download kartu gamon';
                    }
                };
            }
        }

        if (resolvedMatchId) {
            matchId = resolvedMatchId;
            bindMatchListener(matchId);
            return;
        }

        setWaitingState('Belum ada match yang terbentuk. Kartu gamon ini bisa diunduh dan QR-nya tetap membuka halaman konfirmasi ini kapan saja.');
    });

    confirmBtn.addEventListener('click', async () => {
        if (!matchId) {
            alert('Belum ada match yang terbentuk. Tunggu sampai pasanganmu mengisi form dan cocok dulu ya.');
            return;
        }

        try {
            confirmBtn.disabled = true;
            confirmBtn.textContent = 'Mengirim konfirmasi...';

            const matchRef = doc(db, 'matches', matchId);
            const matchSnapshot = await getDocs(query(collection(db, 'matches'), where('__name__', '==', matchId)));
            const currentMatch = matchSnapshot.empty ? null : matchSnapshot.docs[0];
            const currentData = currentMatch?.data() || {};
            const nextConfirmedBy = {
                ...(currentData.confirmedBy || {}),
                [requestId]: true
            };

            const allConfirmed = (currentData.requestIds || []).every((id) => Boolean(nextConfirmedBy[id]));

            await updateDoc(matchRef, {
                confirmedBy: nextConfirmedBy,
                status: allConfirmed ? 'confirmed' : 'pending_confirmation',
                updatedAt: Date.now()
            });

            await updateDoc(requestRef, {
                confirmedBy: {
                    ...(currentData.confirmedBy || {}),
                    [requestId]: true
                },
                status: allConfirmed ? 'confirmed' : 'matched',
                updatedAt: Date.now()
            });

        } catch (error) {
            console.error(error);
            alert('Gagal mengirim konfirmasi. Silakan coba lagi.');
            confirmBtn.disabled = false;
            confirmBtn.textContent = 'Iya, aku masih beneran mau 🥹';
        }
    });
</script>
