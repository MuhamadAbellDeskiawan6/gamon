<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasir / Admin Redeem Photobox</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-4">
    <div class="bg-white rounded-3xl shadow-xl max-w-lg w-full p-6">
        <h1 class="text-2xl font-bold text-slate-800 text-center mb-1">Verifikasi Kasir Photobox</h1>
        <p class="text-xs text-slate-500 text-center mb-6">Scan QR pelanggan atau masukkan Order ID untuk menandai merchandise sebagai sudah diambil.</p>

        <div class="flex border-b mb-6">
            <button onclick="switchTab('manual')" id="tabManual" class="flex-1 pb-3 font-semibold text-blue-600 border-b-2 border-blue-600 text-sm">Ketik Order ID</button>
            <button onclick="switchTab('scanner')" id="tabScanner" class="flex-1 pb-3 font-medium text-slate-400 border-b-2 border-transparent text-sm">Scan Kamera QR</button>
        </div>

        <div id="sectionManual" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Order ID</label>
                <input type="text" id="redeemInput" placeholder="Contoh: GAMON-1687654321000" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:outline-none uppercase font-mono font-bold tracking-wider">
            </div>
            <button id="verifyButton" onclick="processRedeem()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-3 rounded-xl transition shadow-lg shadow-emerald-600/20">
                Verifikasi & Tandai Diambil
            </button>
        </div>

        <div id="sectionScanner" class="hidden space-y-4">
            <div id="reader" class="w-full rounded-2xl overflow-hidden border"></div>
            <p class="text-xs text-center text-slate-400">Arahkan kamera ke QR Code order pelanggan.</p>
        </div>

        <div id="resultBox" class="mt-6 hidden rounded-2xl p-4 text-sm"></div>

    </div>

    <script type="module" src="./redeem-photobox.js"></script>
</body>
</html>
