<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voucher Kafe Anda</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Library QRCode JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- Library html2canvas untuk tombol download QR -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white rounded-3xl shadow-xl max-w-md w-full p-6 text-center">
        <div id="statusContainer">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-green-100 text-green-600 rounded-full text-3xl mb-4">
                ✓
            </div>
            <h1 class="text-2xl font-bold text-slate-800 mb-1">Voucher Siap Digunakan!</h1>
            <p class="text-sm text-slate-500 mb-6">Tunjukkan QR Code ini atau kode unik ke kasir kafe.</p>

            <div class="bg-slate-50 border border-slate-200 rounded-2xl p-4 mb-6 text-left">
                <div class="text-xs text-slate-400 font-semibold uppercase">Nama Voucher</div>
                <div id="voucherName" class="font-bold text-slate-800 text-lg mb-2">-</div>
                
                <div class="text-xs text-slate-400 font-semibold uppercase">Kafe Partner</div>
                <div id="cafeName" class="font-medium text-slate-700 mb-2">-</div>

                <div class="text-xs text-slate-400 font-semibold uppercase">Kode Redeem Unik</div>
                <div id="redeemCodeText" class="font-mono font-bold text-xl text-indigo-600 tracking-wider">-</div>
            </div>

            <!-- Area QR Code yang bisa di-download -->
            <div id="qrArea" class="bg-white p-4 inline-block rounded-2xl border border-slate-100 shadow-sm mb-4">
                <div id="qrcode" class="flex justify-center"></div>
            </div>

            <!-- Tombol Download QR -->
            <div class="mb-4">
                <button onclick="downloadQR()" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-medium py-2.5 rounded-xl text-sm transition">
                    📥 Download Gambar QR Code
                </button>
            </div>
        </div>

        <div class="mt-6 border-t pt-4">
            <a href="/cafe.html" class="text-xs text-indigo-600 hover:underline">← Beli Voucher Lain / Cek Pesanan</a>
        </div>
    </div>

    <script>
        let currentRedeemCode = '';

        async function loadVoucher() {
            const urlParams = new URLSearchParams(window.location.search);
            const orderId = urlParams.get('orderId');

            if (!orderId) {
                document.getElementById('statusContainer').innerHTML = `<h2 class="text-red-500 font-bold">Order ID tidak ditemukan!</h2>`;
                return;
            }

            try {
                const response = await fetch(`/api/get-cafe-voucher?orderId=${orderId}`);
                const result = await response.json();

                if (result.success) {
                    const data = result.data;
                    currentRedeemCode = data.redeemCode;

                    document.getElementById('voucherName').innerText = data.voucherName;
                    document.getElementById('cafeName').innerText = data.cafeName;
                    document.getElementById('redeemCodeText').innerText = data.redeemCode;

                    if (data.status === 'REDEEMED') {
                        // JIKA SUDAH DIREDEEM KASIR
                        document.getElementById('statusContainer').innerHTML = `
                            <div class="text-amber-500 text-5xl mb-3">⚠️</div>
                            <h2 class="text-xl font-bold text-amber-800 mb-1">Voucher Telah Digunakan</h2>
                            <p class="text-sm text-amber-600 mb-4">Voucher ini sudah sukses ditukar di kasir pada ${new Date(data.redeemedAt?.seconds * 1000 || Date.now()).toLocaleTimeString()}.</p>
                            <div class="bg-amber-50 border border-amber-200 rounded-xl p-4 text-xs text-amber-700">
                                Terima kasih telah berkunjung!
                            </div>
                        `;
                    } else {
                        // RENDER QR CODE
                        const qrContainer = document.getElementById('qrcode');
                        qrContainer.innerHTML = '';
                        new QRCode(qrContainer, {
                            text: data.redeemCode,
                            width: 180,
                            height: 180,
                            colorDark: "#000000",
                            colorLight: "#ffffff",
                            correctLevel: QRCode.CorrectLevel.H
                        });
                        
                        // Auto polling cek status tiap 4 detik (jika kasir melayani, halaman user otomatis berubah jadi sukses/redeemed)
                        setTimeout(loadVoucher, 4000);
                    }
                }
            } catch (e) {
                console.error("Gagal memuat voucher:", e);
            }
        }

        // Fungsi Download QR Code
        function downloadQR() {
            const qrArea = document.getElementById('qrArea');
            html2canvas(qrArea).then(canvas => {
                const link = document.createElement('a');
                link.download = `Voucher-Kafe-${currentRedeemCode}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }

        loadVoucher();
    </script>
</body>
</html>
