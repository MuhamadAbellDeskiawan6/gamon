<style>
        body {
            background: linear-gradient(135deg, #fff5f8 0%, #f3e8ff 50%, #ffffff 100%);

            overflow-y: auto;

        }

            color: #1d1b1d;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .input-focus:focus {
            box-shadow: 0 0 0 4px rgba(252, 228, 236, 0.5);
            border-color: #d7c1c8;
        }
        .send-btn:hover {

        }
        .send-btn:active {
            transform: scale(0.95);

<body class="font-body-md text-on-surface selection:bg-primary-container selection:text-on-primary-container">
<main class="relative z-10 flex flex-col items-center justify-center min-h-screen px-margin-mobile md:px-container-padding py-section-gap">
<!-- Back Link -->
<a class="self-start mb-unit flex items-center gap-2 text-on-surface-variant hover:text-primary transition-colors duration-200 group" href="index.html">
<span class="material-symbols-outlined transition-transform group-hover:-translate-x-1">arrow_back</span>
<span class="font-label-md text-label-md">Kembali ke Beranda</span>
</a>

<!-- Chat Container -->
<section class="glass-card w-full max-w-2xl p-gutter md:p-container-padding rounded-xl flex flex-col h-auto md:h-[70vh]">
<div class="mb-gutter text-center">
<h1 class="font-display-lg text-headline-md md:text-display-lg text-primary mb-2">💔 AI Curhat Gamon</h1>
<p class="font-body-md text-on-surface-variant">Curhatlah dengan AI yang penuh empati tentang perasaanmu.</p>
</div>

<!-- CHAT BOX -->
<div id="chat" class="chat-box flex-1 bg-surface-container-low/50 rounded-lg p-4 mb-4 overflow-y-auto"></div>

<!-- INPUT -->
<div class="flex flex-col sm:flex-row gap-3">
  <input id="input" class="flex-1 bg-surface-container-lowest border border-outline-variant rounded-full px-gutter py-3 text-on-surface focus:outline-none input-focus transition-all w-full" placeholder="Tulis curhatanmu..." />
  <button onclick="send()" class="bg-primary text-on-primary px-6 py-3 rounded-full font-semibold hover:brightness-110 shadow-lg shadow-primary/20 transition-all duration-300 send-btn flex items-center justify-center gap-2 w-full sm:w-auto">
    <span class="material-symbols-outlined">send</span>
    <span>Kirim</span>
  </button>
</div>
</section>
</main>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("input");
const sendBtn = document.querySelector('button[onclick="send()"]');

// riwayat percakapan (context memory) untuk sesi ini
let history = [];

// tambah pesan ke UI
function addMessage(text, type) {
  const div = document.createElement("div");
  div.className = "msg " + type;
  div.innerText = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

// tampilkan typing indicator
function showTyping() {
  const typingDiv = document.createElement("div");
  typingDiv.className = "msg ai typing";
  typingDiv.innerHTML = '<div class="flex items-center gap-2"><div class="flex gap-1"><div class="w-2 h-2 bg-primary rounded-full animate-bounce"></div><div class="w-2 h-2 bg-primary rounded-full animate-bounce" style="animation-delay: 0.1s"></div><div class="w-2 h-2 bg-primary rounded-full animate-bounce" style="animation-delay: 0.2s"></div></div><span class="text-sm text-on-surface-variant">AI sedang mengetik...</span></div>';
  typingDiv.id = "typing-indicator";
  chat.appendChild(typingDiv);
  chat.scrollTop = chat.scrollHeight;
}

// sembunyikan typing indicator
function hideTyping() {
  const typingDiv = document.getElementById("typing-indicator");
  if (typingDiv) typingDiv.remove();
}

// kirim ke backend
async function send() {
  const text = input.value.trim();
  if (!text) return;

  // disable input dan button
  input.disabled = true;
  sendBtn.disabled = true;
  sendBtn.innerHTML = '<span class="animate-spin material-symbols-outlined">progress_activity</span>';

  addMessage(text, "me");
  input.value = "";

  showTyping();

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ message: text, history })
    });

    const data = await res.json();

    hideTyping();
    addMessage(data.reply || "AI tidak merespon", "ai");

    // simpan ke history supaya AI ingat konteks percakapan
    history.push({ role: "user", content: text });
    history.push({ role: "assistant", content: data.reply || "" });

  } catch (error) {
    hideTyping();
    addMessage("Maaf, terjadi kesalahan. Coba lagi nanti.", "ai");
  }

  // enable kembali
  input.disabled = false;
  sendBtn.disabled = false;
  sendBtn.innerHTML = '<span class="material-symbols-outlined">send</span><span>Kirim</span>';
  input.focus();
}

// enter key support
input.addEventListener('keypress', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});

// welcome message
setTimeout(() => {
  addMessage("Halo! Saya di sini untuk mendengarkan curhatanmu. Apa yang sedang kamu rasakan? 💕", "ai");
}, 500);
</script>

</body>
