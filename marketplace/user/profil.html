<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profil — Marketplace Mantan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../assets/style.css" />
  </head>
  <body data-page="profil.html">
    <header class="topbar">
      <div class="container nav">
        <a href="../index.html" class="brand" aria-label="Home">
          <span class="brand-mark">G</span>
          <span>Marketplace Mantan</span>
        </a>
        <div class="nav-actions">
          <a class="btn btn-secondary" href="profil.html">Profil</a>
          <a class="btn btn-primary" href="../index.html" data-logout-button>Keluar</a>
        </div>
      </div>
    </header>

    <main class="container user-layout">
      <div class="user-shell">
        <aside class="sidebar">
          <div class="profile-box">
            <div class="avatar-lg">P</div>
            <div>
              <strong style="display:block; color: var(--primary-strong);">Pengguna</strong>
              <small class="muted">Seller & Buyer</small>
            </div>
          </div>

          <nav aria-label="Sidebar navigasi">
            <a href="dashboard.html">📊 Dashboard</a>
            <a href="jual.html">📦 Jual</a>
            <a href="beli.html">🛒 Beli</a>
            <a href="my-products.html">📋 Barang Saya</a>
            <a class="active" href="profil.html">👤 Profil</a>
            <a href="chat.html">💬 Chat</a>
          </nav>
          <a class="logout-link" href="../index.html" data-logout-button>↩ Keluar</a>
        </aside>

        <div class="main-panel">
          <section class="panel">
            <div class="top-panel" style="margin-bottom: 20px;">
              <div>
                <span class="eyebrow">Profil saya</span>
                <h2 style="margin-top: 12px; font-size: 2rem;">Data akun</h2>
              </div>
            </div>

            <form class="form-panel" data-profile-form>
              <div class="field">
                <label>Foto profil</label>
                <div class="profile-photo-picker" data-profile-photo-preview>
                  <div class="profile-photo-preview-image">
                    <img src="" alt="Preview foto profil" hidden />
                  </div>

                  <div class="profile-photo-picker-body">
                    <button class="btn btn-secondary" type="button" data-profile-select-button>Pilih foto</button>
                    <input type="file" name="profilePhoto" accept="image/jpeg,image/png,image/webp" />
                    <small class="muted" data-profile-file-name></small>
                    <small class="muted">Format: JPG, PNG, atau WebP. Ukuran maksimal 2 MB.</small>
                  </div>
                </div>
              </div>

              <div class="form-row">
                <div class="field">
                  <label for="fullName">Nama lengkap</label>
                  <input id="fullName" name="fullName" type="text" placeholder="Masukkan nama lengkap" />
                </div>
                <div class="field">
                  <label for="username">Username</label>
                  <input id="username" name="username" type="text" placeholder="Masukkan username" />
                </div>
              </div>

              <div class="form-row">
                <div class="field">
                  <label for="email">Email</label>
                  <input id="email" name="email" type="email" placeholder="nama@email.com" />
                </div>
                <div class="field">
                  <label for="phone">Nomor HP</label>
                  <input id="phone" name="phone" type="tel" placeholder="08xxxxxxxxxx" />
                </div>
              </div>

              <div class="field">
                <label for="bio">Bio</label>
                <textarea id="bio" name="bio" placeholder="Ceritakan sedikit tentang diri Anda"></textarea>
              </div>

              <div class="field">
                <label for="alamat">Alamat</label>
                <input id="alamat" name="alamat" type="text" placeholder="Masukkan alamat" />
              </div>

              <div class="field">
                <div style="display:flex; gap: 10px; align-items:center; flex-wrap: wrap; margin-bottom: 12px;">
                  <button class="btn btn-secondary" type="button" data-use-location>Gunakan lokasi saya</button>
                  <small class="muted" data-location-status>Belum dipakai</small>
                </div>

                <div class="map-preview" data-location-map-preview>
                  <div class="map-placeholder">📍</div>
                </div>

                <input type="hidden" name="latitude" value="" />
                <input type="hidden" name="longitude" value="" />
              </div>

              <button class="btn btn-primary" type="submit" style="width:auto;">Simpan perubahan</button>
            </form>
          </section>
        </div>
      </div>
    </main>
    <script type="module" src="../assets/app.js"></script>
  </body>
</html>
