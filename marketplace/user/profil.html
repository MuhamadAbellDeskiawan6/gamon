<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profil — Barang Kenangan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../assets/style.css" />
  </head>
  <body data-page="profil.html">
    <header class="topbar">
      <div class="container nav">
        <a href="../index.html" class="brand" aria-label="Home">
          <span class="brand-mark">G</span>
          <span>Barang Kenangan</span>
        </a>
        <div class="nav-actions">
          <a class="btn btn-secondary" href="profil.html">Profil</a>
          <a class="btn btn-primary" href="../index.html" data-logout-button>Keluar</a>
        </div>
      </div>
    </header>

    <main class="container user-layout">
      <div class="user-shell">
        <aside class="sidebar">
          <div class="profile-box">
            <div class="avatar-lg">A</div>
            <div>
              <strong style="display:block; color: var(--primary-strong);">Annisa</strong>
              <small class="muted">Seller & Buyer</small>
            </div>
          </div>

          <nav aria-label="Sidebar navigasi">
            <a href="dashboard.html">📊 Dashboard</a>
            <a href="jual.html">📦 Jual</a>
            <a href="beli.html">🛒 Beli</a>
            <a href="my-products.html">📋 Barang Saya</a>
            <a class="active" href="profil.html">👤 Profil</a>
            <a href="chat.html">💬 Chat</a>
          </nav>
        </aside>

        <div class="main-panel">
          <section class="panel">
            <div class="top-panel" style="margin-bottom: 20px;">
              <div>
                <span class="eyebrow">Profil saya</span>
                <h2 style="margin-top: 12px; font-size: 2rem;">Data akun</h2>
              </div>
            </div>

            <form class="form-panel" data-profile-form>
              <div class="form-row">
                <div class="field">
                  <label for="fullName">Nama lengkap</label>
                  <input id="fullName" name="fullName" type="text" value="Annisa Rahma" />
                </div>
                <div class="field">
                  <label for="username">Username</label>
                  <input id="username" name="username" type="text" value="annisarahma" />
                </div>
              </div>

              <div class="form-row">
                <div class="field">
                  <label for="email">Email</label>
                  <input id="email" name="email" type="email" value="annisa@email.com" />
                </div>
                <div class="field">
                  <label for="phone">Nomor HP</label>
                  <input id="phone" name="phone" type="tel" value="081234567890" />
                </div>
              </div>

              <div class="field">
                <label for="bio">Bio</label>
                <textarea id="bio" name="bio">Saya suka barang dengan cerita, tapi lebih suka melihat barang baru punya rumah yang lebih layak.</textarea>
              </div>

              <div class="field">
                <label for="alamat">Alamat</label>
                <input id="alamat" name="alamat" type="text" value="Jakarta Selatan" />
              </div>

              <button class="btn btn-primary" type="submit" style="width:auto;">Simpan perubahan</button>
            </form>
          </section>
        </div>
      </div>
    </main>
    <script type="module" src="../assets/app.js"></script>
  </body>
</html>
