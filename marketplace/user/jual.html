<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jual Barang — Barang Kenangan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../assets/style.css" />
  </head>
  <body data-page="jual.html">
    <header class="topbar">
      <div class="container nav">
        <a href="../index.html" class="brand" aria-label="Home">
          <span class="brand-mark">G</span>
          <span>Barang Kenangan</span>
        </a>
        <div class="nav-actions">
          <a class="btn btn-secondary" href="profil.html">Profil</a>
          <a class="btn btn-primary" href="../index.html" data-logout-button>Keluar</a>
        </div>
      </div>
    </header>

    <main class="container user-layout">
      <div class="user-shell">
        <aside class="sidebar">
          <div class="profile-box">
            <div class="avatar-lg">A</div>
            <div>
              <strong style="display:block; color: var(--primary-strong);">Annisa</strong>
              <small class="muted">Seller & Buyer</small>
            </div>
          </div>

          <nav aria-label="Sidebar navigasi">
            <a href="dashboard.html">📊 Dashboard</a>
            <a class="active" href="jual.html">📦 Jual</a>
            <a href="beli.html">🛒 Beli</a>
            <a href="my-products.html">📋 Barang Saya</a>
            <a href="profil.html">👤 Profil</a>
            <a href="chat.html">💬 Chat</a>
          </nav>
        </aside>

        <div class="main-panel">
          <section class="panel">
            <div class="top-panel" style="margin-bottom: 20px;">
              <div>
                <span class="eyebrow">Jual barang</span>
                <h2 style="margin-top: 12px; font-size: 2rem;">Pasang iklan baru</h2>
              </div>
              <a class="btn btn-primary" href="my-products.html">Lihat daftar saya</a>
            </div>

            <form class="form-panel" data-sell-form>
              <div class="form-row">
                <div class="field">
                  <label for="namaBarang">Nama barang / judul kenangan</label>
                  <input id="namaBarang" name="name" type="text" placeholder="Contoh: Jam tangan saat kita pacaran" required />
                </div>
                <div class="field">
                  <label for="kategori">Kategori</label>
                  <select id="kategori" name="category">
                    <option value="pakaian">Pakaian</option>
                    <option value="aksesori">Aksesori</option>
                    <option value="barang">Barang Lain</option>
                  </select>
                </div>
              </div>

              <div class="form-row">
                <div class="field">
                  <label for="storyType">Jenis postingan</label>
                  <select id="storyType" name="storyType">
                    <option value="barang-kenangan">Barang kenangan</option>
                    <option value="cerita-hubungan">Cerita hubungan</option>
                    <option value="momen-masa-lalu">Momen masa lalu</option>
                  </select>
                </div>
                <div class="field">
                  <label for="harga">Harga</label>
                  <input id="harga" name="price" type="text" placeholder="Rp 250.000" required />
                </div>
              </div>

              <div class="form-row">
                <div class="field">
                  <label for="kondisi">Kondisi</label>
                  <select id="kondisi" name="condition">
                    <option value="Baru">Baru</option>
                    <option value="Layak pakai">Layak pakai</option>
                    <option value="Bekas terawat">Bekas terawat</option>
                  </select>
                </div>
                <div class="field">
                  <label for="storyNote">Cerita singkat</label>
                  <input id="storyNote" name="storyNote" type="text" placeholder="Contoh: Baju ini dipakai saat kita pertama kali outing" />
                </div>
              </div>

              <div class="field">
                <label for="deskripsi">Deskripsi</label>
                <textarea id="deskripsi" name="description" placeholder="Ceritakan kondisi barang, kenangan yang terkait, dan alasan menjualnya dengan bahasa yang natural." required></textarea>
              </div>

              <div class="field">
                <label>Foto barang</label>
                <div class="image-upload-shell">
                  <div class="upload-dropzone" data-upload-dropzone>
                    <input id="foto" name="photo" type="file" accept="image/png,image/jpeg,image/webp" multiple hidden />
                    <div class="upload-inner">
                      <div class="upload-icon">⇪</div>
                      <button class="btn btn-primary btn-upload" type="button" data-browse-files>Browse</button>
                      <div class="upload-hint">drop a file here</div>
                      <small class="muted">*File supported .png, .jpg, .webp</small>
                    </div>
                  </div>
                  <div class="uploaded-files" data-uploaded-files>
                    <div class="uploaded-files-title">Uploaded files</div>
                    <div class="uploaded-file-list" data-uploaded-file-list></div>
                  </div>
                </div>
              </div>

              <div class="field">
                <label for="lokasi">Alamat lengkap</label>
                <input id="lokasi" name="location" type="text" placeholder="Jl. Melati No. 12, Jakarta Selatan" required />
              </div>

              <div class="field">
                <div style="display:flex; gap: 10px; align-items:center; flex-wrap: wrap; margin-bottom: 12px;">
                  <button class="btn btn-secondary" type="button" data-use-location>Gunakan lokasi saya</button>
                  <small class="muted" data-location-status>Belum dipakai</small>
                </div>

                <div class="map-preview" data-location-map-preview>
                  <div class="map-placeholder">📍</div>
                </div>

                <input type="hidden" name="latitude" value="" />
                <input type="hidden" name="longitude" value="" />
              </div>

              <button class="btn btn-primary" type="submit" style="margin-top: 10px; width: auto;">Publish iklan</button>
            </form>
          </section>
        </div>
      </div>
    </main>
    <script type="module" src="../assets/app.js"></script>
  </body>
</html>
