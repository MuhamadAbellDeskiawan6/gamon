<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Produk Marketplace - Admin</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <style>
    .material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">
  <div class="min-h-screen lg:grid lg:grid-cols-[260px_minmax(0,1fr)]">
    <div data-admin-sidebar></div>
    <script src="/admin/partials/sidebar.js"></script>

    <main class="px-4 py-8 lg:px-8">
      <div class="mb-6 flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
        <div>
          <h2 class="text-2xl font-bold text-slate-900">Produk Marketplace</h2>
          <p class="mt-1 text-sm text-slate-500">Kelola katalog, stok, dan status jual produk (aktif / nonaktif).</p>
        </div>
        <div class="flex flex-wrap items-center gap-2">
          <button id="repairLegacyProductsBtn" type="button" class="inline-flex items-center justify-center rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm font-semibold text-slate-700 shadow-sm hover:bg-slate-50 disabled:opacity-60">Rapikan data produk lama</button>
          <a href="/admin/marketplace-product-form.html" class="inline-flex items-center justify-center rounded-xl bg-pink-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-pink-500">+ Tambah Produk</a>
        </div>
      </div>

      <p id="pageStatus" class="mb-4 text-sm text-rose-700" role="status" aria-live="polite"></p>

      <div class="mb-6 grid gap-4 sm:grid-cols-2 lg:grid-cols-5">
        <div class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
          <p class="text-[11px] font-semibold uppercase tracking-wide text-slate-400">Total Produk</p>
          <p id="totalProducts" class="mt-2 text-3xl font-bold text-slate-900">0</p>
        </div>
        <div class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
          <p class="text-[11px] font-semibold uppercase tracking-wide text-slate-400">Sedang dijual</p>
          <p id="availableProducts" class="mt-2 text-3xl font-bold text-emerald-600">0</p>
        </div>
        <div class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
          <p class="text-[11px] font-semibold uppercase tracking-wide text-slate-400">Nonaktif</p>
          <p id="inactiveProducts" class="mt-2 text-3xl font-bold text-slate-500">0</p>
        </div>
        <div class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
          <p class="text-[11px] font-semibold uppercase tracking-wide text-slate-400">Stok menipis</p>
          <p id="lowProducts" class="mt-2 text-3xl font-bold text-amber-600">0</p>
        </div>
        <div class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
          <p class="text-[11px] font-semibold uppercase tracking-wide text-slate-400">Total unit terjual</p>
          <p id="soldProducts" class="mt-2 text-3xl font-bold text-rose-600">0</p>
        </div>
      </div>

      <div class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
        <div class="mb-4 flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
          <input id="searchInput" type="search" placeholder="Cari nama produk..." class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-pink-200 md:max-w-xs" />
          <select id="statusFilter" class="rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-pink-200">
            <option value="all">Semua status</option>
            <option value="Tersedia">Tersedia (aktif, stok &gt; 2)</option>
            <option value="Menipis">Stok menipis (aktif, 1–2)</option>
            <option value="Habis">Stok habis (aktif)</option>
            <option value="Nonaktif">Nonaktif (disembunyikan)</option>
          </select>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full min-w-[1000px] text-left text-sm text-slate-700">
            <thead>
              <tr class="border-b border-slate-200 bg-slate-50 text-[11px] font-semibold uppercase tracking-wider text-slate-500">
                <th class="px-3 py-3">Produk</th>
                <th class="px-3 py-3">Kategori</th>
                <th class="px-3 py-3">Harga</th>
                <th class="px-3 py-3">Stok</th>
                <th class="px-3 py-3">Terjual</th>
                <th class="px-3 py-3">Dijual</th>
                <th class="px-3 py-3">Status</th>
                <th class="px-3 py-3">Tanggal</th>
                <th class="px-3 py-3 text-right">Aksi</th>
              </tr>
            </thead>
            <tbody id="productsTableBody"><tr><td colspan="9" class="py-8 text-center text-slate-400">Memuat produk...</td></tr></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import { db, escapeHtml, formatRupiah, formatDate, requireAdmin, deleteMarketplaceProduct } from '/admin/admin-firebase.js';
    import { onSnapshot, collection, doc, updateDoc } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

    const searchInput = document.getElementById('searchInput');
    const statusFilter = document.getElementById('statusFilter');
    const body = document.getElementById('productsTableBody');
    const pageStatus = document.getElementById('pageStatus');
    let productsCache = [];

    function getCreatedAtMs(value) {
      if (value === null || value === undefined || value === '') return 0;
      if (typeof value === 'number' && Number.isFinite(value)) return value;
      if (typeof value === 'string') {
        const numeric = Number(value);
        if (Number.isFinite(numeric)) return numeric;
        const parsed = Date.parse(value);
        return Number.isFinite(parsed) ? parsed : 0;
      }
      if (typeof value === 'object') {
        if (typeof value.toMillis === 'function') {
          const ms = value.toMillis();
          return Number.isFinite(ms) ? ms : 0;
        }
        if (typeof value.seconds === 'number') {
          return Number(value.seconds) * 1000 + Math.floor((Number(value.nanoseconds || 0) / 1e6));
        }
      }
      return 0;
    }

    function stockOf(item) {
      const value = Number(item.stock);
      return Number.isInteger(value) && value >= 0 ? value : 1;
    }

    // Produk lama tanpa field "active" dianggap aktif.
    function isActive(item) {
      return item.active !== false;
    }

    function stateOf(item) {
      if (!isActive(item)) return 'Nonaktif';
      const stock = stockOf(item);
      if (stock === 0) return 'Habis';
      if (stock <= 2) return 'Menipis';
      return 'Tersedia';
    }

    async function repairLegacyMarketplaceProducts() {
      const repairButton = document.getElementById('repairLegacyProductsBtn');
      if (!repairButton) return;

      repairButton.disabled = true;
      repairButton.textContent = 'Merapikan data...';

      try {
        const response = await fetch('/api/admin/migrate-marketplace-stock', { method: 'POST', credentials: 'same-origin' });
        const result = await response.json();
        if (!response.ok || !result.success) throw new Error(result.message || 'Migrasi stok gagal.');
        alert(`${result.migrated || 0} dari ${result.scanned || 0} produk diperiksa; produk legacy diperbarui.`);
      } catch (error) {
        console.error('Repair produk lama gagal:', error);
        alert('Gagal merapikan data produk lama. Coba lagi.');
      } finally {
        repairButton.disabled = false;
        repairButton.textContent = 'Rapikan data produk lama';
      }
    }

    async function boot() {
      await requireAdmin();
      const q = collection(db, 'marketplace_products');
      onSnapshot(q, (snapshot) => {
        productsCache = snapshot.docs.map((docSnap) => ({ id: docSnap.id, ...docSnap.data() }));
        renderProducts(productsCache);
      }, (error) => {
        console.error('Error fetching marketplace products:', error);
        pageStatus.textContent = `Produk gagal dimuat (${error.code || 'unknown'}).`;
        body.innerHTML = '<tr><td colspan="9" class="py-8 text-center text-rose-600">Gagal memuat produk.</td></tr>';
      });
    }

    async function setProductActive(id, name, nextActive, button) {
      if (!nextActive && !confirm(`Nonaktifkan "${name}"?\n\nProduk akan disembunyikan dari katalog dan tidak bisa dibeli, tapi datanya tetap tersimpan. Bisa diaktifkan lagi kapan saja.`)) return;
      button.disabled = true;
      try {
        await updateDoc(doc(db, 'marketplace_products', id), { active: nextActive, updatedAt: Date.now() });
        pageStatus.textContent = '';
        // Tampilan diperbarui otomatis oleh onSnapshot.
      } catch (error) {
        console.error('Ubah status jual gagal:', error);
        pageStatus.textContent = `Status produk gagal diubah (${error.code || 'unknown'}).`;
        button.disabled = false;
      }
    }

    function renderProducts(products) {
      const sorted = [...products].sort((a, b) => getCreatedAtMs(b.createdAt) - getCreatedAtMs(a.createdAt));
      const total = sorted.length;
      const inactive = sorted.filter((item) => !isActive(item)).length;
      const selling = sorted.filter((item) => isActive(item) && stockOf(item) > 0).length;
      const low = sorted.filter((item) => isActive(item) && stockOf(item) > 0 && stockOf(item) <= 2).length;
      const sold = sorted.reduce((totalSold, item) => totalSold + Math.max(0, Number(item.sold || 0)), 0);
      document.getElementById('totalProducts').textContent = total;
      document.getElementById('availableProducts').textContent = selling;
      document.getElementById('inactiveProducts').textContent = inactive;
      document.getElementById('lowProducts').textContent = low;
      document.getElementById('soldProducts').textContent = sold;

      const search = (searchInput.value || '').trim().toLowerCase();
      const filter = statusFilter.value || 'all';
      const filtered = sorted.filter((item) => {
        const matchesSearch = !search || String(item.name || '').toLowerCase().includes(search);
        const matchesStatus = filter === 'all' || stateOf(item) === filter;
        return matchesSearch && matchesStatus;
      });

      if (!filtered.length) {
        body.innerHTML = `<tr><td colspan="9" class="py-8 text-center text-slate-400">${total ? 'Tidak ada produk yang sesuai filter.' : 'Belum ada produk. Klik "+ Tambah Produk" untuk memulai.'}</td></tr>`;
        return;
      }

      body.innerHTML = filtered.map((item) => {
        const stock = stockOf(item);
        const active = isActive(item);
        const soldCount = Math.max(0, Number(item.sold || 0));
        let badgeClass;
        let statusLabel;
        if (!active) {
          badgeClass = 'bg-slate-200 text-slate-600';
          statusLabel = 'Nonaktif';
        } else if (stock === 0) {
          badgeClass = 'bg-rose-100 text-rose-700';
          statusLabel = 'Habis';
        } else if (stock <= 2) {
          badgeClass = 'bg-amber-100 text-amber-700';
          statusLabel = 'Stok menipis';
        } else {
          badgeClass = 'bg-emerald-100 text-emerald-700';
          statusLabel = 'Tersedia';
        }
        const img = item.imageUrl || item.image || 'https://placehold.co/600x400/f8fafc/64748b?text=G';
        return `
          <tr class="border-b border-slate-100 align-middle ${active ? '' : 'bg-slate-50'}">
            <td class="px-3 py-3">
              <div class="flex items-center gap-3 ${active ? '' : 'opacity-60'}">
                <img src="${escapeHtml(img)}" alt="${escapeHtml(item.name || 'Produk')}" class="h-12 w-12 rounded-xl object-cover border border-slate-200" />
                <div>
                  <div class="font-semibold text-slate-900">${escapeHtml(item.name || '-')}</div>
                  <div class="text-[11px] text-slate-500">${escapeHtml(item.city || item.address || 'Lokasi belum diisi')}</div>
                </div>
              </div>
            </td>
            <td class="px-3 py-3">${escapeHtml(item.category || '-')}</td>
            <td class="px-3 py-3 font-semibold text-slate-900">${formatRupiah(item.price || 0)}</td>
            <td class="px-3 py-3 font-semibold">${stock}</td>
            <td class="px-3 py-3">${soldCount}</td>
            <td class="px-3 py-3">
              <button type="button" role="switch" aria-checked="${active}" aria-label="${active ? 'Nonaktifkan' : 'Aktifkan'} ${escapeHtml(item.name || 'produk')}"
                title="${active ? 'Klik untuk menonaktifkan' : 'Klik untuk mengaktifkan'}"
                data-toggle-id="${escapeHtml(item.id)}" data-toggle-name="${escapeHtml(item.name || 'produk ini')}" data-toggle-next="${active ? 'false' : 'true'}"
                class="relative inline-flex h-6 w-11 shrink-0 items-center rounded-full transition-colors focus:outline-none focus:ring-2 focus:ring-pink-300 disabled:opacity-50 ${active ? 'bg-emerald-500' : 'bg-slate-300'}">
                <span class="inline-block h-5 w-5 rounded-full bg-white shadow transition-transform ${active ? 'translate-x-5' : 'translate-x-0.5'}"></span>
              </button>
            </td>
            <td class="px-3 py-3"><span class="inline-flex rounded-full px-2.5 py-1 text-[11px] font-semibold ${badgeClass}">${statusLabel}</span></td>
            <td class="px-3 py-3">${formatDate(item.createdAt)}</td>
            <td class="px-3 py-3">
              <div class="flex justify-end gap-2">
                <a href="/admin/marketplace-product-form.html?id=${encodeURIComponent(item.id)}" class="rounded-lg border border-slate-200 bg-white px-2.5 py-1.5 text-xs font-medium text-slate-700 hover:bg-slate-50">Edit</a>
                <button type="button" data-delete-id="${escapeHtml(item.id)}" data-delete-name="${escapeHtml(item.name || 'produk ini')}" class="rounded-lg border border-rose-200 bg-rose-50 px-2.5 py-1.5 text-xs font-medium text-rose-600 hover:bg-rose-100">Hapus</button>
              </div>
            </td>
          </tr>
        `;
      }).join('');

      body.querySelectorAll('[data-toggle-id]').forEach((button) => {
        button.addEventListener('click', () => {
          setProductActive(button.dataset.toggleId, button.dataset.toggleName, button.dataset.toggleNext === 'true', button);
        });
      });

      body.querySelectorAll('[data-delete-id]').forEach((button) => {
        button.addEventListener('click', async () => {
          const id = button.dataset.deleteId;
          const name = button.dataset.deleteName;
          if (!confirm(`Hapus "${name}"? Tindakan ini tidak bisa dibatalkan.\n\nTips: kalau hanya ingin menyembunyikan sementara, pakai switch "Dijual" saja.`)) return;
          button.disabled = true;
          try {
            await deleteMarketplaceProduct(id);
            pageStatus.textContent = '';
          } catch (error) {
            console.error('Hapus produk gagal:', error);
            button.disabled = false;
            pageStatus.textContent = `Produk gagal dihapus (${error.code || 'unknown'}).`;
          }
        });
      });
    }

    searchInput.addEventListener('input', () => renderProducts(productsCache));
    statusFilter.addEventListener('change', () => renderProducts(productsCache));
    document.getElementById('repairLegacyProductsBtn')?.addEventListener('click', repairLegacyMarketplaceProducts);

    boot();
  </script>
</body>
</html>
