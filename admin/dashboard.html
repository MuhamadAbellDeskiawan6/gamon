<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Gamon Booth</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

    <nav class="bg-white shadow-sm border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-pink-600 flex items-center gap-2">
                <span>📸</span> Gamon Admin Panel
            </h1>
            <button onclick="handleLogout()" class="text-sm font-medium text-red-500 hover:text-red-700 transition cursor-pointer">
                Keluar Sesi
            </button>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 py-8">
        <div class="flex justify-between items-center mb-6">
            <div>
                <h2 class="text-2xl font-bold">Daftar Antrean Cetak & Merchandise</h2>
                <p class="text-slate-500 text-sm">Kelola data pemesanan photobox dan status pengiriman gantungan kunci fisik.</p>
            </div>
            <button onclick="loadOrders()" class="bg-slate-800 text-white text-sm font-medium px-4 py-2 rounded-lg hover:bg-slate-700 transition cursor-pointer">
                Refresh Data
            </button>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 border-b border-slate-200 text-slate-600 text-xs font-semibold uppercase tracking-wider">
                            <th class="px-6 py-4">ID Pesanan / Waktu</th>
                            <th class="px-6 py-4">Identitas & Kontak</th>
                            <th class="px-6 py-4">Alamat Pengiriman</th>
                            <th class="px-6 py-4">Pratinjau Polaroid</th>
                            <th class="px-6 py-4">Aksi / Cetak</th>
                        </tr>
                    </thead>
                    <tbody id="orderTableBody" class="divide-y divide-slate-100 text-sm text-slate-700">
                        <tr>
                            <td colspan="5" class="text-center py-8 text-slate-400">Sedang memuat data antrean rahasia...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        window.addEventListener('DOMContentLoaded', loadOrders);

        async function loadOrders() {
            const tbody = document.getElementById('orderTableBody');
            
            try {
                const response = await fetch('/api/admin/get-orders');
                const result = await response.json();

                if (response.status === 401 || response.status === 403) {
                    alert("Sesi tidak valid! Dikembalikan ke halaman login.");
                    window.location.href = '/admin/login.html';
                    return;
                }

                if (!result.success || !result.data || result.data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" class="text-center py-8 text-slate-400">Tidak ada antrean pesanan valid saat ini.</td></tr>`;
                    return;
                }

                tbody.innerHTML = '';
                result.data.forEach(order => {
                    const date = order.timestamp ? new Date(order.timestamp).toLocaleString('id-ID') : '-';
                    const currentStatus = order.statusMerchandise || 'PENDING_PRODUCTION';
                    const safeWhatsapp = order.whatsapp ? order.whatsapp.replace(/[^0-9]/g, '') : '';
                    
                    // Membuat objek string yang aman dikirim ke parameter onclick function cetak
                    const stringifiedOrder = JSON.stringify(order).replace(/"/g, '&quot;');

                    tbody.innerHTML += `
                        <tr class="hover:bg-slate-50 transition">
                            <td class="px-6 py-4">
                                <span class="font-mono text-xs block font-bold text-slate-500">${order.orderId || order.id}</span>
                                <span class="text-xs text-slate-400">${date}</span>
                            </td>
                            <td class="px-6 py-4">
                                <div class="font-semibold text-slate-900">${order.nama || 'Anonim'} → ${order.tujuan || 'Seseorang'}</div>
                                <div class="text-xs text-slate-500">📧 ${order.email || '-'}</div>
                                ${order.whatsapp ? `
                                    <div class="text-xs text-green-600 font-medium mt-0.5">
                                        <a href="https://wa.me/${safeWhatsapp}" target="_blank" class="hover:underline">🟢 WA: ${order.whatsapp}</a>
                                    </div>
                                ` : ''}
                            </td>
                            <td class="px-6 py-4 max-w-xs">
                                <p class="text-xs line-clamp-2" title="${order.alamat || '-'}">${order.alamat || 'Tidak ada alamat'}</p>
                                ${order.koordinat ? `<a href="https://maps.google.com/?q=${order.koordinat}" target="_blank" class="text-[11px] text-pink-500 font-bold hover:underline block mt-1">📍 Lihat Maps</a>` : ''}
                            </td>
                            <td class="px-6 py-4">
                                ${order.photoBase64 ? `
                                    <button onclick="openImage('${order.photoBase64}')" class="group relative block focus:outline-none">
                                        <img src="${order.photoBase64}" class="h-14 w-10 object-cover rounded shadow-sm border border-slate-200 group-hover:scale-105 transition">
                                        <span class="absolute bottom-0 left-0 right-0 bg-black/60 text-[9px] text-white py-0.5 text-center hidden group-hover:block rounded-b">Buka</span>
                                    </button>
                                ` : '<span class="text-xs text-slate-400">Tidak ada foto</span>'}
                            </td>
                            <td class="px-6 py-4">
                                <div class="flex items-center gap-2">
                                    <select onchange="updateStatus('${order.id}', this.value)" 
                                        class="px-2 py-1 text-xs font-semibold rounded-lg bg-slate-100 border border-slate-300 text-slate-700 focus:outline-none focus:border-pink-500 cursor-pointer">
                                        <option value="PENDING_PRODUCTION" ${currentStatus === 'PENDING_PRODUCTION' ? 'selected' : ''}>⏳ Pending</option>
                                        <option value="DIPROSES" ${currentStatus === 'DIPROSES' ? 'selected' : ''}>🛠️ Diproses</option>
                                        <option value="DIKIRIM" ${currentStatus === 'DIKIRIM' ? 'selected' : ''}>📦 Dikirim</option>
                                        <option value="SELESAI" ${currentStatus === 'SELESAI' ? 'selected' : ''}>✅ Selesai</option>
                                    </select>
                                    <button onclick="cetakResi(${stringifiedOrder})" 
                                        class="px-2 py-1 text-xs font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-lg transition cursor-pointer">
                                        🖨️ Resi
                                    </button>
                                </div>
                            </td>
                        </tr>
                    `;
                });

            } catch (err) {
                console.error(err);
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-8 text-red-500">Gagal mengambil data dari server.</td></tr>`;
            }
        }

        async function updateStatus(orderId, statusBaru) {
            try {
                const response = await fetch('/api/admin/update-status', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ orderId, statusBaru })
                });

                if (!response.ok) {
                    const result = await response.json();
                    alert("Gagal mengubah status: " + result.message);
                    loadOrders();
                }
            } catch (error) {
                console.error(error);
                alert("Terjadi kesalahan koneksi.");
                loadOrders();
            }
        }

        function cetakResi(order) {
            const printWindow = window.open('', '_blank');
            const htmlContent = `
                <!DOCTYPE html>
                <html>
                <head>
                    <title>Cetak Resi - ${order.orderId || order.id}</title>
                    <style>
                        @page { size: A6; margin: 5mm; }
                        body { font-family: Arial, sans-serif; margin: 0; padding: 10px; font-size: 12px; }
                        .resi-card { border: 2px dashed #000; padding: 15px; border-radius: 8px; }
                        .header { text-align: center; border-bottom: 2px solid #000; padding-bottom: 5px; margin-bottom: 10px; }
                        .header h2 { margin: 0; font-size: 16px; }
                        .section { margin-bottom: 8px; }
                        .label { font-weight: bold; font-size: 10px; color: #555; }
                        .value { font-size: 13px; font-weight: bold; margin-top: 2px; }
                        .alamat-box { font-size: 12px; font-weight: normal; border: 1px solid #000; padding: 6px; border-radius: 4px; margin-top: 3px; background: #fff; line-height: 1.4; }
                        .footer { text-align: center; font-size: 9px; margin-top: 15px; border-top: 1px dashed #000; padding-top: 5px; }
                    </style>
                </head>
                <body>
                    <div class="resi-card">
                        <div class="header">
                            <h2>GAMON BOOTH 📸</h2>
                            <span style="font-size: 10px;">ID: ${order.orderId || order.id}</span>
                        </div>
                        <div class="section">
                            <div class="label">PENGIRIM:</div>
                            <div class="value">GAMON BOOTH (Tawing)</div>
                        </div>
                        <div class="section">
                            <div class="label">PENERIMA:</div>
                            <div class="value" style="font-size: 14px;">${order.nama || 'Anonim'}</div>
                            <div class="value">📞 ${order.whatsapp || '-'}</div>
                        </div>
                        <div class="section">
                            <div class="label">ALAMAT TUJUAN:</div>
                            <div class="alamat-box">${order.alamat || 'Tidak ada alamat lengkap'}</div>
                        </div>
                        <div class="section">
                            <div class="label">ISI PAKET:</div>
                            <div class="value" style="font-weight: normal; font-size: 11px;">1x Gantungan Kunci Polaroid Custom</div>
                        </div>
                        <div class="footer">Terima kasih telah berpartisipasi di Gamon Tawing!</div>
                    </div>
                    <script>
                        window.onload = function() { window.print(); }
                    <\/script>
                </body>
                </html>
            `;
            printWindow.document.write(htmlContent);
            printWindow.document.close();
        }

        function openImage(base64) {
            const win = window.open();
            win.document.write(`<iframe src="${base64}" frameborder="0" style="border:0; top:0px; left:0px; bottom:0px; right:0px; width:100%; height:100%;" allowfullscreen></iframe>`);
        }

        function handleLogout() {
            document.cookie = "admin_session=; path=/; expires=Thu, 01 Jan 1970 00:00:00 UTC; SameSite=Strict;";
            window.location.href = '/admin/login.html';
        }
    </script>
</body>
</html>
