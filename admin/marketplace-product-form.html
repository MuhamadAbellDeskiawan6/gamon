<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Form Produk - Admin</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <style>
    .material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">
  <div class="min-h-screen lg:grid lg:grid-cols-[260px_minmax(0,1fr)]">
    <div data-admin-sidebar></div>
    <script src="/admin/partials/sidebar.js"></script>

    <main class="px-4 py-8 lg:px-8">
      <div class="mb-6 flex items-center justify-between">
        <div>
          <h2 id="pageTitle" class="text-2xl font-bold text-slate-900">Tambah Produk</h2>
          <p class="mt-1 text-sm text-slate-500">Tambah atau edit katalog Marketplace Mantan.</p>
        </div>
        <a href="/admin/marketplace-products.html" class="rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50">Kembali</a>
      </div>

      <form id="productForm" class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
        <div class="grid gap-5 md:grid-cols-2">
          <label class="block">
            <span class="mb-1 block text-sm font-medium text-slate-700">Nama produk</span>
            <input name="name" required class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-pink-200" />
          </label>
          <label class="block">
            <span class="mb-1 block text-sm font-medium text-slate-700">Kategori</span>
            <select name="category" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-pink-200">
              <option value="pakaian">Pakaian</option>
              <option value="aksesori">Aksesori</option>
              <option value="barang">Barang Lain</option>
            </select>
          </label>
          <label class="block">
            <span class="mb-1 block text-sm font-medium text-slate-700">Harga</span>
            <input name="price" required class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-pink-200" placeholder="Rp 250.000" />
          </label>
          <label class="block">
            <span class="mb-1 block text-sm font-medium text-slate-700">Kondisi</span>
            <select name="condition" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-pink-200">
              <option value="Baru">Baru</option>
              <option value="Layak pakai">Layak pakai</option>
              <option value="Bekas terawat">Bekas terawat</option>
            </select>
          </label>
          <label class="block">
            <span class="mb-1 block text-sm font-medium text-slate-700">Stok</span>
            <input name="stock" type="number" min="0" step="1" required value="1" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-pink-200" />
            <small class="mt-1 block text-slate-500">Status otomatis: <span data-stock-state>Tersedia</span></small>
          </label>
          <label class="block">
            <span class="mb-1 block text-sm font-medium text-slate-700">Lokasi COD</span>
            <input name="city" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-pink-200" placeholder="Jakarta Selatan" />
          </label>
          <label class="block md:col-span-2">
            <span class="mb-1 block text-sm font-medium text-slate-700">Alamat lengkap</span>
            <input name="address" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-pink-200" placeholder="Jl. ..." />
          </label>
          <label class="block md:col-span-2">
            <span class="mb-1 block text-sm font-medium text-slate-700">Deskripsi</span>
            <textarea name="description" rows="4" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-pink-200" placeholder="Jelaskan kondisi barang..."></textarea>
          </label>
          <label class="block">
            <span class="mb-1 block text-sm font-medium text-slate-700">Tipe cerita</span>
            <select name="storyType" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-pink-200">
              <option value="barang-kenangan">Barang kenangan</option>
              <option value="souvenir">Souvenir</option>
              <option value="vintage">Vintage</option>
            </select>
          </label>
          <label class="block">
            <span class="mb-1 block text-sm font-medium text-slate-700">Catatan cerita</span>
            <input name="storyNote" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-pink-200" placeholder="Opsional" />
          </label>
          <label class="block">
            <span class="mb-1 block text-sm font-medium text-slate-700">Latitude</span>
            <input name="latitude" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-pink-200" />
          </label>
          <label class="block">
            <span class="mb-1 block text-sm font-medium text-slate-700">Longitude</span>
            <input name="longitude" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-pink-200" />
          </label>
          <div class="md:col-span-2">
            <label class="block text-sm font-medium text-slate-700">Foto produk</label>
            <input id="photoInput" type="file" accept="image/png,image/jpeg,image/webp" multiple class="mt-2 block w-full rounded-xl border border-dashed border-slate-300 bg-slate-50 px-3 py-4 text-sm" />
            <div id="previewList" class="mt-3 flex flex-wrap gap-3"></div>
          </div>
        </div>

        <div class="mt-6 flex items-center justify-end gap-3">
          <a href="/admin/marketplace-products.html" class="rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm font-medium text-slate-700 hover:bg-slate-50">Batal</a>
          <button type="submit" class="rounded-xl bg-pink-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-pink-500">Simpan Produk</button>
        </div>
      </form>
    </main>
  </div>

  <script type="module">
    import { auth, db, escapeHtml, fileToDataUrl, prepareImageForUpload, requireAdmin } from '/admin/admin-firebase.js';
    import { addDoc, collection, doc, getDoc, setDoc, updateDoc } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

    const params = new URLSearchParams(window.location.search);
    const productId = params.get('id');
    const form = document.getElementById('productForm');
    const pageTitle = document.getElementById('pageTitle');
    const previewList = document.getElementById('previewList');
    const photoInput = document.getElementById('photoInput');
    const stockInput = form.elements.namedItem('stock');
    const stockState = document.querySelector('[data-stock-state]');
    let existingSold = 0;
    let existingImages = [];

    function refreshStockLabel() {
      const stock = Number(stockInput.value);
      stockState.textContent = Number.isInteger(stock) && stock > 0 ? 'Tersedia' : 'Habis';
    }

    stockInput.addEventListener('input', refreshStockLabel);

    async function boot() {
      await requireAdmin();
      if (productId) {
        pageTitle.textContent = 'Edit Produk';
        const productSnap = await getDoc(doc(db, 'marketplace_products', productId));
        if (productSnap.exists()) {
          const data = productSnap.data();
          existingSold = Number.isInteger(Number(data.sold)) ? Number(data.sold) : 0;
          stockInput.value = Number.isInteger(Number(data.stock)) && Number(data.stock) >= 0 ? Number(data.stock) : 1;
          existingImages = Array.isArray(data.images) ? data.images : (data.imageUrl ? [data.imageUrl] : []);
          refreshStockLabel();
          Object.entries(data).forEach(([key, value]) => {
            if (key === 'stock') return;
            const field = form.elements.namedItem(key);
            if (field && field.name === key) {
              field.value = value;
            }
          });
          if (data.images && data.images.length) {
            renderPreview(data.images);
          }
        }
      }
    }

    function renderPreview(images = []) {
      previewList.innerHTML = images.map((src) => `
        <div class="h-20 w-20 overflow-hidden rounded-xl border border-slate-200 bg-slate-50">
          <img src="${escapeHtml(src)}" alt="Preview produk" class="h-full w-full object-cover" />
        </div>
      `).join('');
    }

    photoInput.addEventListener('change', async () => {
      const files = Array.from(photoInput.files || []).slice(0, 4);
      const images = [];
      for (const file of files) {
        const prepared = await prepareImageForUpload(file);
        images.push(await fileToDataUrl(prepared));
      }
      renderPreview(images);
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const payload = Object.fromEntries(new FormData(form).entries());
      const files = Array.from(photoInput.files || []).slice(0, 4);
      const stock = Number(payload.stock);
      if (!Number.isInteger(stock) || stock < 0) {
        alert('Stok harus berupa bilangan bulat minimal 0.');
        return;
      }
      let images = existingImages;
      for (const file of files) {
        const prepared = await prepareImageForUpload(file);
        const dataUrl = await fileToDataUrl(prepared);
        images.push(dataUrl);
      }

      const normalizedPrice = Number(String(payload.price || '').replace(/[^\d]/g, '')) || 0;
      const productData = {
        name: payload.name,
        category: payload.category,
        price: normalizedPrice,
        condition: payload.condition,
        status: stock > 0 ? 'Tersedia' : 'Habis',
        stock,
        sold: existingSold,
        description: payload.description,
        city: payload.city || payload.address || 'Jakarta',
        address: payload.address || payload.city || 'Jakarta',
        storyType: payload.storyType || 'barang-kenangan',
        storyNote: payload.storyNote || '',
        latitude: payload.latitude || '',
        longitude: payload.longitude || '',
        label: payload.category || 'barang',
        images,
        imageUrl: images[0] || '',
        image: images[0] || '',
        seller: 'Marketplace Mantan',
        sellerInitial: 'M',
        ownerId: 'admin',
        sellerId: 'admin',
        updatedAt: Date.now(),
      };

      if (productId) {
        await updateDoc(doc(db, 'marketplace_products', productId), productData);
      } else {
        await addDoc(collection(db, 'marketplace_products'), { ...productData, createdAt: Date.now() });
      }

      window.location.href = '/admin/marketplace-products.html';
    });

    boot();
  </script>
</body>
</html>
