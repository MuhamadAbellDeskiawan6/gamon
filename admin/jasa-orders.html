<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pesanan Jasa | Gamon Jasa (Beta) - Admin Gamon</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <style>.material-symbols-outlined{font-family:'Material Symbols Outlined';font-variation-settings:'FILL' 0,'wght' 300,'GRAD' 0,'opsz' 24}</style>
</head>
<body class="min-h-screen bg-slate-100 text-slate-800">
  <div class="min-h-screen lg:grid lg:grid-cols-[260px_minmax(0,1fr)]">
    <div data-admin-sidebar></div>
    <script src="/admin/partials/sidebar.js"></script>
    <main class="px-4 py-8 lg:px-8">
      <div class="mb-6 flex flex-wrap items-center justify-between gap-3">
        <div><h1 class="text-2xl font-bold text-slate-900">Pesanan Jasa</h1><p class="mt-1 text-sm text-slate-500">Kelola pembayaran, jadwal, status, dan laporan pengerjaan.</p></div>
        <button id="refreshButton" type="button" class="rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm font-semibold">Muat ulang</button>
      </div>
      <p id="pageStatus" class="mb-4 text-sm text-rose-700" role="status" aria-live="polite"></p>
      <div id="ordersList" class="space-y-4" aria-live="polite"><div class="rounded-2xl bg-white p-6 text-slate-500">Memuat pesanan jasa…</div></div>
    </main>
  </div>
  <script type="module">
    import { escapeHtml, formatRupiah, formatDate, requireAdmin } from '/admin/admin-firebase.js';

    const pageStatus = document.getElementById('pageStatus');
    const ordersList = document.getElementById('ordersList');
    let orders = [];

    async function request(action, method = 'POST', payload = {}) {
      const response = await fetch(`/api/admin/${action}`, {
        method,
        credentials: 'same-origin',
        headers: method === 'POST' ? { 'Content-Type': 'application/json' } : {},
        ...(method === 'POST' ? { body: JSON.stringify(payload) } : {})
      });
      const result = await response.json();
      if (!response.ok || !result.success) throw new Error(result.message || 'Permintaan admin gagal.');
      return result;
    }

    function orderStatusLabel(value) {
      return ({
        awaiting_quote: 'Menunggu penawaran',
        awaiting_payment: 'Menunggu pembayaran',
        awaiting_confirmation: 'Menunggu konfirmasi tunai',
        paid: 'Sudah dibayar',
        scheduled: 'Terjadwal',
        in_progress: 'Sedang berlangsung',
        completed: 'Selesai',
        cancelled: 'Dibatalkan',
        expired: 'Kedaluwarsa'
      })[value] || value || '-';
    }

    function paymentStatusLabel(value) {
      return ({
        UNPAID: 'Belum dibayar',
        PARTIAL: 'DP lunas · menunggu pelunasan',
        PAID: 'Lunas',
        CASH_PENDING: 'Menunggu pembayaran tunai',
        CANCELLED: 'Dibatalkan',
        EXPIRED: 'Kedaluwarsa'
      })[value] || value || 'Belum dibayar';
    }

    function render() {
      if (!orders.length) {
        ordersList.innerHTML = '<div class="rounded-2xl border border-slate-200 bg-white p-8 text-center text-slate-500">Belum ada pesanan jasa.</div>';
        return;
      }
      ordersList.innerHTML = orders.map((order) => {
        const fields = Object.entries(order.formData || {}).map(([key, value]) => `<li><strong>${escapeHtml(order.formFieldLabels?.[key] || key)}:</strong> ${escapeHtml(value)}</li>`).join('');
        const scheduleMode = ['none', 'date', 'datetime', 'recurring'].includes(order.scheduleMode) ? order.scheduleMode : 'recurring';
        const schedule = scheduleMode === 'none' ? '' : `<p class="text-sm text-slate-600">${escapeHtml(order.scheduleLabel || 'Jadwal pilihan')}: ${escapeHtml(order.schedule?.date || '-')} ${order.schedule?.time ? `pukul ${escapeHtml(order.schedule.time)}` : ''}</p>${scheduleMode === 'recurring' ? `<p class="text-sm text-slate-600">${order.schedule?.recurring ? 'Rutin: ' + escapeHtml((order.schedule.days || []).join(', ')) : 'Tidak rutin'}</p>` : ''}`;
        const parentDetails = order.parent ? `<section><h3 class="font-semibold">Data penerima</h3><p class="text-sm">${escapeHtml(order.parent.name || '-')} · ${escapeHtml(order.parent.city || '')}</p><p class="text-sm">${escapeHtml(order.parent.address || '-')}</p><p class="text-sm">Kontak di lokasi: ${escapeHtml(order.parent.emergencyContactName || '-')} · ${escapeHtml(order.parent.emergencyContactPhone || '-')}</p>${order.parent.notes ? `<p class="text-sm">Catatan tambahan: ${escapeHtml(order.parent.notes)}</p>` : ''}</section>` : '';
        const options = (order.selectedOptions || []).map((value) => escapeHtml(value)).join(', ') || '-';
        const visits = [...(order.visits || [])].sort((a, b) => Number(b.at || 0) - Number(a.at || 0)).map((visit) => `<article class="mt-2 rounded-xl bg-slate-50 p-3"><strong>${escapeHtml(visit.note || 'Laporan pengerjaan')}</strong><p class="text-xs text-slate-500">${escapeHtml(formatDate(visit.at))} · ${escapeHtml(visit.staffName || visit.by || '-')}</p><p class="mt-2 whitespace-pre-wrap text-sm">${escapeHtml(visit.reportText || '')}</p></article>`).join('') || '<p class="mt-2 text-sm text-slate-500">Belum ada laporan pengerjaan.</p>';
        const transitionOptions = ['awaiting_quote', 'awaiting_payment'].includes(order.status) ? '<option value="cancelled">Batalkan</option>' : order.status === 'awaiting_confirmation' ? '<option value="scheduled">Konfirmasi (tunai)</option><option value="cancelled">Batalkan</option>' : order.status === 'paid' ? '<option value="scheduled">Terjadwal</option><option value="cancelled">Batalkan</option>' : order.status === 'scheduled' ? '<option value="in_progress">Sedang berlangsung</option><option value="cancelled">Batalkan</option>' : order.status === 'in_progress' ? '<option value="completed">Selesai</option><option value="cancelled">Batalkan</option>' : '';
        const payments = Array.isArray(order.payments) ? order.payments : [];
        const paidAmount = Number.isSafeInteger(order.paidAmount) ? order.paidAmount : (order.paymentStatus === 'PAID' ? Number(order.totalAmount || 0) : 0);
        const remainingAmount = Number.isSafeInteger(order.remainingAmount) ? order.remainingAmount : Math.max(0, Number(order.totalAmount || 0) - paidAmount);
        const paymentHistory = payments.map((payment) => `<li>${escapeHtml(({ full: 'Full', dp: 'DP', balance: 'Pelunasan', cash: 'Tunai' })[payment.kind] || 'Pembayaran')} · ${formatRupiah(payment.amount)} · ${escapeHtml(payment.method === 'CASH' ? 'Tunai' : payment.method === 'DOKU' ? 'DOKU' : '-')} · ${escapeHtml(paymentStatusLabel(payment.status || 'UNPAID'))}</li>`).join('');
        const canSettleCash = remainingAmount > 0 && order.paymentPlan === 'cash' && !['cancelled', 'expired', 'completed'].includes(order.status);
        const canSettleBalance = remainingAmount > 0 && order.paymentPlan === 'dp' && !['awaiting_quote', 'awaiting_payment', 'awaiting_confirmation', 'cancelled', 'expired', 'completed'].includes(order.status);
        return `<article class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
          <header class="flex flex-col gap-2 border-b border-slate-100 pb-4 sm:flex-row sm:items-start sm:justify-between">
            <div><p class="text-xs font-semibold uppercase tracking-wide text-pink-600">${escapeHtml(order.id)}</p><h2 class="mt-1 text-lg font-bold">${escapeHtml(order.serviceName || 'Jasa')}</h2><p class="text-sm text-slate-500">${escapeHtml(order.buyerName || '-')} · ${escapeHtml(order.buyerEmail || '-')} · ${escapeHtml(order.buyerPhone || '-')}</p></div>
            <div class="text-left sm:text-right"><span class="rounded-full bg-slate-100 px-3 py-1 text-xs font-semibold">${escapeHtml(orderStatusLabel(order.status))}</span><span class="ml-1 rounded-full bg-pink-50 px-3 py-1 text-xs font-semibold text-pink-700">${escapeHtml(({ full: 'Full', dp: 'DP', cash: 'Tunai' })[order.paymentPlan || 'full'])}</span>${order.subscription ? `<p class="mt-1 text-xs font-semibold text-violet-700">Langganan • siklus ${Number(order.subscription.cycle || 1)}</p>` : ''}<p class="mt-2 font-semibold">${order.totalAmount ? formatRupiah(order.totalAmount) : (order.status === 'awaiting_quote' ? 'Belum ada penawaran' : '-')}</p><p class="text-xs text-slate-500">Dibayar ${formatRupiah(paidAmount)} · Sisa ${formatRupiah(remainingAmount)}</p></div>
          </header>
          ${order.needsAttention ? `<p class="mt-3 rounded-xl border border-rose-200 bg-rose-50 p-3 text-sm text-rose-800" role="alert">Perlu pemeriksaan admin: ${escapeHtml(order.attentionReason || 'Periksa nominal atau status pembayaran.')}</p>` : ''}
          <div class="grid gap-4 py-4 md:grid-cols-2">
            <section><h3 class="font-semibold">Paket dan jadwal</h3><p class="text-sm">${escapeHtml(order.package?.name || '-')} · ${escapeHtml(order.package?.duration || '')}</p>${schedule}<p class="text-sm text-slate-600">Opsi: ${options}</p></section>
            <section><h3 class="font-semibold">Data formulir</h3><ul class="text-sm">${fields || '<li>-</li>'}</ul><p class="mt-1 text-xs text-slate-500">Pembayaran: ${escapeHtml(paymentStatusLabel(order.paymentStatus || 'UNPAID'))}</p>${paymentHistory ? `<ul class="mt-2 text-xs text-slate-600">${paymentHistory}</ul>` : ''}</section>
            ${parentDetails}
          </div>
          ${order.status === 'awaiting_quote' ? `<form data-quote-form="${escapeHtml(order.id)}" class="flex flex-wrap items-end gap-2 rounded-xl bg-amber-50 p-3"><label class="grid gap-1 text-xs font-semibold">Harga final (rupiah)<input name="amount" type="number" min="1" step="1" required class="rounded-lg border px-3 py-2 text-sm"></label><button class="rounded-lg bg-amber-600 px-3 py-2 text-sm font-semibold text-white">${order.paymentPlan === 'cash' ? 'Kirim penawaran tunai' : 'Kirim penawaran & buat tagihan'}</button></form>` : ''}
          ${canSettleCash ? `<form data-cash-paid="${escapeHtml(order.id)}" class="mt-3 flex flex-wrap items-center gap-2"><input name="note" maxlength="300" placeholder="Catatan (opsional)" class="rounded-lg border px-3 py-2 text-sm"><button class="rounded-lg bg-emerald-700 px-3 py-2 text-sm font-semibold text-white">${order.paidAmount > 0 ? 'Tandai pelunasan tunai' : 'Tandai tunai diterima'}</button></form>` : ''}
          ${canSettleBalance ? `<div class="mt-3 flex flex-wrap gap-2"><button type="button" data-balance-invoice="${escapeHtml(order.id)}" class="rounded-lg bg-blue-700 px-3 py-2 text-sm font-semibold text-white">Buat tagihan pelunasan</button><button type="button" data-balance-cash="${escapeHtml(order.id)}" class="rounded-lg border border-emerald-300 px-3 py-2 text-sm font-semibold text-emerald-800">Tandai pelunasan tunai</button></div>` : ''}
          ${order.subscription?.status === 'active' ? `<div class="mt-3 flex flex-wrap gap-2">${order.status === 'paid' && order.paymentStatus === 'PAID' ? `<button type="button" data-next-invoice="${escapeHtml(order.id)}" class="rounded-lg bg-violet-700 px-3 py-2 text-sm font-semibold text-white">Buat tagihan bulan berikutnya</button>` : ''}<button type="button" data-end-subscription="${escapeHtml(order.id)}" class="rounded-lg border border-rose-300 px-3 py-2 text-sm font-semibold text-rose-700">Akhiri langganan</button></div>` : ''}
          ${transitionOptions ? `<form data-status-form="${escapeHtml(order.id)}" class="mt-3 flex flex-wrap items-center gap-2"><label class="sr-only" for="status-${escapeHtml(order.id)}">Status berikutnya</label><select id="status-${escapeHtml(order.id)}" name="status" class="rounded-lg border px-3 py-2 text-sm">${transitionOptions}</select><input name="note" maxlength="300" placeholder="Catatan (wajib saat membatalkan pembayaran)" class="min-w-40 rounded-lg border px-3 py-2 text-sm"><button class="rounded-lg border px-3 py-2 text-sm font-semibold">${order.status === 'awaiting_confirmation' ? 'Konfirmasi (tunai)' : 'Ubah status'}</button></form>` : ''}
          ${['paid', 'scheduled', 'in_progress', 'completed'].includes(order.status) ? `<details class="mt-4 rounded-xl border border-slate-200 p-3"><summary class="cursor-pointer font-semibold">Tugaskan petugas</summary><form data-staff-form="${escapeHtml(order.id)}" class="mt-3 grid gap-2"><label class="grid gap-1 text-xs font-semibold">Nama petugas<input name="name" required maxlength="120" value="${escapeHtml(order.assignedStaff?.name || '')}" class="rounded-lg border px-3 py-2 text-sm"></label><label class="grid gap-1 text-xs font-semibold">Catatan (opsional)<input name="note" maxlength="300" value="${escapeHtml(order.assignedStaff?.note || '')}" class="rounded-lg border px-3 py-2 text-sm"></label><button class="w-fit rounded-lg border px-3 py-2 text-sm font-semibold">Simpan petugas</button></form></details>` : ''}
          ${['paid', 'scheduled', 'in_progress', 'completed'].includes(order.status) ? `<details class="mt-4 rounded-xl border border-slate-200 p-3"><summary class="cursor-pointer font-semibold">Tambah laporan pengerjaan</summary><form data-visit-form="${escapeHtml(order.id)}" class="mt-3 grid gap-2"><label class="grid gap-1 text-xs font-semibold">Nama petugas<input name="staffName" required maxlength="120" value="${escapeHtml(order.assignedStaff?.name || '')}" class="rounded-lg border px-3 py-2 text-sm"></label><input name="note" required maxlength="300" placeholder="Ringkasan, misalnya Pengerjaan selesai" class="rounded-lg border px-3 py-2 text-sm"><textarea name="reportText" required maxlength="3000" placeholder="Tulis laporan pengerjaan (teks saja)" class="min-h-24 rounded-lg border px-3 py-2 text-sm"></textarea><button class="w-fit rounded-lg bg-slate-900 px-3 py-2 text-sm font-semibold text-white">Simpan dan kirim laporan</button></form></details>` : ''}
          <section class="mt-4"><h3 class="font-semibold">Riwayat pengerjaan</h3>${visits}</section>
        </article>`;
      }).join('');

      ordersList.querySelectorAll('[data-quote-form]').forEach((form) => form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const button = form.querySelector('button');
        button.disabled = true;
        try {
          await request('jasa-set-quote', 'POST', { orderId: form.dataset.quoteForm, amount: Number(form.elements.amount.value) });
          pageStatus.textContent = 'Penawaran berhasil dikirim.';
          await load();
        } catch (error) { pageStatus.textContent = error.message || 'Penawaran gagal disimpan.'; button.disabled = false; }
      }));
      ordersList.querySelectorAll('[data-status-form]').forEach((form) => form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const button = form.querySelector('button');
        button.disabled = true;
        try {
          const order = orders.find((item) => item.id === form.dataset.statusForm);
          if (form.elements.status.value === 'cancelled' && Number(order?.paidAmount || (order?.paymentStatus === 'PAID' ? order.totalAmount : 0)) > 0 && !form.elements.note.value.trim()) throw new Error('Catatan wajib diisi untuk pembatalan pesanan yang sudah menerima pembayaran.');
          await request('jasa-update-order-status', 'POST', { orderId: form.dataset.statusForm, status: form.elements.status.value, note: form.elements.note.value });
          pageStatus.textContent = 'Status pesanan berhasil diperbarui.';
          await load();
        } catch (error) { pageStatus.textContent = error.message || 'Status pesanan gagal diperbarui.'; button.disabled = false; }
      }));
      ordersList.querySelectorAll('[data-cash-paid]').forEach((form) => form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const button = form.querySelector('button');
        button.disabled = true;
        try {
          const result = await request('jasa-mark-cash-paid', 'POST', { orderId: form.dataset.cashPaid, note: form.elements.note.value });
          pageStatus.textContent = result.message;
          await load();
        } catch (error) { pageStatus.textContent = error.message || 'Pembayaran tunai gagal dicatat.'; button.disabled = false; }
      }));
      ordersList.querySelectorAll('[data-balance-invoice]').forEach((button) => button.addEventListener('click', async () => {
        button.disabled = true;
        try {
          const result = await request('jasa-create-balance-invoice', 'POST', { orderId: button.dataset.balanceInvoice });
          pageStatus.textContent = result.message;
          await load();
        } catch (error) { pageStatus.textContent = error.message || 'Tagihan pelunasan gagal dibuat.'; button.disabled = false; }
      }));
      ordersList.querySelectorAll('[data-balance-cash]').forEach((button) => button.addEventListener('click', async () => {
        if (!confirm('Tandai sisa pembayaran sebagai lunas tunai?')) return;
        button.disabled = true;
        try {
          const result = await request('jasa-mark-balance-cash-paid', 'POST', { orderId: button.dataset.balanceCash });
          pageStatus.textContent = result.message;
          await load();
        } catch (error) { pageStatus.textContent = error.message || 'Pelunasan tunai gagal dicatat.'; button.disabled = false; }
      }));
      ordersList.querySelectorAll('[data-next-invoice]').forEach((button) => button.addEventListener('click', async () => {
        button.disabled = true;
        try {
          const result = await request('jasa-create-next-invoice', 'POST', { orderId: button.dataset.nextInvoice });
          pageStatus.textContent = result.message;
          await load();
        } catch (error) { pageStatus.textContent = error.message || 'Tagihan siklus berikutnya gagal dibuat.'; button.disabled = false; }
      }));
      ordersList.querySelectorAll('[data-end-subscription]').forEach((button) => button.addEventListener('click', async () => {
        if (!confirm('Akhiri langganan ini?')) return;
        button.disabled = true;
        try {
          const result = await request('jasa-end-subscription', 'POST', { orderId: button.dataset.endSubscription });
          pageStatus.textContent = result.message;
          await load();
        } catch (error) { pageStatus.textContent = error.message || 'Langganan gagal diakhiri.'; button.disabled = false; }
      }));
      ordersList.querySelectorAll('[data-staff-form]').forEach((form) => form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const button = form.querySelector('button');
        button.disabled = true;
        try {
          await request('jasa-assign-staff', 'POST', { orderId: form.dataset.staffForm, name: form.elements.name.value, note: form.elements.note.value });
          pageStatus.textContent = 'Petugas pesanan berhasil diperbarui.';
          await load();
        } catch (error) { pageStatus.textContent = error.message || 'Petugas gagal disimpan.'; button.disabled = false; }
      }));
      ordersList.querySelectorAll('[data-visit-form]').forEach((form) => form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const button = form.querySelector('button');
        button.disabled = true;
        try {
          await request('jasa-add-visit-report', 'POST', { orderId: form.dataset.visitForm, staffName: form.elements.staffName.value, note: form.elements.note.value, reportText: form.elements.reportText.value });
          pageStatus.textContent = 'Laporan tersimpan dan email pembeli sudah diproses.';
          await load();
        } catch (error) { pageStatus.textContent = error.message || 'Laporan gagal disimpan.'; button.disabled = false; }
      }));
    }

    async function load() {
      ordersList.innerHTML = '<div class="rounded-2xl bg-white p-6 text-slate-500">Memuat pesanan jasa…</div>';
      const result = await request('jasa-get-orders', 'GET');
      orders = result.orders || [];
      render();
    }

    document.getElementById('refreshButton').addEventListener('click', () => load().catch((error) => { pageStatus.textContent = error.message; }));
    try { await requireAdmin(); await load(); }
    catch (error) { console.error('[jasa orders admin]', error); pageStatus.textContent = 'Pesanan gagal dimuat. Coba muat ulang halaman.'; }
  </script>
</body>
</html>
