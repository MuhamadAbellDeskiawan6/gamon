<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - Gamon Booth</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-900 flex items-center justify-center min-h-screen px-4">

    <div class="bg-slate-800 p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-700">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-pink-500">Gamon Booth 📸</h1>
            <p class="text-sm text-slate-400 mt-1">Gamon Tawing Administrator Panel</p>
        </div>

        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Email Admin</label>
                <input type="email" id="email" required 
                    class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white focus:outline-none focus:border-pink-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Password</label>
                <input type="password" id="password" required 
                    class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg text-white focus:outline-none focus:border-pink-500">
            </div>
            <button type="submit" id="btnSubmit"
                class="w-full bg-pink-600 hover:bg-pink-700 text-white font-medium py-2 rounded-lg transition duration-200 mt-2 cursor-pointer">
                Masuk ke Dashboard
            </button>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        // ⚠️ GANTI DENGAN KONFIGURASI FIREBASE WEB APP KAMU
        const firebaseConfig = {
           apiKey: "AIzaSyC247K8yyL67aWV95KNQy8CkMZsjgGCudQ",
  authDomain: "gamon-tawing.firebaseapp.com",
  projectId: "gamon-tawing",
  storageBucket: "gamon-tawing.firebasestorage.app",
  messagingSenderId: "370162915989",
  appId: "1:370162915989:web:76779062da83aa0c5c999c",
  measurementId: "G-DDRQKDZXV7"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('btnSubmit');

            btn.disabled = true;
            btn.innerText = "Memverifikasi...";

            try {
                // 1. Login menggunakan Firebase Client SDK
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const idToken = await userCredential.user.getIdToken();

                // 2. Lempar token ke API kita untuk ditukar menjadi HttpOnly Cookie
                const response = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ idToken })
                });

                const result = await response.json();

                if (response.ok) {
                    // 3. Jika API sukses mengeblok cookie, redirect ke dashboard
                    window.location.href = '/admin/dashboard.html';
                } else {
                    alert(result.message || "Akses ditolak oleh backend.");
                }
            } catch (error) {
                console.error(error);
                alert("Gagal masuk. Email/Password salah atau koneksi bermasalah.");
            } finally {
                btn.disabled = false;
                btn.innerText = "Masuk ke Dashboard";
            }
        });
    </script>
</body>
</html>
