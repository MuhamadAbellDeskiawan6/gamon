<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Halaman Tidak Ditemukan - Gamon</title>
    <style>
      :root {
        --bg: #f5f1ea;
        --card: rgba(255, 255, 255, 0.82);
        --text: #1f1b1a;
        --muted: #625a54;
        --accent: #7a5c42;
        --accent-soft: rgba(122, 92, 66, 0.1);
        --line: rgba(122, 92, 66, 0.16);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #fffdfb, var(--bg));
        color: var(--text);
        font-family: Inter, Arial, sans-serif;
        padding: 24px;
      }
      .card {
        width: min(600px, calc(100vw - 32px));
        padding: 44px 32px;
        border-radius: 28px;
        background: var(--card);
        border: 1px solid var(--line);
        box-shadow: 0 20px 70px rgba(71, 54, 43, 0.12);
        text-align: center;
      }
      .eyebrow {
        display: inline-block;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--accent);
        font-size: 12px;
        font-weight: 700;
      }
      h1 {
        margin: 16px 0 12px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2.2rem, 5vw, 3.6rem);
        line-height: 1.1;
        font-weight: 500;
      }
      p.desc {
        margin: 0 auto;
        max-width: 440px;
        line-height: 1.8;
        color: var(--muted);
      }
      .path-box {
        margin: 20px auto 0;
        max-width: 100%;
        display: inline-block;
        padding: 8px 14px;
        border-radius: 10px;
        background: var(--accent-soft);
        color: var(--accent);
        font-size: 13px;
        font-family: "Courier New", monospace;
        word-break: break-all;
      }
      .actions {
        margin-top: 28px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
      }
      .button {
        display: inline-block;
        padding: 12px 20px;
        border-radius: 999px;
        text-decoration: none;
        font-weight: 600;
        font-size: 14px;
        transition: transform 0.15s ease, opacity 0.15s ease;
      }
      .button:hover { transform: translateY(-1px); }
      .button.primary {
        background: var(--accent);
        color: #fff;
      }
      .button.secondary {
        background: transparent;
        color: var(--accent);
        border: 1px solid var(--line);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="eyebrow">404</span>
      <h1 id="title">Halaman Tidak Ditemukan</h1>
      <p class="desc" id="desc">
        Tautan yang Anda buka tidak valid, sudah kedaluwarsa, atau kontennya
        sudah tidak tersedia. Silakan periksa kembali link yang diberikan,
        atau jelajahi layanan Gamon lainnya di bawah ini.
      </p>
      <div class="path-box" id="pathBox" style="display: none"></div>

      <div class="actions">
        <a class="button primary" href="/">Kembali ke Beranda</a>
        <a class="button secondary" href="javascript:history.back()">Halaman Sebelumnya</a>
      </div>

    </main>

    <script>
      /**
       * Halaman 404 universal Gamon.
       * Logika di bawah mencoba menebak "konteks" dari path URL
       * (mis. /undangan/..., /toko/..., /invoice/...) supaya pesan &
       * saran link yang ditampilkan lebih relevan, tanpa membuat halaman
       * ini terkunci hanya untuk satu produk saja.
       *
       * Tambahkan/ubah entri di object CONTEXTS untuk produk baru di
       * ekosistem Gamon.
       */

      const CONTEXTS = {
        undangan: {
          match: ["/undangan", "/invitation", "/inv/"],
          title: "Undangan Tidak Ditemukan",
          desc: "Link undangan digital yang Anda buka tidak valid atau slug-nya sudah tidak tersedia. Pastikan Anda menyalin tautan undangan dengan lengkap dan benar.",
        },
        toko: {
          match: ["/toko", "/store", "/shop"],
          title: "Produk Tidak Ditemukan",
          desc: "Produk atau halaman toko yang Anda cari tidak tersedia. Bisa jadi sudah tidak dijual atau tautannya salah ketik.",
        },
        invoice: {
          match: ["/invoice", "/tagihan", "/payment"],
          title: "Invoice Tidak Ditemukan",
          desc: "Tautan invoice atau pembayaran ini tidak valid atau sudah kedaluwarsa. Silakan cek kembali link yang dikirimkan kepada Anda.",
        },
      };

      const DEFAULT_CONTEXT = {
        title: "Halaman Tidak Ditemukan",
        desc: "Tautan yang Anda buka tidak valid, sudah kedaluwarsa, atau kontennya sudah tidak tersedia. Silakan periksa kembali link yang diberikan.",
      };

      function detectContext(pathname) {
        for (const key in CONTEXTS) {
          const ctx = CONTEXTS[key];
          if (ctx.match.some((prefix) => pathname.toLowerCase().includes(prefix))) {
            return ctx;
          }
        }
        return DEFAULT_CONTEXT;
      }

      (function init() {
        try {
          const pathname = window.location.pathname || "";
          const ctx = detectContext(pathname);

          document.getElementById("title").textContent = ctx.title;
          document.getElementById("desc").textContent = ctx.desc;

          if (pathname && pathname !== "/") {
            const pathBox = document.getElementById("pathBox");
            pathBox.style.display = "inline-block";
            pathBox.textContent = window.location.href;
          }
        } catch (e) {
          // Jika ada error (mis. environment tanpa window.location yang normal),
          // biarkan konten default statis yang sudah ada di HTML tetap tampil.
          console.error("Gagal mendeteksi konteks halaman 404:", e);
        }
      })();
    </script>
  </body>
</html>
