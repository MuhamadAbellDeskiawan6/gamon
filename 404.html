<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Halaman Tidak Ditemukan - Gamon</title>
    <style>
      :root {
        --bg: #f5f1ea;
        --card: rgba(255,255,255,0.82);
        --text: #1f1b1a;
        --muted: #625a54;
        --accent: #7a5c42;
        --line: rgba(122,92,66,0.16);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #fffdfb, var(--bg));
        color: var(--text);
        font-family: Inter, Arial, sans-serif;
      }
      .card {
        width: min(560px, calc(100vw - 32px));
        padding: 40px 28px;
        border-radius: 28px;
        background: var(--card);
        border: 1px solid var(--line);
        box-shadow: 0 20px 70px rgba(71, 54, 43, 0.12);
        text-align: center;
      }
      .eyebrow {
        display: inline-block;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--accent);
        font-size: 12px;
        font-weight: 700;
      }
      h1 {
        margin: 16px 0 12px;
        font-family: Georgia, 'Times New Roman', serif;
        font-size: clamp(2.5rem, 5vw, 4.2rem);
        line-height: 1.05;
        font-weight: 500;
      }
      p {
        margin: 0;
        line-height: 1.8;
        color: var(--muted);
      }
      .button {
        display: inline-block;
        margin-top: 24px;
        padding: 12px 18px;
        border-radius: 999px;
        background: var(--accent);
        color: #fff;
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="eyebrow">404</span>
      <h1>Undangan tidak ditemukan</h1>
      <p>Link yang Anda buka tidak valid atau slug yang diminta tidak tersedia. Silakan cek tautan undangan yang benar atau kembali ke halaman utama.</p>
      <a class="button" href="/">Kembali ke beranda</a>
    </main>
  </body>
</html>
