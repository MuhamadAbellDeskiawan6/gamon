<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pesanan Saya — Marketplace Mantan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/style.css" />
    <link rel="stylesheet" href="assets/commerce.css" />
    <style>
      /* Badge status (dipakai daftar & detail) */
      .bg-amber-100 { background: #fef3c7; } .text-amber-800 { color: #92400e; }
      .bg-blue-100 { background: #dbeafe; } .text-blue-800 { color: #1e40af; }
      .bg-indigo-100 { background: #e0e7ff; } .text-indigo-800 { color: #3730a3; }
      .bg-cyan-100 { background: #cffafe; } .text-cyan-800 { color: #155e75; }
      .bg-emerald-100 { background: #d1fae5; } .text-emerald-800 { color: #065f46; }
      .bg-slate-100 { background: #f1f5f9; } .text-slate-700 { color: #334155; }
      .bg-rose-100 { background: #ffe4e6; } .text-rose-800 { color: #9f1239; }
      .commerce-status { display: inline-flex; align-items: center; padding: 4px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; }

      /* Tautan kembali */
      .orders-back { display: none; align-items: center; gap: 6px; margin-bottom: 14px; font-size: 14px; font-weight: 600; color: var(--primary-strong, #be185d); text-decoration: none; }
      .orders-back.is-visible { display: inline-flex; }
      .orders-back:hover { text-decoration: underline; }

      /* Banner status di halaman detail */
      .order-banner { display: flex; gap: 14px; align-items: flex-start; padding: 16px 18px; border-radius: 14px; margin-bottom: 18px; border: 1px solid transparent; }
      .order-banner .material-symbols-outlined { font-size: 28px; flex-shrink: 0; }
      .order-banner h3 { margin: 0 0 4px; font-size: 1.05rem; }
      .order-banner p { margin: 0; font-size: 14px; line-height: 1.5; }
      .order-banner.tone-success { background: #ecfdf5; border-color: #a7f3d0; color: #065f46; }
      .order-banner.tone-pending { background: #fffbeb; border-color: #fde68a; color: #92400e; }
      .order-banner.tone-info { background: #eff6ff; border-color: #bfdbfe; color: #1e40af; }
      .order-banner.tone-danger { background: #fff1f2; border-color: #fecdd3; color: #9f1239; }
      .order-banner.tone-neutral { background: #f8fafc; border-color: #e2e8f0; color: #334155; }

      /* Detail pesanan */
      .order-detail-grid { display: grid; gap: 18px; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); }
      @media (max-width: 860px) { .order-detail-grid { grid-template-columns: 1fr; } }
      .order-detail-card { border: 1px solid #e2e8f0; border-radius: 14px; background: #fff; padding: 16px 18px; }
      .order-detail-card + .order-detail-card { margin-top: 14px; }
      .order-detail-card h3 { margin: 0 0 12px; font-size: 1rem; }
      .order-detail-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
      .order-detail-head strong { font-size: 1.15rem; }
      .order-detail-head small { display: block; color: #64748b; margin-top: 2px; }
      .order-line { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid #f1f5f9; }
      .order-line:last-child { border-bottom: 0; }
      .order-line img, .order-line .order-line-fallback { width: 60px; height: 60px; border-radius: 10px; object-fit: cover; flex-shrink: 0; background: #f1f5f9; }
      .order-line .order-line-fallback { display: grid; place-items: center; font-weight: 800; color: #be185d; }
      .order-line-info { min-width: 0; flex: 1; }
      .order-line-info a, .order-line-info strong { display: block; color: inherit; font-weight: 600; text-decoration: none; overflow-wrap: anywhere; }
      .order-line-info a:hover { text-decoration: underline; }
      .order-line-info small { color: #64748b; }
      .order-sum-row { display: flex; justify-content: space-between; gap: 12px; padding: 5px 0; font-size: 14px; }
      .order-sum-row.is-total { border-top: 1px solid #e2e8f0; margin-top: 6px; padding-top: 10px; font-size: 1.05rem; font-weight: 800; }
      .order-address { font-style: normal; line-height: 1.6; font-size: 14px; }
      .order-meta-list { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; font-size: 14px; }
      .order-meta-list li { display: flex; justify-content: space-between; gap: 12px; }
      .order-meta-list span:first-child { color: #64748b; }
      .order-meta-list strong { text-align: right; overflow-wrap: anywhere; }
      .order-timeline { list-style: none; margin: 0; padding: 0 0 0 4px; display: grid; gap: 14px; }
      .order-timeline li { position: relative; padding-left: 22px; font-size: 14px; }
      .order-timeline li::before { content: ''; position: absolute; left: 0; top: 5px; width: 10px; height: 10px; border-radius: 50%; background: #be185d; }
      .order-timeline li:not(:last-child)::after { content: ''; position: absolute; left: 4px; top: 17px; bottom: -16px; width: 2px; background: #fbcfe8; }
      .order-timeline small { display: block; color: #64748b; }
      .order-detail-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
      .order-detail-map { margin-top: 10px; }
      .order-detail-map iframe { width: 100%; height: 190px; border: 0; border-radius: 10px; }
    </style>
  </head>
  <body data-page="pesanan.html">
    <header class="topbar">
      <div class="container nav">
        <a href="../../index.html" class="brand" aria-label="Home">
          <span class="brand-mark">G</span>
          <span>Marketplace Mantan</span>
        </a>
        <div class="nav-actions">
          <a class="btn btn-secondary" href="keranjang.html" data-cart-link aria-label="Keranjang"><span class="material-symbols-outlined" aria-hidden="true">shopping_cart</span> <span data-cart-count hidden>0</span></a>
          <a class="btn btn-secondary" href="profil.html">Profil</a>
          <a class="btn btn-primary" href="../../index.html" data-logout-button>Keluar</a>
        </div>
      </div>
    </header>

    <main class="container user-layout">
      <div class="user-shell">
        <aside class="sidebar">
          <div class="profile-box">
            <div class="avatar-lg" data-user-avatar></div>
            <div>
              <strong style="display:block;color:var(--primary-strong);" data-user-name>Pengguna</strong>
              <small class="muted">Pembeli</small>
            </div>
          </div>
          <nav aria-label="Sidebar navigasi">
            <a href="dashboard.html"><span class="material-symbols-outlined" style="font-size:17px;vertical-align:middle;">dashboard</span> Dashboard</a>
            <a href="beli.html"><span class="material-symbols-outlined" style="font-size:17px;vertical-align:middle;">shopping_cart</span> Katalog</a>
            <a href="keranjang.html"><span class="material-symbols-outlined" style="font-size:17px;vertical-align:middle;">shopping_bag</span> Keranjang <span data-cart-count hidden>0</span></a>
            <a class="active" href="pesanan.html"><span class="material-symbols-outlined" style="font-size:17px;vertical-align:middle;">receipt_long</span> Pesanan Saya</a>
            <a href="profil.html"><span class="material-symbols-outlined" style="font-size:17px;vertical-align:middle;">person</span> Profil</a>
            <a href="chat.html"><span class="material-symbols-outlined" style="font-size:17px;vertical-align:middle;">chat</span> Chat Admin</a>
          </nav>
          <a class="logout-link" href="../../index.html" data-logout-button>Keluar</a>
        </aside>
        <div class="main-panel">
          <section class="panel">
            <a class="orders-back" href="pesanan.html" data-orders-back>
              <span class="material-symbols-outlined" style="font-size:18px;" aria-hidden="true">arrow_back</span>
              Semua pesanan
            </a>
            <div class="top-panel" style="margin-bottom:20px;">
              <div>
                <span class="eyebrow" data-orders-eyebrow>Riwayat Pesanan</span>
                <h2 style="margin-top:12px;font-size:2rem;" data-orders-title>Pesanan Saya</h2>
              </div>
            </div>
            <p class="commerce-error" data-orders-status role="status" aria-live="polite"></p>
            <div data-buyer-orders aria-live="polite"></div>
          </section>
        </div>
      </div>
    </main>
    <script type="module" src="assets/app.js"></script>
  </body>
</html>
