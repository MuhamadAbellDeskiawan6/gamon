<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat — Marketplace Mantan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/style.css" />
    <link rel="stylesheet" href="assets/commerce.css" />
  </head>
  <body data-page="chat.html">
    <header class="topbar">
      <div class="container nav">
        <a href="../../index.html" class="brand" aria-label="Home">
          <span class="brand-mark">G</span>
          <span>Marketplace Mantan</span>
        </a>
        <div class="nav-actions">
          <a class="btn btn-secondary" href="keranjang.html" data-cart-link aria-label="Keranjang"><span class="material-symbols-outlined" aria-hidden="true">shopping_cart</span> <span data-cart-count hidden>0</span></a>
          <a class="btn btn-secondary" href="profil.html">Profil</a>
          <a class="btn btn-primary" href="../../index.html" data-logout-button>Keluar</a>
        </div>
      </div>
    </header>

    <main class="container user-layout">
      <div class="user-shell">
        <aside class="sidebar">
          <div class="profile-box">
            <div class="avatar-lg" data-user-avatar></div>
            <div>
              <strong style="display:block; color: var(--primary-strong);" data-user-name>Pengguna</strong>
              <small class="muted">Pembeli</small>
            </div>
          </div>

          <nav aria-label="Sidebar navigasi">
            <a href="dashboard.html"><span class="material-symbols-outlined" style="font-size:17px;vertical-align:middle;">dashboard</span> Dashboard</a>
            <a href="beli.html"><span class="material-symbols-outlined" style="font-size:17px;vertical-align:middle;">shopping_cart</span> Katalog</a>
            <a href="keranjang.html"><span class="material-symbols-outlined" style="font-size:17px;vertical-align:middle;">shopping_bag</span> Keranjang <span data-cart-count hidden>0</span></a>
            <a href="pesanan.html"><span class="material-symbols-outlined" style="font-size:17px;vertical-align:middle;">receipt_long</span> Pesanan Saya</a>
            <a href="profil.html"><span class="material-symbols-outlined" style="font-size:17px;vertical-align:middle;">person</span> Profil</a>
            <a class="active" href="chat.html"><span class="material-symbols-outlined" style="font-size:17px;vertical-align:middle;">chat</span> Chat Admin</a>
          </nav>
          <a class="logout-link" href="../../index.html" data-logout-button><span class="material-symbols-outlined" style="font-size:16px;vertical-align:middle;">logout</span> Keluar</a>
        </aside>

        <div class="main-panel">
          <section class="chat-shell">
            <div class="chat-conversation">
              <div class="seller-row">
                <span class="seller-meta"><span class="avatar">M</span> <span data-chat-contact>Marketplace Mantan</span></span>
                <span class="condition">Toko Resmi</span>
              </div>

              <div class="chat-product-context" data-chat-product-context hidden></div>

              <div class="chat-thread" data-chat-thread></div>
              <p class="muted" data-chat-status role="status" aria-live="polite"></p>

              <form class="chat-composer" data-chat-form>
                <textarea rows="2" placeholder="Ketik pesan..." aria-label="Pesan ke Marketplace Mantan"></textarea>
                <button class="btn btn-primary" type="submit">Kirim</button>
              </form>
            </div>
          </section>
        </div>
      </div>
    </main>
    <script type="module" src="assets/app.js"></script>
  </body>
</html>
