<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script src="assets/shop-hours.js"></script>
    <title>Beli — Marketplace Mantan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/style.css" />
    <link rel="stylesheet" href="assets/commerce.css" />
    <link rel="stylesheet" href="assets/neo.css" />
    <link rel="stylesheet" href="assets/tour.css" />
  </head>
  <body data-page="beli.html">
    <header class="topbar">
      <div class="container nav">
        <a href="../../index.html" class="brand" aria-label="Home">
          <span class="brand-mark"><img src="../../image/logo/gamonspace-transparan.png" alt="Gamon Space" width="40" height="40" /></span>
          <span>Marketplace Mantan</span>
        </a>
        <div class="nav-actions">
          <a class="btn btn-secondary" href="keranjang.html" data-cart-link aria-label="Keranjang"><span class="material-symbols-outlined" aria-hidden="true">shopping_cart</span> <span data-cart-count hidden>0</span></a>
            <a class="btn btn-secondary" href="profil.html">Profil</a>
          <a class="btn btn-primary" href="../../index.html" data-logout-button>Keluar</a>
        </div>
      </div>
    </header>

    <main class="container user-layout">
      <div class="user-shell">
        <aside class="sidebar">
          <div class="profile-box">
            <div class="avatar-lg" data-user-avatar></div>
            <div>
              <strong style="display:block; color: var(--primary-strong);" data-user-name>Pengguna</strong>
              <small class="muted">Pembeli</small>
            </div>
          </div>

          <nav aria-label="Sidebar navigasi">
            <a href="dashboard.html"><span class="material-symbols-outlined" style="font-size:17px;vertical-align:middle;">dashboard</span> Dashboard</a>
            <a class="active" href="beli.html"><span class="material-symbols-outlined" style="font-size:17px;vertical-align:middle;">shopping_cart</span> Katalog</a>
            <a href="keranjang.html"><span class="material-symbols-outlined" style="font-size:17px;vertical-align:middle;">shopping_bag</span> Keranjang <span data-cart-count hidden>0</span></a>
            <a href="pesanan.html"><span class="material-symbols-outlined" style="font-size:17px;vertical-align:middle;">receipt_long</span> Pesanan Saya</a>
            <a href="profil.html"><span class="material-symbols-outlined" style="font-size:17px;vertical-align:middle;">person</span> Profil</a>
            <a href="chat.html"><span class="material-symbols-outlined" style="font-size:17px;vertical-align:middle;">chat</span> Chat Admin</a>
          </nav>
          <a class="logout-link" href="../../index.html" data-logout-button>↩ Keluar</a>
        </aside>

        <div class="main-panel">
          <section class="panel" id="katalog">
            <div class="top-panel" style="margin-bottom: 20px;">
              <div>
                <span class="eyebrow">Belanja</span>
                <h2 style="margin-top: 12px; font-size: 2rem;">Barang yang kamu suka</h2>
              </div>
            </div>

            <div class="filter-bar">
              <div class="filter-row" role="group" aria-label="Filter produk">
                <button class="filter-pill active" type="button" data-filter="all">Semua</button>
                <button class="filter-pill" type="button" data-filter="pakaian">Pakaian</button>
                <button class="filter-pill" type="button" data-filter="aksesori">Aksesori</button>
                <button class="filter-pill" type="button" data-filter="barang">Barang Lain</button>
                <button class="filter-pill" type="button" data-filter="gratis">🎁 Gratis</button>
              </div>
              <label class="sort-box">
                <span>Urutkan</span>
                <select class="sort-select" data-sort-select aria-label="Urutkan produk">
                  <option value="newest">Terbaru</option>
                  <option value="price-asc">Harga: termurah ke termahal</option>
                  <option value="price-desc">Harga: termahal ke termurah</option>
                </select>
              </label>
            </div>

            <div class="grid-products" data-product-list></div>
          </section>
        </div>
      </div>
    </main>
    <script type="module" src="assets/app.js"></script>
  </body>
</html>
