<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Detail Barang — Marketplace Mantan</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="assets/style.css"/>
<link rel="stylesheet" href="assets/commerce.css"/>
<style>
:root{--sky:#d4e9f5;--ink:#0b2342;--coral:#ff5c7a;--sun:#ffd66b;--white:#fff;--mute:#47607c;--f-d:"Bricolage Grotesque","Inter",system-ui,sans-serif;--f-b:"Inter",system-ui,sans-serif}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font-family:var(--f-b);background:var(--sky)!important;color:var(--ink);line-height:1.6;overflow-x:hidden;min-height:100vh}
h1,h2,h3{font-family:var(--f-d)!important;font-weight:800;letter-spacing:-.02em;line-height:1.1;color:var(--ink)!important;margin:0}
p{margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--coral);outline-offset:3px}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:400;font-style:normal;line-height:1;display:inline-block;vertical-align:middle}
.muted{color:var(--mute)!important}

/* Tombol */
.btn,.commerce-quantity button{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border:2px solid var(--ink)!important;border-radius:12px!important;background:var(--white)!important;background-image:none!important;color:var(--ink)!important;font:600 .95rem var(--f-b)!important;text-decoration:none!important;cursor:pointer;box-shadow:3px 3px 0 var(--ink)!important;filter:none!important;transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)!important}
.btn-primary{background:var(--coral)!important}

/* Header */
.topbar{position:sticky;top:0;z-index:50;background:var(--sky)!important;border-bottom:2px solid var(--ink)!important;padding-top:env(safe-area-inset-top,0px);box-shadow:none!important;backdrop-filter:none!important}
.topbar .nav{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;width:min(1180px,calc(100% - 32px));margin:0 auto}
.brand{display:inline-flex;align-items:center;gap:10px;font:800 1.15rem var(--f-d);text-decoration:none;letter-spacing:-.02em;color:var(--ink)}
.brand-mark{display:grid;place-items:center;width:36px;height:36px;border:2px solid var(--ink);border-radius:10px;background:var(--sun)!important;color:var(--ink)!important;box-shadow:2px 2px 0 var(--ink);font:800 1.1rem var(--f-d)}
.nav-actions{display:flex;gap:10px;align-items:center}
.nav-actions .btn{padding:9px 16px;font-size:.92rem!important}
[data-cart-count]{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border:2px solid var(--ink);border-radius:999px;background:var(--sun);font:700 .72rem var(--f-b)}

/* Layout */
.user-layout{width:min(1180px,calc(100% - 32px))!important;margin:0 auto!important;padding:28px 0 72px!important;max-width:none!important}
.user-layout>.panel{background:transparent!important;border:0!important;box-shadow:none!important;padding:0!important}
.top-panel{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px!important}
.listing-layout{display:grid!important;grid-template-columns:1.15fr .85fr;gap:26px;align-items:start}

/* Kartu */
.listing-card,.listing-layout>.panel{background:var(--white)!important;border:2px solid var(--ink)!important;border-radius:20px!important;box-shadow:6px 6px 0 var(--ink)!important;overflow:hidden;backdrop-filter:none!important}
.listing-layout>.panel{padding:26px!important;overflow:visible}
.listing-body{padding:22px 24px 26px!important}
.detail-gallery{border-bottom:2px solid var(--ink)!important;background:var(--sky)}
.detail-gallery img{width:100%;object-fit:cover}
.detail-image-fallback{background:var(--sun)!important;color:var(--ink)!important;font-family:var(--f-d)}
.detail-gallery [class*="dot"]{border:2px solid var(--ink)!important;box-shadow:none!important}

.product-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.price{font:800 clamp(1.7rem,4vw,2.2rem) var(--f-d)!important;color:var(--ink)!important;letter-spacing:-.02em}
.condition,.meta-tag{display:inline-flex;align-items:center;padding:5px 14px;border:2px solid var(--ink)!important;border-radius:999px!important;background:var(--sun)!important;color:var(--ink)!important;font:600 .85rem var(--f-b)!important;box-shadow:none!important}
.meta-tag{background:var(--white)!important}
.listing-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}

.commerce-quantity{display:inline-flex;align-items:center;gap:6px;padding:4px;border:2px solid var(--ink)!important;border-radius:14px!important;background:var(--white)!important;box-shadow:3px 3px 0 var(--ink)!important}
.commerce-quantity button{width:34px;height:34px;padding:0;box-shadow:none!important;border-radius:10px!important;font-size:1.1rem!important}
.commerce-quantity button:hover{transform:none;background:var(--sky)!important}
.commerce-quantity output{min-width:30px;text-align:center;font-weight:700}

[data-add-to-cart]{background:var(--coral)!important}
.ship-note{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:14px;padding:12px 14px;border:2px dashed var(--ink);border-radius:14px;background:var(--sky);font:600 .88rem var(--f-b)}
.ship-note span{display:inline-flex;align-items:center;gap:6px}
.ship-note .material-symbols-outlined{font-size:18px}

/* Panel toko */
.eyebrow{display:inline-block;padding:5px 14px;border:2px solid var(--ink)!important;border-radius:999px;background:var(--sun)!important;color:var(--ink)!important;font:600 .85rem var(--f-b)!important;box-shadow:3px 3px 0 var(--ink)}
.seller-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.seller-meta{display:inline-flex;align-items:center;gap:10px;font-weight:600}
.avatar{display:grid;place-items:center;width:38px;height:38px;border:2px solid var(--ink)!important;border-radius:50%!important;background:var(--coral)!important;color:var(--ink)!important;font:800 1rem var(--f-d)}
.field{display:grid;gap:8px;margin-top:18px}
.field label{font-weight:700;font-size:.92rem;color:var(--ink)}
.field input,.field textarea{width:100%;padding:12px 14px;border:2px solid var(--ink)!important;border-radius:12px!important;background:var(--white)!important;color:var(--ink)!important;font:500 .98rem var(--f-b)!important;box-shadow:none!important}
.field textarea{min-height:130px;resize:vertical;line-height:1.55}
.map-preview{min-height:210px;border:2px solid var(--ink)!important;border-radius:14px!important;background:var(--sky)!important;overflow:hidden;display:grid;place-items:center;box-shadow:none!important}
.map-preview iframe,.map-preview img{width:100%;height:100%;min-height:210px;border:0}
.map-placeholder{font-size:2.4rem}

/* Responsif */
@media(max-width:900px){
 .listing-layout{grid-template-columns:1fr}
 .user-layout{padding:20px 0 56px!important}
 .listing-body{padding:18px!important}
 .listing-layout>.panel{padding:20px!important}
}
@media(max-width:520px){
 .brand span:last-child{font-size:1rem}
 .nav-actions .btn{padding:8px 12px;font-size:.85rem!important}
 .top-panel .btn{flex:1}
 .top-panel>div{width:100%}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body data-page="product.html">
<header class="topbar">
  <div class="container nav">
    <a href="index.html" class="brand" aria-label="Home">
      <span class="brand-mark">G</span>
      <span>Marketplace Mantan</span>
    </a>
    <div class="nav-actions">
      <a class="btn btn-secondary" href="keranjang.html" data-cart-link aria-label="Keranjang"><span class="material-symbols-outlined" aria-hidden="true">shopping_cart</span> <span data-cart-count hidden>0</span></a>
      <a class="btn btn-secondary" href="login.html">Masuk</a>
      <a class="btn btn-primary" href="register.html">Daftar</a>
    </div>
  </div>
</header>

<main class="container user-layout">
  <div class="panel" style="padding: 24px;">
    <div class="top-panel" style="margin-bottom: 18px;">
      <button class="btn btn-secondary" type="button" data-back-button>← Kembali</button>
      <div style="display:flex; gap:10px; flex-wrap:wrap;">
        <a class="btn btn-secondary" href="login.html" data-chat-product>Chat Admin</a>
        <button class="btn btn-primary" type="button" data-buy-now>Beli Sekarang</button>
      </div>
    </div>

    <div class="listing-layout">
      <div class="listing-card">
        <div class="detail-gallery" data-detail-gallery>
          <div class="detail-slide active">
            <div class="detail-image-fallback">G</div>
          </div>
        </div>
        <div class="listing-body">
          <div class="product-head">
            <div class="price" data-detail-price>Rp 0</div>
            <span class="condition" data-detail-condition>Layak pakai</span>
          </div>
          <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;">
            <span class="condition" data-detail-stock>Stok: 0</span>
            <div class="commerce-quantity" aria-label="Jumlah barang">
              <button type="button" data-product-quantity-step="-1" aria-label="Kurangi jumlah">−</button>
              <output data-product-quantity>1</output>
              <button type="button" data-product-quantity-step="1" aria-label="Tambah jumlah">+</button>
            </div>
          </div>
          <button class="btn btn-secondary" type="button" data-add-to-cart style="margin-top:12px;width:100%;">Tambah ke Keranjang</button>
          <div class="ship-note">
            <span><span class="material-symbols-outlined" aria-hidden="true">local_shipping</span> Gratis ongkir, diantar ke alamatmu</span>
            <span><span class="material-symbols-outlined" aria-hidden="true">lock</span> Bayar aman via DOKU</span>
          </div>
          <h3 style="margin-top: 18px;" data-detail-name>Nama barang</h3>
          <p class="muted" style="margin-top: 10px;" data-detail-description>Deskripsi</p>
          <div class="listing-meta">
            <span class="meta-tag" data-detail-category>Pakaian</span>
            <span class="meta-tag" data-detail-city>Jakarta</span>
            <!-- Tag cerita dinonaktifkan. Elemen dipertahankan (tersembunyi) agar app.js tidak error jika masih mengisinya. -->
            <span class="meta-tag" data-detail-story hidden></span>
            <span class="meta-tag" data-detail-status>Ready</span>
          </div>
        </div>
      </div>

      <div class="panel">
        <span class="eyebrow">Informasi toko</span>
        <div class="seller-row" style="margin-top: 18px;">
          <span class="seller-meta"><span class="avatar" data-detail-seller-initial>G</span> <span data-detail-seller>Marketplace Mantan</span></span>
          <span class="condition">Toko Resmi</span>
        </div>

        <div class="field" style="margin-top: 20px;">
          <label>Alamat lengkap</label>
          <input type="text" value="Jakarta Selatan" readonly data-detail-location />
        </div>

        <div class="field">
          <label>Lokasi</label>
          <div class="map-preview" data-detail-map>
            <div class="map-placeholder">📍</div>
          </div>
        </div>

        <!-- Deskripsi singkat dihapus dari tampilan (sebelumnya berisi catatan cerita).
             Elemen dipertahankan tersembunyi agar app.js tidak error. -->
        <div class="field" hidden>
          <textarea readonly data-detail-summary></textarea>
        </div>
      </div>
    </div>
  </div>
</main>

<script type="module" src="assets/app.js"></script>
</body>
</html>
