<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<script src="assets/shop-hours.js"></script>
<title>Detail Barang — Marketplace Mantan</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="assets/style.css"/>
<link rel="stylesheet" href="assets/commerce.css"/>
<link rel="stylesheet" href="assets/tour.css"/>
<style>
:root{--sky:#d4e9f5;--ink:#0b2342;--coral:#ff5c7a;--sun:#ffd66b;--white:#fff;--mute:#47607c;--f-d:"Bricolage Grotesque","Inter",system-ui,sans-serif;--f-b:"Inter",system-ui,sans-serif;
  /* Token card: dipakai SEMUA card di halaman ini agar konsisten */
  --card-r:16px;--card-shadow:4px 4px 0 var(--ink);--card-pad:16px;--card-w:400px}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font-family:var(--f-b);background:var(--sky)!important;color:var(--ink);line-height:1.55;overflow-x:hidden;min-height:100vh}
h1,h2,h3{font-family:var(--f-d)!important;font-weight:800;letter-spacing:-.02em;line-height:1.15;color:var(--ink)!important;margin:0}
p{margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--coral);outline-offset:3px}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:400;font-style:normal;line-height:1;display:inline-block;vertical-align:middle}
.muted{color:var(--mute)!important}

/* Tombol */
.btn,.commerce-quantity button{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border:2px solid var(--ink)!important;border-radius:12px!important;background:var(--white)!important;background-image:none!important;color:var(--ink)!important;font:600 .9rem var(--f-b)!important;text-decoration:none!important;cursor:pointer;box-shadow:3px 3px 0 var(--ink)!important;filter:none!important;transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)!important}
.btn-primary{background:var(--coral)!important}

/* Header (lebar sama dengan index: 1080px) */
.topbar{position:sticky;top:0;z-index:50;background:var(--sky)!important;border-bottom:2px solid var(--ink)!important;padding-top:env(safe-area-inset-top,0px);box-shadow:none!important;backdrop-filter:none!important}
.topbar .nav{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0;width:min(1080px,calc(100% - 32px));margin:0 auto}
.brand{display:inline-flex;align-items:center;gap:10px;font:800 1.1rem var(--f-d);text-decoration:none;letter-spacing:-.02em;color:var(--ink)}
.brand-mark{display:grid;place-items:center;flex:none;width:38px;height:38px;padding:3px;border:2px solid var(--ink);border-radius:10px;background:var(--white);box-shadow:2px 2px 0 var(--ink);overflow:hidden}
.brand-mark img{display:block;width:100%;height:100%;object-fit:contain}
.nav-actions{display:flex;gap:10px;align-items:center}
.nav-actions .btn{padding:8px 14px;font-size:.88rem!important}
[data-cart-count]{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border:2px solid var(--ink);border-radius:999px;background:var(--sun);font:700 .72rem var(--f-b)}

/* Layout */
.user-layout{width:min(1080px,calc(100% - 32px))!important;margin:0 auto!important;padding:22px 0 64px!important;max-width:none!important}
.user-layout>.panel{background:transparent!important;border:0!important;box-shadow:none!important;padding:0!important}
.top-panel{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px!important}
/* Desktop: kolom kiri = produk (lebar proporsional), kolom kanan = info toko mengisi sisa ruang */
.listing-layout{display:grid!important;grid-template-columns:minmax(0,clamp(320px,40%,440px)) minmax(0,1fr);gap:24px;align-items:start;justify-content:stretch}
.listing-layout>.panel{position:sticky;top:84px}

/* Semua card: ukuran, radius, bayangan & padding sama */
.listing-card,.listing-layout>.panel{width:100%;background:var(--white)!important;border:2px solid var(--ink)!important;border-radius:var(--card-r)!important;box-shadow:var(--card-shadow)!important;overflow:hidden;backdrop-filter:none!important}
.listing-layout>.panel{padding:var(--card-pad)!important;overflow:visible}
.listing-body{padding:var(--card-pad)!important}

/* Galeri foto: potret 3:4, penuh selebar card (sama seperti kartu katalog) */
.detail-gallery{position:relative;width:100%;aspect-ratio:3/4;height:auto!important;min-height:0!important;max-height:none!important;margin:0;overflow:hidden;background:var(--sky);border-bottom:2px solid var(--ink)!important}
.detail-gallery .detail-slide,
.detail-gallery [class*="track"],
.detail-gallery [class*="slides"]{width:100%;height:100%;min-height:0!important}
.detail-gallery .detail-slide{display:none;position:relative}
.detail-gallery .detail-slide.active{display:block}
.detail-gallery img,
.detail-gallery picture,
.detail-gallery video{display:block;width:100%!important;height:100%!important;max-height:none!important;object-fit:cover;object-position:center}
.detail-image-fallback{display:grid;place-items:center;width:100%;height:100%;min-height:0!important;background:var(--sun)!important;color:var(--ink)!important;font:800 clamp(3rem,10vw,4.5rem) var(--f-d)}
.detail-gallery [class*="dot"]{border:2px solid var(--ink)!important;box-shadow:none!important}

.product-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.price{font:800 clamp(1.35rem,3.4vw,1.6rem) var(--f-d)!important;color:var(--ink)!important;letter-spacing:-.02em}
.condition,.meta-tag{display:inline-flex;align-items:center;padding:3px 11px;border:2px solid var(--ink)!important;border-radius:999px!important;background:var(--sun)!important;color:var(--ink)!important;font:600 .78rem var(--f-b)!important;box-shadow:none!important}
.meta-tag{background:var(--white)!important}
.meta-tag.views-tag{gap:5px;background:var(--sky)!important}
.meta-tag.views-tag .material-symbols-outlined{font-size:16px}
.listing-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.stock-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}
.listing-title{margin-top:14px;font-size:1.1rem!important}
.listing-desc{margin-top:6px;font-size:.9rem}

.commerce-quantity{display:inline-flex;align-items:center;gap:4px;padding:3px;border:2px solid var(--ink)!important;border-radius:12px!important;background:var(--white)!important;box-shadow:2px 2px 0 var(--ink)!important}
.commerce-quantity button{width:30px;height:30px;padding:0;box-shadow:none!important;border-radius:8px!important;font-size:1rem!important}
.commerce-quantity button:hover{transform:none;background:var(--sky)!important}
.commerce-quantity output{min-width:26px;text-align:center;font-weight:700;font-size:.92rem}

[data-add-to-cart]{background:var(--coral)!important;margin-top:10px;width:100%}
.ship-note{display:grid;gap:4px;margin-top:12px;padding:10px 12px;border:2px dashed var(--ink);border-radius:12px;background:var(--sky);font:600 .8rem var(--f-b)}
.ship-note span{display:flex;align-items:center;gap:6px}
.ship-note .material-symbols-outlined{font-size:17px;flex:none}

/* Panel toko */
.eyebrow{display:inline-block;padding:3px 12px;border:2px solid var(--ink)!important;border-radius:999px;background:var(--sun)!important;color:var(--ink)!important;font:600 .8rem var(--f-b)!important;box-shadow:2px 2px 0 var(--ink)}
.seller-row{display:flex;align-items:center;gap:12px;margin-top:14px}
.seller-text{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0}
.seller-name{font:800 1.05rem/1.2 var(--f-d);color:var(--ink)!important;opacity:1!important;overflow-wrap:anywhere}
.seller-badge{display:inline-flex;align-items:center;gap:4px;font:600 .8rem var(--f-b);color:var(--mute)}
.seller-badge .material-symbols-outlined{font-size:16px;color:#1a8f4c;font-variation-settings:"FILL" 1}

/* Avatar toko = logo Gamon Space (huruf dari app.js disembunyikan, logo lewat background) */
.avatar{flex:none;display:block;width:40px;height:40px;border:2px solid var(--ink)!important;border-radius:50%!important;background:var(--white) url("../../image/logo/gamonspace-transparan.png") center/76% no-repeat!important;color:transparent!important;font-size:0!important;line-height:0;overflow:hidden;text-indent:-9999px}

/* Info blok: teks biasa, bukan input */
.info-block{margin-top:16px}
.info-label{display:flex;align-items:center;gap:6px;font:700 .8rem var(--f-b);color:var(--mute);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.info-label .material-symbols-outlined{font-size:17px;color:var(--ink)}
.info-text{font:500 .92rem/1.6 var(--f-b);color:var(--ink);white-space:normal;overflow-wrap:anywhere;word-break:break-word}
.map-preview{min-height:clamp(200px,28vw,300px);border:2px solid var(--ink)!important;border-radius:12px!important;background:var(--sky)!important;overflow:hidden;display:grid;place-items:center;box-shadow:none!important}
.map-preview iframe,.map-preview img{width:100%;height:100%;min-height:inherit;border:0}
.map-placeholder{font-size:2rem}

/* Responsif */
/* Tablet & HP: 1 kolom, kedua card sama lebar dan rata tengah */
@media(max-width:860px){
 .listing-layout{grid-template-columns:minmax(0,560px);justify-content:center;gap:18px}
 .listing-layout>.panel{position:static}
 .top-panel{width:min(100%,560px);margin-left:auto;margin-right:auto}
 .map-preview{min-height:240px}
}
/* Layar sangat lebar: beri ruang sedikit lebih lega */
@media(min-width:1400px){
 .topbar .nav,.user-layout{width:min(1180px,calc(100% - 64px))!important}
 .listing-layout{grid-template-columns:minmax(0,460px) minmax(0,1fr)}
}
@media(max-width:520px){
 :root{--card-pad:14px}
 .listing-layout{grid-template-columns:minmax(0,1fr)}
 .top-panel{width:100%}
 .map-preview{min-height:200px}
 .brand span:last-child{font-size:1rem}
 .nav-actions .btn{padding:7px 11px;font-size:.82rem!important}
 .top-panel .btn{flex:1}
 .top-panel>div{width:100%}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* ===== SKELETON LOADING ===== */
@keyframes sk-shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
body.is-loading [data-sk],
.views-tag.sk{
  color:transparent!important;
  background:linear-gradient(90deg,#e3edf5 25%,#f6fafd 50%,#e3edf5 75%)!important;
  background-size:200% 100%!important;
  animation:sk-shimmer 1.3s linear infinite;
  border-color:transparent!important;
  box-shadow:none!important;
  border-radius:10px!important;
  pointer-events:none;
  user-select:none;
}
body.is-loading [data-sk] *,
.views-tag.sk *{visibility:hidden}

/* Ukuran tiap blok skeleton (karena isinya masih kosong) */
body.is-loading .detail-gallery[data-sk]{border-radius:0!important}
body.is-loading .price[data-sk]{width:150px;height:32px}
body.is-loading .condition[data-sk],
body.is-loading .meta-tag[data-sk],
.views-tag.sk{min-width:92px;min-height:30px}
body.is-loading [data-add-to-cart][data-sk]{min-height:44px}
body.is-loading .listing-title[data-sk]{width:65%;height:24px}
body.is-loading .listing-desc[data-sk]{width:100%;height:64px}
body.is-loading .info-text[data-sk]{width:85%;height:44px}
body.is-loading .map-preview[data-sk]{border-radius:12px!important}

/* Tombol atas tidak bisa diklik selama loading */
body.is-loading [data-chat-product],
body.is-loading [data-buy-now]{pointer-events:none;opacity:.5}
.btn:disabled{opacity:.55;cursor:not-allowed}
</style>
</head>
<body data-page="product.html" class="is-loading" aria-busy="true">
<header class="topbar">
  <div class="container nav">
    <a href="index.html" class="brand" aria-label="Home">
      <span class="brand-mark"><img src="../../image/logo/gamonspace-transparan.png" alt="Gamon Space"/></span>
      <span>Marketplace Mantan</span>
    </a>
    <div class="nav-actions">
      <a class="btn btn-secondary" href="keranjang.html" data-cart-link aria-label="Keranjang"><span class="material-symbols-outlined" aria-hidden="true">shopping_cart</span> <span data-cart-count hidden>0</span></a>
      <a class="btn btn-secondary" href="login.html">Masuk</a>
      <a class="btn btn-primary" href="register.html">Daftar</a>
    </div>
  </div>
</header>

<main class="container user-layout">
  <div class="panel">
    <div class="top-panel">
      <button class="btn btn-secondary" type="button" data-back-button>← Kembali</button>
      <div style="display:flex; gap:10px; flex-wrap:wrap;">
        <a class="btn btn-secondary" href="login.html" data-chat-product>Chat Admin</a>
        <button class="btn btn-primary" type="button" data-buy-now disabled>Beli Sekarang</button>
      </div>
    </div>

    <div class="listing-layout">
      <div class="listing-card">
        <div class="detail-gallery" data-detail-gallery data-sk></div>
        <div class="listing-body">
          <div class="product-head">
            <div class="price" data-detail-price data-sk></div>
            <span class="condition" data-detail-condition data-sk></span>
          </div>
          <div class="stock-row">
            <span class="condition" data-detail-stock data-sk></span>
            <div class="commerce-quantity" aria-label="Jumlah barang" data-sk>
              <button type="button" data-product-quantity-step="-1" aria-label="Kurangi jumlah">−</button>
              <output data-product-quantity>1</output>
              <button type="button" data-product-quantity-step="1" aria-label="Tambah jumlah">+</button>
            </div>
          </div>
          <button class="btn btn-secondary" type="button" data-add-to-cart data-sk disabled>Tambah ke Keranjang</button>
          <div class="ship-note">
            <span><span class="material-symbols-outlined" aria-hidden="true">local_shipping</span> Gratis ongkir, diantar ke alamatmu</span>
            <span><span class="material-symbols-outlined" aria-hidden="true">lock</span> Bayar aman via DOKU</span>
          </div>
          <h3 class="listing-title" data-detail-name data-sk></h3>
          <p class="muted listing-desc" data-detail-description data-sk></p>
          <div class="listing-meta">
            <span class="meta-tag" data-detail-category data-sk></span>
            <span class="meta-tag" data-detail-city data-sk></span>
            <span class="meta-tag" data-detail-story hidden></span>
            <span class="meta-tag" data-detail-status data-sk></span>
            <span class="meta-tag views-tag sk" title="Berapa kali halaman produk ini dikunjungi">
              <span class="material-symbols-outlined" aria-hidden="true">visibility</span>
              <span data-detail-views-count aria-live="polite"></span>
            </span>
          </div>
        </div>
      </div>

      <div class="panel">
        <span class="eyebrow">Informasi toko</span>
        <div class="seller-row">
          <span class="avatar" data-detail-seller-initial aria-hidden="true">G</span>
          <div class="seller-text">
            <span class="seller-name" data-detail-seller>Marketplace Mantan</span>
            <span class="seller-badge"><span class="material-symbols-outlined" aria-hidden="true">verified</span> Toko Resmi</span>
          </div>
        </div>

        <div class="info-block">
          <div class="info-label"><span class="material-symbols-outlined" aria-hidden="true">home_pin</span> Alamat lengkap</div>
          <input type="hidden" value="" data-detail-location />
          <p class="info-text" data-location-text data-sk></p>
        </div>

        <div class="info-block">
          <div class="info-label"><span class="material-symbols-outlined" aria-hidden="true">location_on</span> Lokasi</div>
          <div class="map-preview" data-detail-map data-sk></div>
        </div>

        <div hidden>
          <textarea readonly data-detail-summary></textarea>
        </div>
      </div>
    </div>
  </div>
</main>

<script type="module" src="assets/app.js"></script>
<script>
/* Salin isi alamat dari input tersembunyi (diisi app.js) ke teks yang tampil */
(function(){
  var src=document.querySelector('[data-detail-location]');
  var out=document.querySelector('[data-location-text]');
  if(!src||!out)return;
  var last=null;
  function sync(){
    var v=String(src.value||'').trim();
    if(v!==last){last=v;out.textContent=v;}
  }
  sync();
  src.addEventListener('input',sync);
  setInterval(sync,400);
})();
</script>
</body>
</html>
