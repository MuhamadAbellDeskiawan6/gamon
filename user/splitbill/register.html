<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Daftar | Split Bill Couple</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="assets/sb.css"/>
</head>
<body data-page="sb-register">
<div class="auth">
  <div class="card">
    <a class="brand" href="index.html" style="margin-bottom:16px"><img src="../../image/logo/gamonspace-transparan.png" alt="Gamon Space"/><span>Split Bill Couple</span></a>
    <h1>Daftar</h1>
    <p class="muted" style="margin-bottom:16px">Akun ini juga bisa dipakai di Marketplace Mantan dan Gamon Jasa.</p>

    <p class="msg" id="msg" role="status" hidden></p>

    <button type="button" class="btn alt block" id="google">Daftar dengan Google (tanpa email verifikasi)</button>
    <div class="sep">atau daftar dengan email</div>

    <form id="f">
      <div class="row2">
        <div class="field"><label for="firstName">Nama depan</label><input id="firstName" required/></div>
        <div class="field"><label for="lastName">Nama belakang</label><input id="lastName" required/></div>
      </div>
      <div class="field"><label for="email">Email aktif</label><input id="email" type="email" autocomplete="email" required/><small class="muted">Link verifikasi dikirim ke sini. Cek folder Spam jika tidak muncul.</small></div>
      <div class="field"><label for="phone">Nomor HP</label><input id="phone" type="tel" placeholder="08xxxxxxxxxx" required/></div>
      <div class="field"><label for="password">Password</label><input id="password" type="password" minlength="6" autocomplete="new-password" placeholder="Minimal 6 karakter" required/></div>
      <label style="display:flex;gap:8px;align-items:flex-start;margin-bottom:14px;font-size:.9rem"><input type="checkbox" id="agree" required style="width:auto;margin-top:4px"/> Saya setuju dengan syarat dan ketentuan.</label>
      <button class="btn block" type="submit" id="submit">Buat akun</button>
    </form>
    <p style="margin-top:16px;text-align:center">Sudah punya akun? <a href="login.html"><b>Masuk</b></a></p>
  </div>
</div>
<script type="module" src="assets/sb.js"></script>
</body>
</html>
