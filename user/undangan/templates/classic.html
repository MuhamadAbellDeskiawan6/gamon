    <style>
      .floral-divider {
        height: 1px;
        background: linear-gradient(to right, transparent, #d3c5ad, transparent);
        position: relative;
        margin: 2rem 0;
      }
      .floral-divider::after {
        content: "✦";
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #d3c5ad;
        background-color: #fbf9f8;
        padding: 0 10px;
        font-size: 14px;
      }
      .soft-shadow { box-shadow: 0 10px 30px rgba(77, 99, 86, 0.08); }
      .gold-border-focus:focus-within { border-bottom-color: #d3c5ad; box-shadow: 0 1px 0 #d3c5ad; }
      input[type="radio"]:checked, input[type="checkbox"]:checked { background-color: #4d6356; border-color: #4d6356; }
      .timer-unit {
        display: flex;
        flex-direction: column;
        align-items: center;
        background-color: rgba(251, 249, 248, 0.8);
        padding: 12px;
        border-radius: 8px;
        min-width: 60px;
        border: 1px solid rgba(211, 197, 173, 0.3);
